<title>Rota do Milhão</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: painel de comando da Infinity Guard — azul-marinho e ouro da logo, faixa de status no topo, missão do horário em destaque, abas embaixo no celular */
:root{
  --bg:#F6F2EA; --surface:#FFFFFF; --sunken:#ECE5D6; --line:#D9CDB5;
  --fg:#001121; --muted:#55606F;
  --accent:#0B2240; --accent-fg:#E5C069; --accent-soft:#E2E7F0; --gold:#8F6A2B;
  --signal:#B4541B; --signal-soft:#FBE6D6;
  --danger:#B42318; --danger-soft:#FBE1DE;
  --ok:#2E7D4F; --ok-soft:#DCEFE2;
  --f-display:"Cinzel","Trajan Pro",Georgia,serif;
  --f-ui:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000E1C; --surface:#061A33; --sunken:#000A15; --line:#1C3354;
  --fg:#F3EFEA; --muted:#A5AEBD;
  --accent:#D4AF5F; --accent-fg:#00111F; --accent-soft:#2A2412; --gold:#E5C069;
  --signal:#F08A4B; --signal-soft:#3A2111;
  --danger:#FF7A6B; --danger-soft:#3D1A17;
  --ok:#5CCB86; --ok-soft:#123322; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000E1C; --surface:#061A33; --sunken:#000A15; --line:#1C3354;
  --fg:#F3EFEA; --muted:#A5AEBD;
  --accent:#D4AF5F; --accent-fg:#00111F; --accent-soft:#2A2412; --gold:#E5C069;
  --signal:#F08A4B; --signal-soft:#3A2111;
  --danger:#FF7A6B; --danger-soft:#3D1A17;
  --ok:#5CCB86; --ok-soft:#123322; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.5rem;font-weight:700;letter-spacing:.01em}
h3{font-family:var(--f-ui)}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}

/* topo */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .in{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.12rem;letter-spacing:.04em;display:flex;align-items:center;gap:10px;color:var(--fg)}
.brand img{width:36px;height:36px;border-radius:50%;flex:none;box-shadow:0 0 0 1px var(--gold)}
header.top{border-bottom:2px solid var(--gold)!important}
.brand svg{flex:none}
.brand small{font-family:var(--f-body);font-weight:500;font-size:.72rem;letter-spacing:.02em;color:var(--gold)}
.status{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;background:var(--sunken);color:var(--fg);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--signal-soft);color:var(--signal)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

nav.tabs{display:flex;gap:4px;max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 8px;overflow-x:auto}
nav.tabs button{background:none;border:0;color:var(--muted);font:600 .9rem var(--f-body);padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
@media (max-width:720px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);margin:0;max-width:none;justify-content:space-between;padding-block:6px calc(6px + env(safe-area-inset-bottom,0px))}
  nav.tabs{gap:0}
  nav.tabs button{flex:1;min-width:0;padding:8px 1px;font-size:.64rem;letter-spacing:-.01em;display:flex;flex-direction:column;align-items:center;gap:2px}
}
nav.tabs svg{width:18px;height:18px}
@media (min-width:721px){nav.tabs svg{display:none}}

section.view{padding-top:20px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flat{background:transparent;border-style:dashed}

/* bloco da missão do horário */
.shift{border-radius:var(--r);background:var(--surface);border:1px solid var(--line);overflow:hidden}
.shift-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--sunken)}
.shift-head .clock{font-family:var(--f-mono);font-size:1.6rem;font-weight:500;color:var(--gold)}
.shift-body{padding:6px 16px 14px}
.mission{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.mission:last-child{border-bottom:0}
.mission .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);margin-top:2px;display:grid;place-items:center}
.mission.done .box{background:var(--ok);border-color:var(--ok)}
.mission.late .box{border-color:var(--danger)}
.mission .t{font-weight:600}
.mission.done .t{color:var(--muted);text-decoration:line-through}
.mission .d{grid-column:2;color:var(--muted);font-size:.9rem}
.mission .act{grid-column:2;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.mission .proof{grid-column:2;font-size:.85rem;background:var(--ok-soft);color:var(--fg);border-radius:6px;padding:6px 8px;overflow-wrap:anywhere}
.tag{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--sunken);color:var(--muted)}
.tag.late{background:var(--danger-soft);color:var(--danger)}
.tag.now{background:var(--signal-soft);color:var(--signal)}

button.btn,.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 .88rem var(--f-body);padding:8px 14px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--gold);color:var(--accent-fg)}
.btn.signal{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

label.f{display:flex;flex-direction:column;gap:4px;font-size:.84rem;font-weight:600;color:var(--muted)}
input,textarea,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

/* cobrança */
.debt{border:2px solid var(--danger);background:var(--danger-soft);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.debt h3{color:var(--danger)}

/* medidor */
.meter{height:12px;background:var(--sunken);border-radius:999px;overflow:hidden;position:relative}
.meter>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:999px}
.meter>b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--signal)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-family:var(--f-mono);font-size:1.3rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:.8rem;color:var(--muted)}

/* trilha */
.phase{display:flex;flex-direction:column;gap:8px}
.phase-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mods{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.mod{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font:inherit;color:inherit;width:100%}
.mod:last-child{border-bottom:0}
.mod .wk{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.mod.locked{opacity:.55}
.mod.current{background:var(--accent-soft)}
.lesson{display:flex;flex-direction:column;gap:12px}
.lesson .block{border-left:3px solid var(--line);padding-left:12px}
.lesson .block.task{border-color:var(--signal)}
.lesson .block.proofb{border-color:var(--ok)}

/* gráfico */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font:11px var(--f-body)}

/* IA */
.out{white-space:pre-wrap;background:var(--sunken);border-radius:8px;padding:12px;min-height:60px;font-size:.92rem;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:600 .82rem var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

/* conversas com a equipe */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;font-size:.93rem;min-width:0}
.msg.eu{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:4px}
.msg.fn{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg-quem{display:block;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;opacity:.75;margin-bottom:4px}
.msg-t{white-space:pre-wrap;overflow-wrap:anywhere}
.msg.eu .btn{color:var(--accent-fg)}
/* biblioteca */
.lib{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.lib .card{display:flex;flex-direction:column;gap:6px}

/* alarme */
.alarm{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px}
.alarm .card{max-width:440px;width:100%;border:2px solid var(--signal);display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:21;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:.9rem;max-width:calc(100% - 32px)}
.sheet{position:fixed;inset:0;z-index:19;background:color-mix(in srgb,var(--bg) 60%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 0 0;width:100%;max-width:640px;max-height:88%;overflow:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
table.t{border-collapse:collapse;width:100%;font-size:.88rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
table.t td.n,table.t th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.pulse{animation:p 1.4s ease-in-out infinite}@keyframes p{50%{opacity:.55}}}
</style>

function missoesDoDia(date, mod, faseIdx){
  const wd = date.getDay(); // 0 dom
  const L = [];
  const add=(slot,k,t,d)=>L.push({id:slot+"-"+k,slot,t,d});

    add("manha","radar","Ler o radar da equipe","Abra a aba Equipe, leia o radar do dia e ponha 1 funcionário para trabalhar numa ordem. Prova: qual ordem e o que ele entregou.");
    add("manha","story","1 story de bastidor","Foto ou vídeo curto: embalagem, configuração, dica de segurança. Prova: o tema.");

      2:["Publicar 1 Reel","Publique o Reel gravado no sábado com legenda e chamada para o WhatsApp. Prova: o link."],
      3: faseIdx>=6 ? ["5 abordagens B2B ou parceiros","Mensagem curta para 5 alvos da sua lista. Prova: quantos responderam."] : ["Responder comentários e DMs","Todos os comentários e directs, chamando para o WhatsApp quem perguntar preço. Prova: quantos."],
      4:["Publicar 1 Reel","Segundo Reel da semana. Prova: o link."],
      5:["Post de prova social","Avaliação, depoimento ou suporte resolvido (com permissão). Prova: o link."],
    }[wd];
    add("almoco","a",almoco[0],almoco[1]);
    if (wd<=4) add("noite","mod","Módulo da semana: "+mod.t,"Leia a aula na Trilha e avance a tarefa. Prova: o que você fez hoje nela.");
    else add("noite","leitura","Leitura de 20 páginas","Livro da fase (veja Materiais). Prova: 1 ideia que vai aplicar.");
    add("noite","numeros","Registrar os números do dia","Posts, conversas, orçamentos, vendas e faturamento no Placar. Prova: o faturamento do dia.");
  } else if (wd===6){
    add("sabado","gravar","Pacote da semana no Planejador","Em Publicar → Pauta e vídeos, gere o pacote da semana (ou grave você mesmo com os roteiros) e agende um vídeo por dia no Planejador do Meta Business Suite. Prova: quantos ficaram agendados.");
    add("sabado","mod","Fechar a tarefa do módulo","Termine e entregue a prova do módulo \""+mod.t+"\" na Trilha. Prova: entregue ou o que falta.");
    if (faseIdx>=6) add("sabado","b2b","Visitas ou ligações B2B","2 visitas ou 5 ligações para empresas da lista. Prova: com quem falou.");
  } else {
    add("domingo","rev","Revisão semanal (15 min)","Olhe o Placar: execução da semana, faturamento contra a meta e o que vai mudar. Prova: 1 decisão para a semana.");
  }
  return L;
}

/* ============ CÁLCULOS ============ */
function moduloAtualIdx(){ for(let i=0;i<MODULOS.length;i++) if(!S.modulos[i]) return i; return MODULOS.length-1 }
function semanaDoPlano(){ return Math.max(0,Math.floor(daysBetween(parseYmd(S.inicio),new Date())/7)) }
function mesDoPlano(dStr){ const a=parseYmd(S.inicio), d=parseYmd(dStr); return (d.getFullYear()-a.getFullYear())*12+(d.getMonth()-a.getMonth())-(d.getDate()<a.getDate()?1:0) }
function fatTotal(){ let t=0; for(const k in DIAS_DB) t+=Number(DIAS_DB[k].log?.faturamento||0); return t }
function fatMes(m){ let t=0; for(const k in DIAS_DB) if(mesDoPlano(k)===m) t+=Number(DIAS_DB[k].log?.faturamento||0); return t }
function metaMes(m){ return Math.round(RAMPA[Math.min(11,Math.max(0,m))]*S.meta/1000000) }
function slotStatus(date,slot){ // antes | agora | depois
  const s=S.slots[slot]; const today=ymd(date)===ymd(new Date());
  if(!today) return ymd(date)<ymd(new Date())?"depois":"antes";
  const n=nowMin(new Date()); if(n<hm(s.ini)) return "antes"; if(n<=hm(s.fim)) return "agora"; return "depois";
}
function missoesDe(date){ const mi=moduloAtualIdx(); const L=missoesDoDia(date,MODULOS[mi],MODULOS[mi].f);
  if(NIVEL>=2 && date.getDay()===6 && ymd(date)>=ymd(new Date(Date.now()-6*864e5))) L.push({id:"sabado-reposicao",slot:"sabado",t:"Bloco de reposição (contrato nível "+NIVEL+")",d:"2 horas extras repondo as missões que ficaram para trás. Prova: o que você repôs."});
  return L }
function conta(d,m){ // missão de um turno que já tinha acabado quando o app foi criado não conta
  if(ymd(d)!==S.inicio||!S.criado) return true; const c=new Date(S.criado); if(ymd(c)!==S.inicio) return true;
  return hm(S.slots[m.slot].fim) > nowMin(c);
}
function execucao(diasAtras){ // % feitas em dias passados/presentes já vencidos
  let total=0, feitas=0; const hoje=new Date(); const ini=parseYmd(S.inicio);
  for(let i=0;i<diasAtras;i++){
    const d=new Date(hoje); d.setDate(hoje.getDate()-i); if(d<ini) break;
    const k=ymd(d); missoesDe(d).forEach(m=>{
      if(!conta(d,m)) return;
      const done=!!DIAS_DB[k]?.missoes?.[m.id]; const vencida = slotStatus(d,m.slot)==="depois";
      if(done||vencida){ total++; if(done) feitas++; }
    });
  }
  return {total,feitas,pct: total?Math.round(feitas/total*100):null};
}
function dividas(){ // missões vencidas sem prova nem motivo nos últimos 7 dias
  const out=[]; const hoje=new Date(); const ini=parseYmd(S.inicio);
  for(let i=0;i<7;i++){ const d=new Date(hoje); d.setDate(hoje.getDate()-i); if(d<ini) break; const k=ymd(d);
    missoesDe(d).forEach(m=>{ if(conta(d,m) && slotStatus(d,m.slot)==="depois" && !DIAS_DB[k]?.missoes?.[m.id] && !DIAS_DB[k]?.motivos?.[m.id]) out.push({k,d,m}) }) }
  return out;
}
function sequencia(){ // dias seguidos com 80% ou mais das missões feitas (hoje conta só se já bateu)
  const okDia=d=>{const k=ymd(d);const ms=missoesDe(d).filter(m=>conta(d,m));return ms.length>0&&ms.filter(m=>DIAS_DB[k]?.missoes?.[m.id]).length/ms.length>=0.8};
  const hoje=new Date(), ini=parseYmd(S.inicio); let n=okDia(hoje)?1:0;
  for(let i=1;i<400;i++){ const d=new Date(hoje); d.setDate(hoje.getDate()-i); if(d<ini) break; if(okDia(d)) n++; else break }
  return n }

  const rd=radarRecente();

     : `<div class="card flat stack"><span class="eyebrow">Radar da equipe</span><p class="muted">Todo dia às 05:17 o detetive-de-mercado e o lider-dados pesquisam as novidades do mercado digital e de tecnologia e deixam o radar aqui, com ordens para cada funcionário. O primeiro chega amanhã cedo.</p><button class="btn sm" style="align-self:flex-start" onclick="view='equipe';render()">Ver a equipe</button></div>`;
  const alerta=alertaSazonal(agora); if(alerta) h+=`<div class="card" style="border-color:var(--signal)"><span class="eyebrow" style="color:var(--signal)">Data forte chegando</span><p>${alerta}</p></div>`;
  return h;
}
function addMonths(d,n){const x=new Date(d);x.setMonth(x.getMonth()+n);return x}
function alertaSazonal(d){
  const y=d.getFullYear(); const datas=[[new Date(y,10,11),"11.11"],[blackFriday(y),"Black Friday"],[new Date(y,11,25),"Natal"],[new Date(y,1,14),"Volta das férias"],[diaDosPais(y),"Dia dos Pais"]];
  for(const [dt,n] of datas){ const dd=daysBetween(d,dt); if(dd>=0&&dd<=30) return `<b>${n}</b> em ${dd} ${dd===1?"dia":"dias"} (${dt.getDate()}/${dt.getMonth()+1}). Rode a skill campanha-sazonal agora e prepare kit, preço e mensagens. Quem planeja com antecedência vende mais sem queimar margem.` }
  return "";
}
function blackFriday(y){const d=new Date(y,10,1);let c=0;while(true){if(d.getDay()===4){c++;if(c===4){d.setDate(d.getDate()+1);return d}}d.setDate(d.getDate()+1)}}
function diaDosPais(y){const d=new Date(y,7,1);let c=0;while(true){if(d.getDay()===0){c++;if(c===2)return d}d.setDate(d.getDate()+1)}}

function radarRecente(){ const ks=Object.keys(RADAR).sort(); if(!ks.length) return null; const k=ks[ks.length-1]; return {k,r:RADAR[k]} }

const VW=1080, VH=1920;
function planoVideo(r){
  const L=[{tipo:"gancho",txt:(r.gancho||"").trim(),d:2.8}];
  (r.cenas||[]).filter(Boolean).forEach(c=>{ const w=String(c).split(/\s+/).length; L.push({tipo:"cena",txt:String(c).trim(),d:Math.min(5.5,Math.max(2.6,w*0.34))}) });

}
function quebrar(ctx,txt,maxW){ const ws=String(txt).split(/\s+/); const lines=[]; let l=""; ws.forEach(w=>{ const t=l?l+" "+w:w; if(ctx.measureText(t).width>maxW&&l){lines.push(l);l=w} else l=t }); if(l) lines.push(l); return lines }
function cover(ctx,el,W,H,zoom){ const iw=el.videoWidth||el.naturalWidth||el.width, ih=el.videoHeight||el.naturalHeight||el.height; if(!iw||!ih) return; const s=Math.max(W/iw,H/ih)*(zoom||1); const w=iw*s,h=ih*s; ctx.drawImage(el,(W-w)/2,(H-h)/2,w,h) }
function escudo(ctx,x,y,s,cor){ ctx.save(); ctx.translate(x,y); ctx.scale(s/24,s/24); ctx.lineWidth=2.2; ctx.strokeStyle=cor; ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.beginPath(); ctx.moveTo(12,2); ctx.lineTo(4,5); ctx.lineTo(4,11); ctx.bezierCurveTo(4,16,7.4,20.4,12,22); ctx.bezierCurveTo(16.6,20.4,20,16,20,11); ctx.lineTo(20,5); ctx.closePath(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(8,12.5); ctx.bezierCurveTo(9.2,10.9,10.6,10.9,12,12.5); ctx.bezierCurveTo(13.4,14.1,14.8,14.1,16,12.5); ctx.stroke(); ctx.restore() }
function marcaTopo(ctx,M,x,y,tam){ if(logoImg){ const h=tam, w=logoImg.naturalWidth/logoImg.naturalHeight*h; ctx.drawImage(logoImg,x,y,Math.min(w,tam*4),h) } else { escudo(ctx,x,y,tam,M.texto); ctx.fillStyle=M.texto; ctx.font=`700 ${Math.round(tam*0.55)}px "${M.fonte}",sans-serif`; ctx.textBaseline="middle"; ctx.fillText(M.nome,x+tam*1.25,y+tam/2) } }
const ease = x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
function desenharQuadro(ctx,plan,t,M,midias){
  const W=VW,H=VH; const i=Math.max(0,plan.cenas.findIndex(c=>t>=c.t0&&t<c.t0+c.d)); const s=plan.cenas[i]||plan.cenas[plan.cenas.length-1]; const lt=t-s.t0;
  ctx.textBaseline="alphabetic"; ctx.fillStyle=M.fundo; ctx.fillRect(0,0,W,H);
  const m=midias.length?midias[i%midias.length]:null;
  if(m){ cover(ctx,m.el,W,H,1+0.05*(lt/s.d)); const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,rgba(M.fundo,.35)); g.addColorStop(.45,rgba(M.fundo,.55)); g.addColorStop(1,rgba(M.fundo,.92)); ctx.fillStyle=g; ctx.fillRect(0,0,W,H) }
  else { ctx.save(); ctx.globalAlpha=.07; ctx.strokeStyle=M.primaria; ctx.lineWidth=26; const off=(t*40)%140; for(let x=-H;x<W+H;x+=140){ ctx.beginPath(); ctx.moveTo(x+off,0); ctx.lineTo(x+off-H*.6,H); ctx.stroke() } ctx.restore();
    const gx=W*.5+Math.sin(t*.7)*180, gy=H*.42; const rg=ctx.createRadialGradient(gx,gy,0,gx,gy,760); rg.addColorStop(0,rgba(M.primaria,.45)); rg.addColorStop(1,rgba(M.primaria,0)); ctx.fillStyle=rg; ctx.fillRect(0,0,W,H) }
  // barra de progresso segmentada
  const n=plan.cenas.length, gap=10, bw=(W-160-gap*(n-1))/n;
  plan.cenas.forEach((c,k)=>{ const x=80+k*(bw+gap); ctx.fillStyle=rgba(M.texto,.28); ctx.fillRect(x,96,bw,8); const p=k<i?1:k>i?0:Math.min(1,lt/c.d); ctx.fillStyle=M.destaque; ctx.fillRect(x,96,bw*p,8) });
  marcaTopo(ctx,M,80,150,72);
  const a=ease(lt/0.4), out=Math.min(1,(s.d-lt)/0.25); ctx.save(); ctx.globalAlpha=Math.max(0,Math.min(a,out)); const dy=(1-a)*60;
  if(s.tipo==="gancho"){
    ctx.font=`800 104px "${M.fonte}",sans-serif`; const L=quebrar(ctx,s.txt.toUpperCase(),W-180); const lh=124; let y=H*.40-(L.length*lh)/2+dy;
    L.forEach(l=>{ const w=ctx.measureText(l).width; ctx.fillStyle=M.primaria; ctx.fillRect(70,y-96,w+40,118); ctx.strokeStyle=M.destaque; ctx.lineWidth=3; ctx.strokeRect(70,y-96,w+40,118); ctx.fillStyle=M.texto; ctx.fillText(l,90,y); y+=lh+6 });
  } else if(s.tipo==="cena"){
    ctx.font=`700 80px "${M.fonte}",sans-serif`; const L=quebrar(ctx,s.txt,W-200); const lh=98; let y=H*.43-(L.length*lh)/2+dy;
    ctx.fillStyle=M.destaque; ctx.fillRect(80,y-70,12,L.length*lh-10);
    ctx.fillStyle=M.texto; L.forEach(l=>{ ctx.fillText(l,120,y); y+=lh });
  } else {
    ctx.font=`800 92px "${M.fonte}",sans-serif`; const L=quebrar(ctx,s.txt,W-180); let y=H*.34+dy; ctx.fillStyle=M.texto; L.forEach(l=>{ ctx.fillText(l,90,y); y+=110 });
    y+=40; const bh=150; ctx.fillStyle=M.destaque; roundRect(ctx,90,y,W-180,bh,32); ctx.fill();
    ctx.fillStyle=M.fundo; ctx.font=`800 64px "${M.fonte}",sans-serif`; ctx.fillText("WhatsApp "+M.whatsapp,130,y+96);
    if(M.instagram){ ctx.fillStyle=rgba(M.texto,.85); ctx.font=`600 52px "${M.fonte}",sans-serif`; ctx.fillText(M.instagram,90,y+bh+90) }
  }
  ctx.restore();
  ctx.fillStyle=rgba(M.texto,.82); ctx.font=`600 40px "${M.fonte}",sans-serif`; ctx.fillText(M.slogan,80,H-430);
}
function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath() }
function melhorMime(){ if(!window.MediaRecorder) return null; return ["video/mp4;codecs=avc1.42E01E,mp4a.40.2","video/mp4;codecs=avc1.42E01E","video/mp4;codecs=avc1","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"].find(m=>{try{return MediaRecorder.isTypeSupported(m)}catch(e){return false}})||null }
async function gravarVideo(plan,M,midias,musica,onProg){
  const mime=melhorMime(); if(!mime) throw new Error("Este navegador não grava vídeo. Use o Chrome ou o Edge atualizado.");
  await garantirFonte(M.fonte);
  const c=document.createElement("canvas"); c.width=VW; c.height=VH; c.setAttribute("aria-hidden","true"); c.style.cssText="position:fixed;left:-20000px;top:0;width:108px;height:192px;pointer-events:none"; document.body.appendChild(c);
  const ctx=c.getContext("2d"); desenharQuadro(ctx,plan,0,M,midias); const stream=c.captureStream(30);
  let ac=null, audio=null;
  if(musica){ ac=new (window.AudioContext||window.webkitAudioContext)(); audio=new Audio(musica); const src=ac.createMediaElementSource(audio); const dest=ac.createMediaStreamDestination(); src.connect(dest); dest.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr)); }
  midias.forEach(m=>{ if(m.tipo==="video"){ m.el.currentTime=0; m.el.play().catch(()=>{}) } });
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8000000}); const parts=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) parts.push(e.data) };
  const parou=new Promise(r=>rec.onstop=r);
  if(audio){ audio.currentTime=0; await audio.play().catch(()=>{}) }
  rec.start(250); const t0=performance.now();
  await new Promise(res=>{ (function loop(){ const t=(performance.now()-t0)/1000; desenharQuadro(ctx,plan,Math.min(t,plan.total-0.001),M,midias); onProg&&onProg(Math.min(1,t/plan.total)); if(t<plan.total) requestAnimationFrame(loop); else res() })() });
  rec.stop(); await parou; c.remove(); if(audio){audio.pause()} if(ac) ac.close().catch(()=>{}); stream.getTracks().forEach(t=>t.stop());
  const blob=new Blob(parts,{type:mime.split(";")[0]}); if(!blob.size) throw new Error("O navegador não conseguiu gravar o vídeo. Use o Chrome ou o Edge atualizado.");
  return {blob, ext:mime.startsWith("video/mp4")?"mp4":"webm"};
}

  for(let w=new Date(seg); ; w.setDate(w.getDate()+7)){ const fim=new Date(w); fim.setDate(fim.getDate()+6); if(fim>=hoje) break;
    let tot=0,ok=0; for(let d=new Date(w); d<=fim; d.setDate(d.getDate()+1)){ if(d<ini) continue; const k=ymd(d); missoesDe(d).forEach(m=>{ if(!conta(d,m)) return; tot++; if(DIAS_DB[k]?.missoes?.[m.id]) ok++ }) }

function salvarCatalogo(){
  const n=(id,d)=>{ const v=$("#"+id)?.value; return v===""||v===undefined?d:Number(v) };
  CAT.pix_pct=Math.max(0,Math.min(30,n("cg-pix",CAT.pix_pct))); CAT.parcelas=Math.max(1,Math.min(24,Math.round(n("cg-parc",CAT.parcelas)))); CAT.prazo_padrao=($("#cg-prazo")?.value||"").trim();
  const erros=[];
  CAT.produtos.forEach((p,i)=>{ if(!$("#cp-"+i+"-preco")) return; const pr=n("cp-"+i+"-preco",p.preco); if(!(pr>0)) erros.push(p.id); else p.preco=Math.round(pr*100)/100;
    p.custo=n("cp-"+i+"-custo",0)||0; p.frete=n("cp-"+i+"-frete",0)||0; p.prazo=($("#cp-"+i+"-prazo").value||"").trim(); p.anatel=($("#cp-"+i+"-anatel").value||"").trim(); p.ativo=$("#cp-"+i+"-ativo").checked });
  persistCat(); toast(erros.length?"Salvo. Preço inválido mantido em: "+erros.join(", "):"Catálogo salvo. Anúncios, equipe e pauta já usam os preços novos."); render() }
function comandoGestor(){ const base=Object.fromEntries(CAT_SEMENTE.produtos.map(p=>[p.id,p]));
  const linhas=CAT.produtos.map(p=>{ const b=base[p.id]||{}; const mud=[]; if(Number(b.preco)!==Number(p.preco)) mud.push("preço "+brl2(p.preco)); if(!!b.ativo!==!!p.ativo) mud.push(p.ativo?"ativar":"desativar"); if(p.anatel) mud.push("Anatel "+p.anatel); if(p.prazo) mud.push("prazo de entrega "+p.prazo); return mud.length?`- ${p.id}: ${mud.join(", ")}`:"" }).filter(Boolean);
  return `Use o gestor-de-catalogo: atualize o catálogo (dropshipping) com estes dados do app Rota do Milhão, recalculando Pix (${CAT.pix_pct}%) e parcelas (${CAT.parcelas}x), e rode a validação:\n${linhas.join("\n")||"- nenhuma mudança de preço"}${CAT.prazo_padrao?`\nPrazo padrão de entrega: ${CAT.prazo_padrao}`:""}` }

/* ============ GESTÃO: ERP · CRM · WMS · TMS · EDI · VMI ============
   Tudo ligado pelo id do produto (Catálogo), do pedido, do cliente e do fornecedor.
   Dados na área privada: estado/pedidos, estado/clientes, estado/fornecedores, estado/lancamentos. */
const COLS={pedidos:{},clientes:{},fornecedores:{},lancamentos:{},conversas:{},aprovacoes:{}};

function apagarDoc(col,id){ delete COLS[col][id]; lsSet("rdm-"+col,COLS[col]); queue(col+"-"+id,()=>dbBase&&dbBase.collection(col).doc(id).delete()) }
async function carregarGestao(){ if(!dbBase) return; try{
  for(const c of Object.keys(COLS)){ const r=await dbBase.collection(c).get(); const remoto={}; r.docs.forEach(d=>remoto[d.id]=JSON.parse(JSON.stringify(d.data())));
    for(const id in COLS[c]) if(!remoto[id]||(COLS[c][id].atualizadoEm||"")>(remoto[id].atualizadoEm||"")){ remoto[id]=COLS[c][id]; dbBase.collection(c).doc(id).set(JSON.parse(JSON.stringify(COLS[c][id]))).catch(()=>{}) }
    COLS[c]=remoto; lsSet("rdm-"+c,remoto) }
  render(); avisarGestao() }catch(e){} }

function prazoMaxDias(texto){ const n=String(texto||"").match(/\d+/g); return n?Math.max(...n.map(Number)):null }
function parseNum(v){ if(v===undefined||v===null) return 0; let s=String(v).trim().replace(/[R$\s]/g,""); if(/,\d{1,2}$/.test(s)) s=s.replace(/\./g,"").replace(",","."); else s=s.replace(/,/g,""); const n=parseFloat(s); return isNaN(n)?0:n }
function addDias(ymdStr,n){ const d=parseYmd(ymdStr); d.setDate(d.getDate()+n); return ymd(d) }
const STATUS_PED=[["novo","Novo"],["pago","Pago"],["fornecedor","Enviado ao fornecedor"],["transito","Em trânsito"],["entregue","Entregue"],["troca","Troca/devolução"],["cancelado","Cancelado"]];

/* ----- cálculos que integram os módulos ----- */
function custoPedido(p){ return (p.itens||[]).reduce((a,i)=>{ const c=prod(i.id); return a+(Number(c?.custo||0)+Number(c?.frete||0))*Number(i.qtd||1) },0) }
function valido(p){ return !["cancelado","novo"].includes(p.status) }
function previsao(p){ if(p.envio?.previsao) return p.envio.previsao; const base=p.envio?.enviadoEm||p.dataPago||p.data; if(!base) return null;
  const f=forn(p.fornecedorId); let dias=f?.prazoMax||null; if(!dias){ const ds=(p.itens||[]).map(i=>prazoMaxDias(prod(i.id)?.prazo||CAT.prazo_padrao)).filter(Boolean); dias=ds.length?Math.max(...ds):null } return dias?addDias(base,dias):null }
function atrasado(p){ if(!["fornecedor","transito","pago"].includes(p.status)) return false; const pv=previsao(p); return !!pv && pv<ymd(new Date()) }
function vendas30(id){ const lim=ymd(new Date(Date.now()-30*864e5)); return lista("pedidos").filter(p=>valido(p)&&p.data>=lim).reduce((a,p)=>a+(p.itens||[]).filter(i=>i.id===id).reduce((b,i)=>b+Number(i.qtd||1),0),0) }
function estoqueDe(c){ const f=c.estoqueFornecedor; const own=Number(c.estoqueProprio||0); return (f===null||f===undefined||f==="")?(own||null):Number(f)+own }
function statusEstoque(c){ const e=estoqueDe(c); if(e===null) return "sem dado"; if(e<=0) return "esgotado"; if(c.minimo&&e<=Number(c.minimo)) return "baixo"; return "ok" }
function mesDe(ymdStr){ return ymdStr.slice(0,7) }
function dre(mes){ const ps=lista("pedidos").filter(p=>valido(p)&&mesDe(p.data)===mes);
  const receita=ps.reduce((a,p)=>a+Number(p.total||0),0), custo=ps.reduce((a,p)=>a+Number(p.custo??custoPedido(p)),0), taxas=ps.reduce((a,p)=>a+Number(p.taxa||0),0);
  const desp=lista("lancamentos").filter(l=>mesDe(l.data)===mes&&l.tipo!=="receita").reduce((a,l)=>a+Number(l.valor||0),0);
  const extra=lista("lancamentos").filter(l=>mesDe(l.data)===mes&&l.tipo==="receita").reduce((a,l)=>a+Number(l.valor||0),0);
  const margem=receita-custo-taxas; return {ps,receita,custo,taxas,margem,desp,extra,resultado:margem+extra-desp,ticket:ps.length?receita/ps.length:0} }
function followupsHoje(){ const h=ymd(new Date()); return lista("clientes").filter(c=>c.proxima?.data&&c.proxima.data<=h&&!["perdido"].includes(c.etapa)) }
function pendenciasGestao(){ return {
  follow:followupsHoje(),
  paraFornecedor:lista("pedidos").filter(p=>p.status==="pago"),
  semRastreio:lista("pedidos").filter(p=>p.status==="fornecedor"&&!p.envio?.rastreio),
  atrasos:lista("pedidos").filter(atrasado),
  estoque:CAT.produtos.filter(c=>c.ativo&&["baixo","esgotado"].includes(statusEstoque(c))) } }
function resumoGestao(){ const m=ymd(new Date()).slice(0,7), d=dre(m), pg=pendenciasGestao();
  return `Gestão (mês ${m}): ${d.ps.length} pedidos, faturamento ${brl(d.receita)}, margem de contribuição ${brl(d.margem)}, resultado ${brl(d.resultado)}. Pendências: ${pg.follow.length} follow-ups vencidos, ${pg.paraFornecedor.length} pedidos pagos sem enviar ao fornecedor, ${pg.semRastreio.length} sem rastreio, ${pg.atrasos.length} entregas atrasadas, ${pg.estoque.length} produtos com estoque baixo ou esgotado. Alertas: ${alertasGestao().filter(a=>a.nivel!=="medio").map(a=>a.regra+" ("+a.itens.length+")").join(", ")||"nenhum crítico ou alto"}.` }


/* ----- Alertas da equipe (espelho de skills/monitor-de-gestao/references/alertas.json) ----- */
const ALERTA_LIMITES={"dias_para_repassar": 1, "dias_sem_rastreio": 2, "dias_followup_atrasado": 1, "dias_sem_conferir_estoque": 7, "pontualidade_minima_pct": 80, "entregas_minimas_para_avaliar": 3, "anuncio_max_pct_receita": 30};
const ALERTA_REGRAS={"tms-atraso": {"sistema": "TMS", "nivel": "critico", "responsavel": "guardiao-pos-venda", "quando": "Pedido pago, no fornecedor ou em trânsito com a previsão de entrega já vencida.", "acao": "Avisar o cliente antes que ele pergunte e cobrar o fornecedor. Sem prometer nova data que o fornecedor não confirmou."}, "wms-esgotado": {"sistema": "WMS", "nivel": "critico", "responsavel": "gestor-de-catalogo", "quando": "Produto ativo com estoque zero (fornecedor + próprio).", "acao": "Desativar no Catálogo e pausar anúncio do produto até o fornecedor confirmar reposição."}, "erp-nao-repassado": {"sistema": "ERP", "nivel": "alto", "responsavel": "lider-operacoes", "quando": "Pedido pago há mais de {dias_para_repassar} dia sem repassar ao fornecedor.", "acao": "Enviar o pedido ao fornecedor hoje (Gestão → Pedidos → Pedido p/ fornecedor)."}, "tms-sem-rastreio": {"sistema": "TMS", "nivel": "alto", "responsavel": "lider-operacoes", "quando": "Pedido repassado ao fornecedor há mais de {dias_sem_rastreio} dias sem código de rastreio.", "acao": "Cobrar o código do fornecedor e registrar em Rastreio."}, "erp-margem-negativa": {"sistema": "ERP", "nivel": "alto", "responsavel": "gestor-de-catalogo", "quando": "Pedido em que total − custo − taxa ficou negativo.", "acao": "Rever o preço ou o custo do produto antes da próxima venda."}, "fin-resultado-negativo": {"sistema": "ERP", "nivel": "alto", "responsavel": "analista-de-vendas", "quando": "Resultado do mês (margem − despesas) abaixo de zero.", "acao": "Cortar a despesa que menos traz venda e rever o CPA máximo com o analista-de-midia."}, "vmi-pontualidade": {"sistema": "VMI", "nivel": "alto", "responsavel": "gestor-de-catalogo", "quando": "Fornecedor com pelo menos {entregas_minimas_para_avaliar} entregas e menos de {pontualidade_minima_pct}% no prazo.", "acao": "Renegociar o prazo ou acionar o fornecedor reserva."}, "sac-troca-aberta": {"sistema": "ERP", "nivel": "alto", "responsavel": "tecnico-de-suporte", "quando": "Pedido em troca ou devolução.", "acao": "Responder o cliente no mesmo dia e seguir o fluxo de troca do CDC."}, "fin-anuncio-alto": {"sistema": "ERP", "nivel": "medio", "responsavel": "analista-de-midia", "quando": "Anúncios do mês acima de {anuncio_max_pct_receita}% da receita.", "acao": "Aplicar a régua escalar, manter ou pausar do plano-de-midia."}, "crm-followup-atrasado": {"sistema": "CRM", "nivel": "medio", "responsavel": "consultor-whatsapp", "quando": "Contato com a próxima ação vencida há mais de {dias_followup_atrasado} dia. Orçamento vai para o recuperador-de-carrinho e pós-venda para o guardiao-pos-venda.", "acao": "Mandar a mensagem hoje e registrar o follow-up."}, "crm-orcamento-sem-acao": {"sistema": "CRM", "nivel": "medio", "responsavel": "recuperador-de-carrinho", "quando": "Contato em orçamento sem próxima ação marcada.", "acao": "Marcar o follow-up D1, D3 ou D7."}, "wms-baixo": {"sistema": "WMS", "nivel": "medio", "responsavel": "gestor-de-catalogo", "quando": "Produto ativo com estoque igual ou abaixo do mínimo.", "acao": "Confirmar reposição com o fornecedor."}, "wms-sem-conferencia": {"sistema": "WMS", "nivel": "medio", "responsavel": "gestor-de-catalogo", "quando": "Produto ativo com fornecedor ligado e estoque não conferido há mais de {dias_sem_conferir_estoque} dias.", "acao": "Pedir a planilha de estoque ao fornecedor e importar em Integrações."}, "erp-sem-custo": {"sistema": "ERP", "nivel": "medio", "responsavel": "gestor-de-catalogo", "quando": "Produto ativo sem custo do fornecedor no Catálogo.", "acao": "Preencher custo e frete: sem isso a margem e o resultado ficam errados."}, "vmi-sem-fornecedor": {"sistema": "VMI", "nivel": "medio", "responsavel": "lider-operacoes", "quando": "Produto ativo sem fornecedor ligado.", "acao": "Cadastrar o fornecedor e ligar o produto em Gestão → Estoque."}};
function alertasGestao(){ const L=ALERTA_LIMITES, h=ymd(new Date()), hoje=parseYmd(h); const ach={};
  const add=(rid,item,resp)=>{ const k=rid+"|"+(resp||ALERTA_REGRAS[rid].responsavel); (ach[k]=ach[k]||{rid,resp:resp||ALERTA_REGRAS[rid].responsavel,itens:[]}).itens.push(item) };
  const dias=s=>s?daysBetween(parseYmd(s),hoje):null;
  lista("pedidos").forEach(p=>{ const nome=p.cliente?.nome||""; const pv=previsao(p);
    if(["pago","fornecedor","transito"].includes(p.status)&&pv&&pv<h) add("tms-atraso",`${p.id} de ${nome}: previsão ${pv.split("-").reverse().slice(0,2).join("/")}`);
    if(p.status==="pago"&&dias(p.dataPago||p.data)>L.dias_para_repassar) add("erp-nao-repassado",`${p.id} pago em ${(p.dataPago||p.data).split("-").reverse().slice(0,2).join("/")}`);
    if(p.status==="fornecedor"&&!p.envio?.rastreio&&dias(p.envio?.repassadoEm||p.dataPago||p.data)>L.dias_sem_rastreio) add("tms-sem-rastreio",p.id);
    if(valido(p)){ const c=Number(p.custo??custoPedido(p)); if(c>0&&Number(p.total||0)-c-Number(p.taxa||0)<0) add("erp-margem-negativa",`${p.id}: total ${brl2(p.total)}, custo ${brl2(c)}`) }
    if(p.status==="troca") add("sac-troca-aberta",`${p.id} de ${nome}`) });
  const d=dre(h.slice(0,7)); if((d.receita||d.desp)&&d.resultado<0) add("fin-resultado-negativo","resultado do mês "+brl(d.resultado));
  const anun=lista("lancamentos").filter(l=>mesDe(l.data)===h.slice(0,7)&&l.categoria==="anuncios"&&l.tipo!=="receita").reduce((a,l)=>a+Number(l.valor||0),0);
  if(d.receita&&anun/d.receita*100>L.anuncio_max_pct_receita) add("fin-anuncio-alto",`anúncios ${brl(anun)} = ${Math.round(anun/d.receita*100)}% da receita`);
  lista("clientes").forEach(c=>{ if(c.etapa==="perdido") return; const dp=c.proxima?.data;
    if(dp&&dias(dp)>L.dias_followup_atrasado) add("crm-followup-atrasado",`${c.nome}: ${c.proxima.acao||"follow-up"}`,{orcamento:"recuperador-de-carrinho",pos:"guardiao-pos-venda"}[c.etapa]);
    if(c.etapa==="orcamento"&&!dp) add("crm-orcamento-sem-acao",c.nome) });
  CAT.produtos.filter(c=>c.ativo).forEach(c=>{ const e=estoqueDe(c), n=c.nome.slice(0,50);
    if(e!==null&&e<=0) add("wms-esgotado",n); else if(e!==null&&c.minimo&&e<=Number(c.minimo)) add("wms-baixo",`${n}: ${e} un.`);
    if(c.fornecedorId){ if(!c.conferidoEm||dias(c.conferidoEm)>L.dias_sem_conferir_estoque) add("wms-sem-conferencia",n) } else add("vmi-sem-fornecedor",n);
    if(!Number(c.custo)) add("erp-sem-custo",n) });
  lista("fornecedores").forEach(f=>{ const s=scoreForn(f); if(s.entregues>=L.entregas_minimas_para_avaliar&&s.pct!==null&&s.pct<L.pontualidade_minima_pct) add("vmi-pontualidade",`${f.nome}: ${s.pct}% no prazo`) });
  const ordem={critico:0,alto:1,medio:2};
  return Object.values(ach).map(a=>Object.assign({},ALERTA_REGRAS[a.rid],{regra:a.rid,responsavel:a.resp,itens:a.itens,quando:ALERTA_REGRAS[a.rid].quando.replace(/\{(\w+)\}/g,(_,k)=>L[k])})).sort((a,b)=>ordem[a.nivel]-ordem[b.nivel]||a.sistema.localeCompare(b.sistema)) }
const NIVEL_NOME={critico:"crítico",alto:"alto",medio:"médio"};
function cartaoAlertas(als,titulo){ if(!als.length) return `<div class="card flat"><span class="eyebrow">${titulo}</span><p class="muted">Sem alertas. A gestão está em dia.</p></div>`;
  return `<div class="card stack" style="border-color:${als.some(a=>a.nivel==="critico")?"var(--danger)":"var(--signal)"}"><span class="eyebrow">${titulo}</span>
   ${als.map(a=>`<div class="stack" style="gap:4px;border-top:1px solid var(--line);padding-top:8px"><div class="row"><span class="pill ${a.nivel==="critico"?"bad":a.nivel==="alto"?"warn":""}">${NIVEL_NOME[a.nivel]}</span><span class="tag">${esc(a.sistema)}</span><span class="muted num" style="font-size:.78rem">${esc(a.responsavel)}</span></div>
    <span style="font-size:.92rem">${esc(a.quando)} <b>(${a.itens.length})</b></span><span class="muted" style="font-size:.85rem">${a.itens.slice(0,4).map(esc).join(" · ")}${a.itens.length>4?" · e mais "+(a.itens.length-4):""}</span>
    <div class="row"><button class="btn sm primary" onclick="trabalhar('${esc(a.responsavel)}',${esc(jsq("Alerta "+a.regra+" ("+a.sistema+", "+NIVEL_NOME[a.nivel]+"): "+a.quando+" Casos: "+a.itens.join("; ")+". Regra: "+a.acao+" Diga o que fazer hoje e escreva as mensagens prontas."))})">Pôr o ${esc(a.responsavel)} nisso</button><button class="btn sm ghost" onclick="irG(${esc(jsq({TMS:"pedidos",ERP:a.regra.startsWith("fin")?"financeiro":a.regra.startsWith("erp-sem")?"estoque":"pedidos",CRM:"clientes",WMS:"estoque",VMI:a.regra==="vmi-sem-fornecedor"?"estoque":"fornecedores"}[a.sistema]||"painel"))})">Abrir</button></div></div>`).join("")}</div>` }

function avisarGestao(){ const crit=alertasGestao().filter(a=>a.nivel==="critico"); const k=ymd(new Date()); if(!crit.length||alarmeGestaoDia===k) return; alarmeGestaoDia=k; try{ if(localStorage.getItem("rdm-alarme-gestao")===k) return; localStorage.setItem("rdm-alarme-gestao",k) }catch(e){}

function scoreForn(f){ const ps=lista("pedidos").filter(p=>p.fornecedorId===f.id&&valido(p)); const ent=ps.filter(p=>p.status==="entregue"&&p.envio?.entregueEm);

function lerCSV(texto){ texto=String(texto).replace(/^﻿/,""); const prim=texto.split(/\r?\n/)[0]||""; const sep=(prim.match(/;/g)||[]).length>=(prim.match(/,/g)||[]).length?";":",";
  const linhas=[]; let campo="", linha=[], aspas=false;
  for(let i=0;i<texto.length;i++){ const ch=texto[i];
    if(aspas){ if(ch==='"'&&texto[i+1]==='"'){campo+='"';i++} else if(ch==='"') aspas=false; else campo+=ch }
    else if(ch==='"') aspas=true; else if(ch===sep){linha.push(campo);campo=""} else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&texto[i+1]==="\n") i++; linha.push(campo); campo=""; if(linha.some(x=>x!=="")) linhas.push(linha); linha=[] } else campo+=ch }
  linha.push(campo); if(linha.some(x=>x!=="")) linhas.push(linha);
  const cab=(linhas.shift()||[]).map(h=>h.trim()); return linhas.map(l=>Object.fromEntries(cab.map((h,i)=>[h,(l[i]??"").trim()]))) }
const semAcento=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function coluna(row,...nomes){ const ks=Object.keys(row); for(const n of nomes){ const k=ks.find(k=>semAcento(k)===semAcento(n)); if(k&&row[k]!=="") return row[k] } for(const n of nomes){ const k=ks.find(k=>semAcento(k).includes(semAcento(n))); if(k&&row[k]!=="") return row[k] } return "" }
function acharProduto(sku,nome){ const s=semAcento(sku), n=semAcento(nome);
  return CAT.produtos.find(c=>s&&(semAcento(c.id)===s||semAcento(c.skuFornecedor)===s)) || CAT.produtos.find(c=>n&&(semAcento(c.nome)===n||semAcento(c.nome).includes(n.slice(0,30))||n.includes(semAcento(c.nome).slice(0,30)))) }
function dataBR(v){ const m=String(v||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; const m2=String(v||"").match(/\d{4}-\d{2}-\d{2}/); return m2?m2[0]:ymd(new Date()) }

function mensagensSample(c){ const e=func(c.func); const base=`Você é ${e.cargo} (${e.id}) da Infinity Guard, no squad ${e.squad}. ${e.desc}\nMissão: ${e.missao}\nO que você faz: ${e.faz}\nO que você entrega: ${e.entrega}\n${REGRAS_CASA}\nVocê não roda scripts aqui: quando precisar de preço calculado, revisar.py ou outro script, diga exatamente o comando ou a skill para o dono rodar no Claude Code.\n\nContexto da marca: ${contexto()}\n\nSituação do dono hoje: ${resumoSituacao()}\n\nEsta é uma conversa contínua com o dono sobre a etapa "${c.titulo}" (${ETAPA_NOME[c.etapa]||c.etapa}). Responda à última mensagem dele, levando em conta o que já foi combinado. Entregue pronto para usar, em português do Brasil, com no máximo 1 pergunta no fim se faltar dado essencial.`;

/* ============ CENTRAL E CAIXA DE APROVAÇÕES (nível 4) ============
   Os funcionários e as rotinas propõem; o dono aprova, ajusta ou recusa com um toque.
   estado/aprovacoes/<id>: {id, tipo, titulo, detalhe, texto, ref, proposto_por, criadoEm, status, resposta, decididoEm, executadoEm}
   Tipos aceitos: publicacao, mensagem, conteudo, preco, operacao, outro. Anúncio pago fica fora até o dono liberar um teto. */
const TIPOS_APROV={publicacao:"Publicação",mensagem:"Mensagem para clientes",conteudo:"Conteúdo",preco:"Preço e catálogo",operacao:"Operação",outro:"Outro"};

const pendentes=()=>aprovacoes().filter(a=>a.status==="pendente");
function decidir(id,status){ const a=COLS.aprovacoes[id]; if(!a) return; a.status=status; a.decididoEm=new Date().toISOString(); salvarDoc("aprovacoes",a);
  toast(status==="aprovado"?"Aprovado. Veja em Aprovadas para executar.":status==="recusado"?"Recusado.":"Pedido de ajuste enviado."); render() }
function ajustarAprov(id){ const a=COLS.aprovacoes[id]; decidir(id,"ajustar"); const quem=EQUIPE.find(e=>e.id===a.proposto_por)?a.proposto_por:"diretor-geral";
  abrirConversa(quem,{titulo:"Ajuste: "+a.titulo,etapa:"tarefa",texto:`Sobre a proposta "${a.titulo}" (${TIPOS_APROV[a.tipo]||a.tipo}): ${a.detalhe||""}\n\n${a.texto?"Texto proposto:\n"+a.texto+"\n\n":""}Quero ajustar antes de aprovar. Me mostre a versão corrigida e o que mudou.`}) }
function executarAprov(id){ const a=COLS.aprovacoes[id]; if(!a) return; a.executadoEm=new Date().toISOString(); salvarDoc("aprovacoes",a);
  if(a.tipo==="publicacao"&&a.ref&&PAUTA[a.ref]){ statusPauta(a.ref,"aprovado"); abrirVideo(a.ref); return }
  if(a.tipo==="mensagem"&&a.texto){ copiar(a.texto); toast("Mensagem copiada. Envie pelo WhatsApp para a lista indicada."); render(); return }
  if(a.tipo==="preco"){ view="mais"; catAberto=true; render(); toast("Ajuste o preço no Catálogo e salve."); return }
  if(a.texto){ copiar(a.texto) } render() }
// o revisor vale para o que vai a público; operação e preço são internos (ex.: pedir o código Anatel ao fornecedor)
const revisarAprov=a=>["publicacao","mensagem","conteudo"].includes(a.tipo)?checarPromessas([a.titulo,a.detalhe,a.texto].join(" ")):[];
function cartaoAprov(a){ const quando=q=>q?new Date(q).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" "+new Date(q).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"";
  return `<div class="card stack" style="${a.status==="pendente"?"border-color:var(--gold)":""}"><div class="row" style="justify-content:space-between"><span class="row" style="gap:6px"><span class="tag">${esc(TIPOS_APROV[a.tipo]||a.tipo)}</span><span class="muted num" style="font-size:.78rem">${esc(a.proposto_por||"")}</span></span><span class="pill ${a.status==="pendente"?"warn":a.status==="aprovado"?"ok":a.status==="ajustar"?"acc":""}">${{pendente:"aguardando você",aprovado:a.executadoEm?"aprovada e executada":"aprovada",recusado:"recusada",ajustar:"em ajuste"}[a.status]||a.status}</span></div>
   <b>${esc(a.titulo)}</b>${a.detalhe?`<span style="font-size:.9rem">${esc(a.detalhe)}</span>`:""}
   ${a.texto?`<details><summary class="muted">Ver o texto proposto</summary><div class="out" style="margin-top:8px">${esc(a.texto)}</div></details>`:""}
   ${(()=>{ const p=revisarAprov(a); return p.length?`<div class="debt" style="padding:10px"><b>O revisor barrou:</b>${p.map(x=>`<span style="font-size:.88rem">"${esc(x.trecho)}": ${esc(x.msg)}</span>`).join("")}</div>`:"" })()}
   <span class="muted" style="font-size:.8rem">Proposta em ${esc(quando(a.criadoEm))}${a.decididoEm?" · decidida em "+esc(quando(a.decididoEm)):""}</span>
   <div class="row">${a.status==="pendente"?`<button class="btn sm primary" ${revisarAprov(a).length?"disabled":""} onclick="decidir('${a.id}','aprovado')">Aprovar</button><button class="btn sm" onclick="ajustarAprov('${a.id}')">Ajustar</button><button class="btn sm ghost" onclick="decidir('${a.id}','recusado')">Recusar</button>`
     :a.status==="aprovado"&&!a.executadoEm?`<button class="btn sm primary" onclick="executarAprov('${a.id}')">${a.tipo==="publicacao"?"Gerar o vídeo agora":a.tipo==="mensagem"?"Copiar a mensagem":a.tipo==="preco"?"Abrir o Catálogo":"Executar"}</button>`
     :a.status!=="pendente"?`<button class="btn sm ghost" onclick="decidir('${a.id}','pendente')">Voltar para decisão</button>`:""}</div></div>` }
function viewAprovacoes(){ let as=aprovacoes(); const n={pendente:as.filter(a=>a.status==="pendente").length,aprovado:as.filter(a=>a.status==="aprovado"&&!a.executadoEm).length};
  if(apFiltro==="pendente") as=as.filter(a=>a.status==="pendente"); else if(apFiltro==="aprovado") as=as.filter(a=>a.status==="aprovado"); else if(apFiltro==="outras") as=as.filter(a=>["recusado","ajustar"].includes(a.status));
  as.sort((a,b)=>(b.criadoEm||"").localeCompare(a.criadoEm||""));
  return `<div class="chips">${[["pendente","Aguardando você "+n.pendente],["aprovado","Aprovadas "+(n.aprovado?"· "+n.aprovado+" para executar":"")],["outras","Ajuste e recusadas"],["todas","Todas"]].map(([k,t])=>`<button class="chip" aria-pressed="${apFiltro===k}" onclick="apFiltro='${k}';render()">${t}</button>`).join("")}</div>
  ${as.length?as.map(cartaoAprov).join(""):`<div class="card flat"><p class="muted">Nada aqui. As propostas chegam da rotina das 05:17 (publicação do dia), do diretor-geral às segundas e dos funcionários. Anúncio pago não entra até você liberar um teto de gasto.</p></div>`}`; }

function statusRotinas(){ const r=(EXTRA_SIS.rotinas||{}); return r }
let EXTRA_SIS=lsGet("rdm-sistema")||{}; let dbSis=null;
async function carregarSistema(){ if(!dbBase) return; try{ const d=await dbBase.collection("extra").doc("rotinas").get(); if(d.exists){ EXTRA_SIS=JSON.parse(JSON.stringify(d.data())); lsSet("rdm-sistema",EXTRA_SIS); render() } }catch(e){} }
let ctAba="painel";
function viewCentral(){ const k=ymd(new Date()); const als=alertasGestao(); const crit=als.filter(a=>a.nivel==="critico").length, alto=als.filter(a=>a.nivel==="alto").length;
  const rd=radarRecente(); const ords=rd&&rd.k===k?(rd.r.ordens||[]):[]; const feitas=ords.filter((o,i)=>(S.ordens||{})[rd.k+"#"+i]).length;
  const req=requisitos(), reqOk=req.filter(r=>r.ok).length, m=mesDoPlano(k), fm=fatMes(m), mm=metaMes(m);
  const rot=EXTRA_SIS.rotinas||[]; const rotFalha=rot.filter(r=>["falhou","atrasada"].includes(r.status)).length;
  const card=(t,v,s,acao,tom)=>`<button class="kpi" style="text-align:left;cursor:pointer;font:inherit;color:inherit" onclick="${acao}"><span class="eyebrow">${t}</span><span class="v" style="${tom?`color:var(--${tom})`:""}">${v}</span><span class="s">${s}</span></button>`;
  let h=`<div class="stack"><h2>Central</h2><p class="muted">Tudo da Infinity Guard num lugar só: o que a equipe propôs, o que saiu errado, quem respondeu, o que rodou sozinho e quanto falta para a meta.</p></div>
  <div class="chips">${[["painel","Painel"],["aprovacoes","Aprovações "+pendentes().length],["rotinas","Rotinas"]].map(([kk,t])=>`<button class="chip" aria-pressed="${ctAba===kk}" onclick="ctAba='${kk}';render()">${t}</button>`).join("")}</div>`;
  if(ctAba==="aprovacoes") return h+viewAprovacoes();
  if(ctAba==="rotinas") return h+viewRotinas();
  h+=`<div class="kpis">
   ${card("Decisões","" + pendentes().length,"propostas aguardando você","ctAba='aprovacoes';render()",pendentes().length?"signal":"")}
   ${card("Alertas",crit+alto,`${crit} críticos · ${alto} altos`,"irG('painel')",crit?"danger":alto?"signal":"")}
   ${card("Respostas da equipe",aguardandoTotal(),"conversas para responder","view='equipe';eqAba='conversas';eqFiltro='responder';eqChat=null;render()",aguardandoTotal()?"signal":"")}
   ${card("Ordens de hoje",`${feitas}/${ords.length}`,"concluídas pela equipe","view='equipe';eqAba='ordens';render()")}
   ${card("Missões",execucao(7).pct===null?"–":execucao(7).pct+"%","execução em 7 dias (meta 80%)","view='hoje';render()",(execucao(7).pct??100)<80?"signal":"")}
   ${card("Meta do mês",brl(fm),"de "+brl(mm),"irG('placar')")}
   ${card("Conexões",`${reqOk}/${req.length}`,"liberação do piloto automático","view='publicar';pubAba='conexoes';render()",reqOk<req.length?"signal":"")}
   ${card("Rotinas",rot.length?(rot.length-rotFalha)+"/"+rot.length:"–",rot.length?(rotFalha?rotFalha+" com problema":"todas em dia"):"o zelador confere às 07:07","ctAba='rotinas';render()",rotFalha?"danger":"")}
  </div>`;
  const pend=pendentes().slice(0,3); if(pend.length) h+=`<div class="stack"><h3>Decisões de hoje</h3>${pend.map(cartaoAprov).join("")}${pendentes().length>3?`<button class="btn sm" style="align-self:flex-start" onclick="ctAba='aprovacoes';render()">Ver todas (${pendentes().length})</button>`:""}</div>`;
  if(crit+alto) h+=cartaoAlertas(als.filter(a=>a.nivel!=="medio"),"Alertas críticos e altos");
  h+=`<div class="card stack"><span class="eyebrow">O que é seu e o que é da equipe</span><ul style="margin:0;padding-left:20px;font-size:.9rem;display:flex;flex-direction:column;gap:4px">
    <li><b>A equipe faz sozinha:</b> pesquisa do mercado, pauta e roteiros, plano da semana, ordens, alertas, criativos, mensagens prontas, cálculo de preço e margem.</li>
    <li><b>Você decide com um toque:</b> o que vai ser publicado, mensagens para clientes, mudanças de preço.</li>
    <li><b>Continua bloqueado até você liberar:</b> anúncio pago (teto de gasto em R$ 0).</li></ul></div>`;
  return h }
function viewRotinas(){ const rot=EXTRA_SIS.rotinas||[];
  const base=[["Radar e pauta","todo dia 05:17"],["Cobrança da manhã","seg a sáb 05:52"],["Zelador","todo dia 07:07"],["Vigia da gestão","todo dia 11:43 e 16:43"],["Cobrança da noite","todo dia 19:48"],["Diretor-geral","segunda 06:13"]];
  return `<div class="card stack"><span class="eyebrow">Rotinas que trabalham sozinhas${EXTRA_SIS.verificadoEm?" · conferidas em "+esc(new Date(EXTRA_SIS.verificadoEm).toLocaleString("pt-BR")):""}</span>
   ${rot.length?`<div class="scroll"><table class="t"><thead><tr><th>Rotina</th><th>Quando</th><th>Última execução</th><th>Situação</th></tr></thead><tbody>${rot.map(r=>`<tr><td>${esc(r.nome)}</td><td>${esc(r.quando||"")}</td><td class="num">${r.ultima?esc(new Date(r.ultima).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})):"–"}</td><td><span class="pill ${r.status==="ok"?"ok":["atrasada","aguardando"].includes(r.status)?"warn":r.status==="notifica"?"acc":"bad"}">${esc(r.status||"?")}</span>${r.obs?` <span class="muted" style="font-size:.8rem">${esc(r.obs)}</span>`:""}</td></tr>`).join("")}</tbody></table></div>`
   :`<p class="muted">O zelador confere todas as rotinas todo dia às 07:07 e grava a situação aqui. Enquanto a primeira conferência não chega, estas são as rotinas ligadas:</p><ul style="margin:0;padding-left:20px;font-size:.9rem">${base.map(([n,q])=>`<li><b>${n}</b> · ${q}</li>`).join("")}</ul>`}
   <p class="muted" style="font-size:.85rem">O zelador confere pelo resultado gravado no app. Se uma rotina falhar, ele avisa no seu celular qual foi e o que faltou. Para rodar de novo: app Claude → Rotinas → a rotina → Executar agora.</p></div>` }

/* ============ AÇÕES ============ */
function sheet(html){ $("#layer").innerHTML=`<div class="sheet" onclick="if(event.target===this)fecharSheet()"><div class="panel" role="dialog" aria-modal="true">${html}</div></div>` }
function fecharSheet(){ $("#layer").innerHTML="" }
function provar(k,id){
  const d=new Date(parseYmd(k)); const m=missoesDe(d).find(x=>x.id===id);
  sheet(`<span class="eyebrow">Concluir missão</span><h3>${esc(m?.t||"")}</h3><p class="muted">${esc(m?.d||"")}</p>
   <label class="f" for="pv">Prova (link, número ou o que você fez — mínimo 8 caracteres)</label><textarea id="pv"></textarea>
   <div class="row"><button class="btn primary" onclick="confirmarProva('${k}','${id}')">Concluir</button><button class="btn ghost" onclick="fecharSheet()">Cancelar</button></div><p id="pv-err" class="muted"></p>`);
  setTimeout(()=>$("#pv")?.focus(),50);
}
function confirmarProva(k,id){ const v=($("#pv").value||"").trim(); if(v.length<8){ $("#pv-err").textContent="Prova curta demais. Escreva o link, o número ou o que você fez."; return }
  const d=dia(k); d.missoes[id]={prova:v,hora:new Date().toISOString()}; if(d.motivos) delete d.motivos[id]; persistDia(k); fecharSheet(); toast("Missão concluída."); render() }
function motivo(k,id){ sheet(`<span class="eyebrow">Missão não feita</span><h3>Qual foi o motivo real?</h3><p class="muted">Seja honesto. Na revisão de domingo você vai ver o padrão dos motivos.</p><textarea id="mt"></textarea><div class="row"><button class="btn primary" onclick="confirmarMotivo('${k}','${id}')">Registrar</button><button class="btn ghost" onclick="fecharSheet()">Cancelar</button></div>`) }
function confirmarMotivo(k,id){ const v=($("#mt").value||"").trim(); if(v.length<5){toast("Escreva o motivo.");return} const d=dia(k); d.motivos=d.motivos||{}; d.motivos[id]=v; persistDia(k); fecharSheet(); render() }
function abrirModulo(i){
  const mi=moduloAtualIdx(); const m=MODULOS[i]; if(i>mi){ toast("Entregue a prova do módulo atual para abrir este."); return }
  const done=S.modulos[i];
  sheet(`<div class="lesson"><span class="eyebrow">Semana ${i+1} · fase ${m.f+1}: ${esc(FASES[m.f].n)}</span><h2>${esc(m.t)}</h2>
   <div class="block"><span class="eyebrow">Aula</span><p>${esc(m.aula)}</p></div>
   <div class="block task"><span class="eyebrow">Mão na massa</span><p>${esc(m.tarefa)}</p>${m.ferramenta?`<p class="muted" style="font-size:.88rem">Ferramenta: ${esc(m.ferramenta)}</p>`:""}${m.link?`<a href="${esc(m.link)}" target="_blank" rel="noopener" style="font-size:.88rem">Material de apoio</a>`:""}</div>
   <div class="block proofb"><span class="eyebrow">Prova de entrega</span><p>${esc(m.prova)}</p>
    ${done?`<div class="out">${esc(done.prova)}</div><p class="muted" style="font-size:.85rem">Entregue em ${esc(done.data)}.</p>`:`<textarea id="mp" placeholder="Cole aqui a prova"></textarea><p id="mp-err" class="muted"></p>`}</div>
   <div class="row">${done?"":`<button class="btn primary" onclick="entregarModulo(${i})">Entregar e destravar a próxima semana</button>`}<button class="btn ghost" onclick="fecharSheet()">Fechar</button></div></div>`);
}
function entregarModulo(i){ const v=($("#mp").value||"").trim(); if(v.length<20){ $("#mp-err").textContent="A prova precisa mostrar o trabalho feito (pelo menos 20 caracteres)."; return }
  S.modulos[i]={prova:v,data:ymd(new Date())}; persistEstado(); fecharSheet(); toast(i<47?"Entregue. Próxima semana destravada.":"Trilha completa."); render() }
function salvarLog(e){ e.preventDefault(); const k=ymd(new Date()); const d=dia(k); d.log={}; ["posts","conversas","orcamentos","vendas","faturamento"].forEach(id=>{const v=$("#log-"+id).value; if(v!=="") d.log[id]=Number(v)});
  if(d.log.faturamento!==undefined && !d.missoes["noite-numeros"] && new Date().getDay()>=1 && new Date().getDay()<=5) d.missoes["noite-numeros"]={prova:"Faturamento do dia: "+brl2(d.log.faturamento),hora:new Date().toISOString()};
  persistDia(k); toast("Dia salvo."); render() }
function salvarSlots(){ for(const s in S.slots){ const a=$("#sl-"+s+"-ini").value, b=$("#sl-"+s+"-fim").value; if(a&&b&&hm(b)>hm(a)){S.slots[s].ini=a;S.slots[s].fim=b} } persistEstado(); toast("Horários salvos. Baixe a agenda de novo para atualizar o calendário."); render() }
function salvarCfg(){ const n=id=>Number($("#cf-"+id).value); if(n("meta")>0&&(!contratoAtivo()||n("meta")>=S.meta))S.meta=n("meta"); if(n("ticket")>0)S.ticket=n("ticket"); if(n("margem")>0)S.margem=n("margem"); if(n("conv")>0)S.conv=n("conv"); const i=$("#cf-inicio").value; if(contratoAtivo()){ if(n("meta")<S.meta) S.meta=Math.max(S.meta,n("meta")); toast("Com o contrato assinado, a data de início não muda e a meta só pode subir.") } else if(i) S.inicio=i; persistEstado(); toast("Configurações salvas."); render() }
/* ============ AGENDA .ICS ============ */
function gerarICS(){
  const st=new Date(); const dt=ymd(st).replace(/-/g,"");
  const ev=(slot,byday,titulo,desc)=>{const s=S.slots[slot];const a=s.ini.replace(":","")+"00",b=s.fim.replace(":","")+"00";
   return ["BEGIN:VEVENT","UID:rdm-"+slot+"@infinityguard","DTSTAMP:"+dt+"T000000Z","DTSTART;TZID=America/Sao_Paulo:"+dt+"T"+a,"DTEND;TZID=America/Sao_Paulo:"+dt+"T"+b,"RRULE:FREQ=WEEKLY;BYDAY="+byday,"SUMMARY:"+titulo,"DESCRIPTION:"+desc,
     "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+titulo+" em 5 min","TRIGGER:-PT5M","END:VALARM","BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Começou: "+titulo,"TRIGGER:PT0M","END:VALARM","END:VEVENT"].join("\r\n")};
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Infinity Guard//Rota do Milhao//PT","CALSCALE:GREGORIAN","X-WR-CALNAME:Rota do Milhão",
   "BEGIN:VTIMEZONE","TZID:America/Sao_Paulo","BEGIN:STANDARD","DTSTART:19700101T000000","TZOFFSETFROM:-0300","TZOFFSETTO:-0300","TZNAME:-03","END:STANDARD","END:VTIMEZONE",
   ev("manha","MO,TU,WE,TH,FR","Rota do Milhão: turno da manhã","Zerar o WhatsApp e 1 story. Abra o app e coloque a prova."),
   ev("almoco","MO,TU,WE,TH,FR","Rota do Milhão: turno do almoço","Missão de conteúdo do dia. Abra o app."),
   ev("noite","MO,TU,WE,TH,FR","Rota do Milhão: módulo da semana","Aula e tarefa da Trilha + registrar os números no Placar."),
   ev("sabado","SA","Rota do Milhão: bloco de sábado","Gravar os Reels da semana e entregar a prova do módulo."),
   ev("domingo","SU","Rota do Milhão: revisão semanal","15 minutos no Placar: execução, meta e 1 decisão."),
   "END:VCALENDAR"].join("\r\n");
}
async function baixarICS(){ try{ const r=await downloadsCap.save({filename:"rota-do-milhao.ics",data:new Blob([gerarICS()],{type:"text/calendar"})}); if(r?.status==="saved") toast("Agenda baixada. Abra o arquivo no celular.") }catch(e){ if(e?.code!=="cancelled"&&e?.code!=="declined") mostrarTexto(gerarICS()) } }

/* ============ ALARME ============ */
let audioCtx=null;
function beep(){ if(!S.som) return; try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); const t=audioCtx.currentTime; [0,.35,.7].forEach(o=>{const g=audioCtx.createGain(),os=audioCtx.createOscillator();os.frequency.value=880;os.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.0001,t+o);g.gain.exponentialRampToValueAtTime(.25,t+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t+o+.25);os.start(t+o);os.stop(t+o+.3)}) }catch(e){} }
function alarme(slot){
  const ms=missoesDe(new Date()).filter(m=>m.slot===slot);
  $("#layer").innerHTML=`<div class="alarm" role="alertdialog" aria-label="Hora do turno"><div class="card"><span class="eyebrow" style="color:var(--signal)">Hora do turno · ${S.slots[slot].ini}–${S.slots[slot].fim}</span><h2>${esc(S.slots[slot].nome)}</h2>
  <ul style="margin:0;padding-left:18px">${ms.map(m=>`<li><b>${esc(m.t)}</b></li>`).join("")}</ul><p class="muted">Celular na mão, cronômetro ligado. Cada missão termina com prova.</p>
  <div class="row"><button class="btn primary" onclick="fecharSheet();view='hoje';render()">Começar agora</button><button class="btn ghost" onclick="fecharSheet()">Fechar</button></div></div></div>`;
  beep(); let n=0; const orig="Rota do Milhão"; const iv=setInterval(()=>{document.title=(n++%2?orig:"● Hora do turno");if(n>20){clearInterval(iv);document.title=orig}},800);
  try{ if("Notification" in window && Notification.permission==="granted") new Notification("Rota do Milhão: "+S.slots[slot].nome,{body:ms.map(m=>m.t).join(" · ")}) }catch(e){}
}
function testarAlarme(){ try{ if("Notification" in window && Notification.permission==="default") Notification.requestPermission().catch(()=>{}) }catch(e){} const s=slotKeyFor(new Date())[0]; alarme(s) }
const avisados = new Set();
setInterval(()=>{ const n=new Date(), k=ymd(n), nm=nowMin(n);
  slotKeyFor(n).forEach(s=>{ const ini=hm(S.slots[s].ini); if(nm>=ini && nm<ini+3 && !avisados.has(k+s)){ avisados.add(k+s); alarme(s) } });
  renderStatus(); if(n.getMinutes()%30===0&&n.getSeconds()<20) avisarGestao();
},20000);

/* ============ RENDER ============ */
let NIVEL=0;
function render(){
  NIVEL=0; NIVEL=nivelContrato();
  renderStatus();
  if(bloqueado() && ["trilha","publicar","mais"].includes(view)){ $("#app").innerHTML=`<section class="view"><div class="debt"><h3>Bloqueado pelo contrato</h3><p>${NIVEL>=3?"Três semanas seguidas abaixo de 80%. ":""}Você tem ${dividas().length} missões vencidas sem prova. Esta área abre de novo quando você zerar as pendências em Hoje. Equipe, Estúdio e Placar continuam liberados para você trabalhar.</p><button class="btn primary" style="align-self:flex-start" onclick="view='hoje';render()">Ir para as pendências</button></div></section>`; return }
  if(view==="placar"){ view="gestao"; gAba="placar" }
  const v={central:viewCentral,hoje:viewHoje,trilha:viewTrilha,equipe:viewEquipe,gestao:viewGestao,ia:viewIA,publicar:viewPublicar,mais:viewMais}[view];
  $("#app").innerHTML=`<section class="view">${v()}</section>`;
  if(view==="ia"&&iaAba==="anuncio") setTimeout(desenharAd,30);
  if(view==="ia"&&iaAba==="video") setTimeout(async()=>{ const c=$("#vd-prev"); if(c){ await garantirFonte(MARCA.fonte); desenharQuadro(c.getContext("2d"),planoVideo(VID.roteiro),0.6,MARCA,VID.midias) } },30);
  if(view==="publicar"&&pubAba==="marca") setTimeout(previaMarca,30);
}
function viewMais(){ return viewCatalogo()+viewAgenda()+viewInstalar()+viewBiblioteca() }
render();
conectar();
</script>
