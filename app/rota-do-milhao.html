<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: painel de turno de vigilância — faixa de status no topo, missão do horário em destaque, abas embaixo no celular */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --sunken:#E2E8EC; --line:#C9D3DA;
  --fg:#13212B; --muted:#4F606C;
  --accent:#0A6B6B; --accent-fg:#FFFFFF; --accent-soft:#D3EBE9;
  --signal:#B85F12; --signal-soft:#FBE8D3;
  --danger:#B42318; --danger-soft:#FBE1DE;
  --ok:#287A46; --ok-soft:#DAF0E1;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D151B; --surface:#15212A; --sunken:#0A1116; --line:#2A3A46;
  --fg:#E4ECF1; --muted:#97A8B4;
  --accent:#3DBDB3; --accent-fg:#06221F; --accent-soft:#123A38;
  --signal:#F2A257; --signal-soft:#3A2614;
  --danger:#FF7A6B; --danger-soft:#3D1A17;
  --ok:#5CCB86; --ok-soft:#143322; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D151B; --surface:#15212A; --sunken:#0A1116; --line:#2A3A46;
  --fg:#E4ECF1; --muted:#97A8B4;
  --accent:#3DBDB3; --accent-fg:#06221F; --accent-soft:#123A38;
  --signal:#F2A257; --signal-soft:#3A2614;
  --danger:#FF7A6B; --danger-soft:#3D1A17;
  --ok:#5CCB86; --ok-soft:#143322; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.45rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}

/* topo */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .in{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.brand small{font-family:var(--f-body);font-weight:500;font-size:.75rem;color:var(--muted)}
.status{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;background:var(--sunken);color:var(--fg);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--signal-soft);color:var(--signal)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

nav.tabs{display:flex;gap:4px;max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 8px;overflow-x:auto}
nav.tabs button{background:none;border:0;color:var(--muted);font:600 .9rem var(--f-body);padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
@media (max-width:720px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);margin:0;max-width:none;justify-content:space-between;padding-block:6px calc(6px + env(safe-area-inset-bottom,0px))}
  nav.tabs{gap:0}
  nav.tabs button{flex:1;min-width:0;padding:8px 2px;font-size:.7rem;display:flex;flex-direction:column;align-items:center;gap:2px}
}
nav.tabs svg{width:18px;height:18px}
@media (min-width:721px){nav.tabs svg{display:none}}

section.view{padding-top:20px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flat{background:transparent;border-style:dashed}

/* bloco da missão do horário */
.shift{border-radius:var(--r);background:var(--surface);border:1px solid var(--line);overflow:hidden}
.shift-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--sunken)}
.shift-head .clock{font-family:var(--f-mono);font-size:1.6rem;font-weight:500}
.shift-body{padding:6px 16px 14px}
.mission{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.mission:last-child{border-bottom:0}
.mission .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);margin-top:2px;display:grid;place-items:center}
.mission.done .box{background:var(--ok);border-color:var(--ok)}
.mission.late .box{border-color:var(--danger)}
.mission .t{font-weight:600}
.mission.done .t{color:var(--muted);text-decoration:line-through}
.mission .d{grid-column:2;color:var(--muted);font-size:.9rem}
.mission .act{grid-column:2;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.mission .proof{grid-column:2;font-size:.85rem;background:var(--ok-soft);color:var(--fg);border-radius:6px;padding:6px 8px;overflow-wrap:anywhere}
.tag{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--sunken);color:var(--muted)}
.tag.late{background:var(--danger-soft);color:var(--danger)}
.tag.now{background:var(--signal-soft);color:var(--signal)}

button.btn,.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 .88rem var(--f-body);padding:8px 14px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.signal{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

label.f{display:flex;flex-direction:column;gap:4px;font-size:.84rem;font-weight:600;color:var(--muted)}
input,textarea,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

/* cobrança */
.debt{border:2px solid var(--danger);background:var(--danger-soft);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.debt h3{color:var(--danger)}

/* medidor */
.meter{height:12px;background:var(--sunken);border-radius:999px;overflow:hidden;position:relative}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.meter>b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--signal)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-family:var(--f-mono);font-size:1.3rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:.8rem;color:var(--muted)}

/* trilha */
.phase{display:flex;flex-direction:column;gap:8px}
.phase-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mods{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.mod{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font:inherit;color:inherit;width:100%}
.mod:last-child{border-bottom:0}
.mod .wk{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.mod.locked{opacity:.55}
.mod.current{background:var(--accent-soft)}
.lesson{display:flex;flex-direction:column;gap:12px}
.lesson .block{border-left:3px solid var(--line);padding-left:12px}
.lesson .block.task{border-color:var(--signal)}
.lesson .block.proofb{border-color:var(--ok)}

/* gráfico */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font:11px var(--f-body)}

/* IA */
.out{white-space:pre-wrap;background:var(--sunken);border-radius:8px;padding:12px;min-height:60px;font-size:.92rem;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:600 .82rem var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

/* biblioteca */
.lib{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.lib .card{display:flex;flex-direction:column;gap:6px}

/* alarme */
.alarm{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px}
.alarm .card{max-width:440px;width:100%;border:2px solid var(--signal);display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:21;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:.9rem;max-width:calc(100% - 32px)}
.sheet{position:fixed;inset:0;z-index:19;background:color-mix(in srgb,var(--bg) 60%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 0 0;width:100%;max-width:640px;max-height:88%;overflow:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
table.t{border-collapse:collapse;width:100%;font-size:.88rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
table.t td.n,table.t th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.pulse{animation:p 1.4s ease-in-out infinite}@keyframes p{50%{opacity:.55}}}
</style>

<script>

 {n:"Fundação e prova", meta:"Uma loja e perfis que passam confiança antes de qualquer anúncio."},

const M = (f,t,aula,tarefa,prova,ferramenta,link) => ({f,t,aula,tarefa,prova,ferramenta,link});
const MODULOS = [
 M(0,"Loja que passa confiança","Cliente que não conhece a marca compra de quem prova que existe. O Raio X de Nicho mostrou que o site não exibe CNPJ, prazo de garantia, código Anatel nem avaliações. Sem isso, anúncio só queima dinheiro.","Rode a skill prova-da-loja (ou o auditor-da-loja) e corrija 3 itens hoje: CNPJ no rodapé, prazo de garantia escrito (a garantia legal do CDC é de 90 dias para produto durável) e página de troca e devolução.","Cole o link da página corrigida e quais 3 itens você arrumou.","Skill prova-da-loja · Use o auditor-da-loja","https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"),
 M(0,"Instagram que vende em 5 segundos","Quem cai no perfil decide em segundos. A bio precisa dizer para quem é, o que resolve e onde clicar. Os destaques respondem as perguntas antes do WhatsApp.","Reescreva a bio (promessa + prova + chamada para o WhatsApp) e crie 5 destaques: Kits, Como configurar, Suporte, Avaliações, Entrega. Peça 3 versões de bio no Estúdio IA.","Cole a bio nova e o nome dos 5 destaques.","Estúdio IA · Use o social-media","https://www.facebook.com/business/learn"),
 M(0,"WhatsApp Business montado","O WhatsApp é seu caixa. Catálogo, respostas rápidas e etiquetas fazem você responder em 30 segundos do celular, no ônibus ou no almoço.","Monte o catálogo com os 6 produtos, a mensagem de saudação e de ausência, 4 respostas rápidas (/kit, /pix, /frete, /garantia) e as etiquetas Novo, Orçamento, Pagou, Pós-venda.","Cole o texto das 4 respostas rápidas.","Skill atendente-infinity-guard","https://faq.whatsapp.com/"),

 M(1,"Equação de valor","Alex Hormozi resume assim: valor = resultado sonhado × chance percebida de dar certo ÷ (tempo × esforço). Para vender acima da Intelbras, aumente a chance percebida (configuração guiada, suporte) e diminua o esforço (passo a passo pronto).","Escreva a oferta \"Câmera Entregue Segura\": o kit, a configuração guiada por vídeo, o guia anti-invasão e o suporte no WhatsApp com prazo de resposta que você consegue cumprir no CLT.","Cole o texto completo da oferta.","Livro $100M Offers · Estúdio IA","https://www.acquisition.com/books"),
 M(1,"Garantia que você consegue cumprir","Garantia forte reduz o medo, mas só vale se você cumprir. Na loja online o cliente já tem 7 dias de arrependimento por lei (CDC art. 49). Use isso como argumento, sem inventar prazo de fábrica.","Escreva a sua garantia de suporte (ex.: resposta no WhatsApp até 20h do mesmo dia útil) e passe pelo revisor-de-promessas.","Cole a garantia aprovada pelo revisor.","Skill revisor-de-promessas","https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"),

function moduloAtualIdx(){ for(let i=0;i<MODULOS.length;i++) if(!S.modulos[i]) return i; return MODULOS.length-1 }
function semanaDoPlano(){ return Math.max(0,Math.floor(daysBetween(parseYmd(S.inicio),new Date())/7)) }
function mesDoPlano(dStr){ const a=parseYmd(S.inicio), d=parseYmd(dStr); return (d.getFullYear()-a.getFullYear())*12+(d.getMonth()-a.getMonth())-(d.getDate()<a.getDate()?1:0) }
function fatTotal(){ let t=0; for(const k in DIAS_DB) t+=Number(DIAS_DB[k].log?.faturamento||0); return t }
function fatMes(m){ let t=0; for(const k in DIAS_DB) if(mesDoPlano(k)===m) t+=Number(DIAS_DB[k].log?.faturamento||0); return t }
function metaMes(m){ return Math.round(RAMPA[Math.min(11,Math.max(0,m))]*S.meta/1000000) }
function slotStatus(date,slot){ // antes | agora | depois
  const s=S.slots[slot]; const today=ymd(date)===ymd(new Date());
  if(!today) return ymd(date)<ymd(new Date())?"depois":"antes";
  const n=nowMin(new Date()); if(n<hm(s.ini)) return "antes"; if(n<=hm(s.fim)) return "agora"; return "depois";
}
function missoesDe(date){ const mi=moduloAtualIdx(); return missoesDoDia(date,MODULOS[mi],MODULOS[mi].f) }
function conta(d,m){ // missão de um turno que já tinha acabado quando o app foi criado não conta
  if(ymd(d)!==S.inicio||!S.criado) return true; const c=new Date(S.criado); if(ymd(c)!==S.inicio) return true;
  return hm(S.slots[m.slot].fim) > nowMin(c);
}
function execucao(diasAtras){ // % feitas em dias passados/presentes já vencidos
  let total=0, feitas=0; const hoje=new Date(); const ini=parseYmd(S.inicio);
  for(let i=0;i<diasAtras;i++){
    const d=new Date(hoje); d.setDate(hoje.getDate()-i); if(d<ini) break;
    const k=ymd(d); missoesDe(d).forEach(m=>{
      if(!conta(d,m)) return;
      const done=!!DIAS_DB[k]?.missoes?.[m.id]; const vencida = slotStatus(d,m.slot)==="depois";
      if(done||vencida){ total++; if(done) feitas++; }
    });
  }
  return {total,feitas,pct: total?Math.round(feitas/total*100):null};
}
function dividas(){ // missões vencidas sem prova nem motivo nos últimos 7 dias
  const out=[]; const hoje=new Date(); const ini=parseYmd(S.inicio);
  for(let i=0;i<7;i++){ const d=new Date(hoje); d.setDate(hoje.getDate()-i); if(d<ini) break; const k=ymd(d);
    missoesDe(d).forEach(m=>{ if(conta(d,m) && slotStatus(d,m.slot)==="depois" && !DIAS_DB[k]?.missoes?.[m.id] && !DIAS_DB[k]?.motivos?.[m.id]) out.push({k,d,m}) }) }
  return out;
}
function sequencia(){ // dias seguidos com 80% ou mais das missões feitas (hoje conta só se já bateu)
  const okDia=d=>{const k=ymd(d);const ms=missoesDe(d).filter(m=>conta(d,m));return ms.length>0&&ms.filter(m=>DIAS_DB[k]?.missoes?.[m.id]).length/ms.length>=0.8};
  const hoje=new Date(), ini=parseYmd(S.inicio); let n=okDia(hoje)?1:0;
  for(let i=1;i<400;i++){ const d=new Date(hoje); d.setDate(hoje.getDate()-i); if(d<ini) break; if(okDia(d)) n++; else break }
  return n }

   <div class="kpi"><span class="eyebrow">Orçamento → venda</span><span class="v">${fech===null?"–":fech.toFixed(0)+"%"}</span><span class="s">alvo de excelência: 30–50%</span></div>

   <div class="kpi"><span class="eyebrow">Posts publicados</span><span class="v">${posts}</span><span class="s">${vendas} vendas no total</span></div>
  </div>`;
  // gráfico 14 dias
  const W=640,H=200,P=34, n=14; const pts=[]; for(let i=n-1;i>=0;i--){const x=new Date(agora);x.setDate(agora.getDate()-i);pts.push({d:x,v:+(DIAS_DB[ymd(x)]?.log?.faturamento||0)})}
  const alvo=metaMes(m)/30; const max=Math.max(alvo*1.2,...pts.map(p=>p.v),1); const bw=(W-P-10)/n;
  const y=v=>H-24-(v/max)*(H-40);
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturamento dos últimos 14 dias contra a meta diária">`;
  [0,.5,1].forEach(t=>{const v=max*t;svg+=`<line x1="${P}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${P-4}" y="${y(v)+4}" text-anchor="end">${v>=1000?Math.round(v/1000)+"k":Math.round(v)}</text>`});
  pts.forEach((p,i)=>{const x=P+i*bw+3;svg+=`<rect x="${x}" y="${y(p.v)}" width="${bw-6}" height="${Math.max(0,H-24-y(p.v))}" rx="3" fill="${p.v>=alvo?"var(--ok)":"var(--accent)"}"/>${i%2===(n-1)%2?`<text x="${x+(bw-6)/2}" y="${H-8}" text-anchor="middle">${p.d.getDate()}/${p.d.getMonth()+1}</text>`:""}`});
  svg+=`<line x1="${P}" x2="${W-6}" y1="${y(alvo)}" y2="${y(alvo)}" stroke="var(--signal)" stroke-width="2" stroke-dasharray="5 4"/><text x="${W-8}" y="${y(alvo)-6}" text-anchor="end" style="fill:var(--signal)">meta/dia ${brl(alvo)}</text></svg>`;
  h+=`<div class="card stack"><span class="eyebrow">Faturamento dos últimos 14 dias</span><div class="chart">${svg}</div></div>`;
  // rampa
  h+=`<div class="card stack"><span class="eyebrow">Rampa até ${brl(S.meta)} em 12 meses</span><p class="muted" style="font-size:.88rem">Ninguém começa vendendo R$ 83 mil por mês. A meta sobe mês a mês, conforme cada fase entra no ar. Ajuste a meta anual em Agenda → Configurações.</p>
   <div class="scroll"><table class="t"><thead><tr><th>Mês</th><th>Fase principal</th><th class="n">Meta</th><th class="n">Feito</th><th class="n">Vendas/dia*</th></tr></thead><tbody>
   ${RAMPA.map((_,i)=>{const mm=metaMes(i),f=fatMes(i);return `<tr${i===m?' style="background:var(--accent-soft)"':""}><td>${i+1}</td><td>${esc(FASES[i].n)}</td><td class="n">${brl(mm)}</td><td class="n" style="color:${f>=mm&&f>0?"var(--ok)":"inherit"}">${brl(f)}</td><td class="n">${(mm/30/S.ticket).toFixed(1).replace(".",",")}</td></tr>`}).join("")}
   </tbody></table></div><p class="muted" style="font-size:.8rem">*com ticket de ${brl(S.ticket)}. Vender para empresas (fase 7) sobe o ticket e reduz o número de vendas por dia.</p></div>`;
  return h;
}

function trabalhar(id,tarefa,ordem){ const e=func(id); trab={id:e.id,out:"",busy:false,ctl:null,ordem:ordem||null};
  sheet(`<span class="eyebrow">${esc(e.squad)}</span><h3>${esc(e.cargo)}</h3><p class="muted" style="font-size:.88rem">${esc(e.desc)}</p>
  <label class="f" for="tb-in">Tarefa</label><textarea id="tb-in" placeholder="O que ${esc(e.id)} deve fazer agora?">${esc(tarefa||"")}</textarea>
  <div class="row">${sampleFn?`<button class="btn primary" id="tb-go" onclick="executarFunc()">Trabalhar agora</button>`:`<span class="muted" style="font-size:.88rem">A IA embutida não está disponível nesta visualização.</span>`}<button class="btn" onclick="copiar('Use o ${e.id}: '+($('#tb-in').value||''))">Copiar comando do Claude Code</button></div>
  <div class="out" id="tb-out" aria-live="polite"><span class="muted">A entrega aparece aqui.</span></div><div class="row" id="tb-acts"></div>
  <button class="btn ghost" style="align-self:flex-start" onclick="if(trab.ctl)trab.ctl.abort();fecharSheet()">Fechar</button>`);
}
async function executarFunc(){ const t=($("#tb-in").value||"").trim(); if(!t){toast("Escreva a tarefa.");return} if(trab.busy) return;
  trab.busy=true; trab.ctl=new AbortController(); const b=$("#tb-go"); if(b){b.disabled=true;b.textContent="Trabalhando…"}
  try{ const r=await sampleFn(promptFunc(trab.id,t),{signal:trab.ctl.signal,cache:false,onText:({text})=>{trab.out=text;const o=$("#tb-out");if(o)o.textContent=text}}); trab.out=r.text }
  catch(e){ trab.out=e?.text||({not_granted:"Você não liberou a IA para este app. Libere no menu de permissões ou use o comando do Claude Code.",rate_limited:"Muitos pedidos seguidos. Espere um minuto.",cancelled:""}[e?.code]??"Não consegui agora. Tente de novo em instantes.") }
  trab.busy=false; trab.tarefa=t; const o=$("#tb-out"); if(o) o.textContent=trab.out; if(b){b.disabled=false;b.textContent="Trabalhar de novo"}
  const a=$("#tb-acts"); if(a&&trab.out) a.innerHTML=`<button class="btn sm" onclick="copiar(trab.out)">Copiar</button><button class="btn sm primary" onclick="guardarEntrega()">Guardar entrega${trab.ordem?" e concluir a ordem":""}</button>`;
}
function guardarEntrega(){ const e=func(trab.id); EXTRA.entregas.push({func:e.id,tarefa:trab.tarefa||"",texto:trab.out.slice(0,4000),data:ymd(new Date())}); while(EXTRA.entregas.length>25) EXTRA.entregas.shift(); persistExtra(); if(trab.ordem) concluirOrdem(trab.ordem,true); fecharSheet(); toast("Entrega guardada."); render() }
function concluirOrdem(id,silent){ S.ordens=S.ordens||{}; S.ordens[id]=ymd(new Date()); const lim=ymd(new Date(Date.now()-30*864e5)); for(const k in S.ordens) if(k.slice(0,10)<lim) delete S.ordens[k]; persistEstado(); if(!silent){toast("Ordem concluída.");render()} }

/* ============ AÇÕES ============ */
function sheet(html){ $("#layer").innerHTML=`<div class="sheet" onclick="if(event.target===this)fecharSheet()"><div class="panel" role="dialog" aria-modal="true">${html}</div></div>` }
function fecharSheet(){ $("#layer").innerHTML="" }
function provar(k,id){
  const d=new Date(parseYmd(k)); const m=missoesDe(d).find(x=>x.id===id);
  sheet(`<span class="eyebrow">Concluir missão</span><h3>${esc(m?.t||"")}</h3><p class="muted">${esc(m?.d||"")}</p>
   <label class="f" for="pv">Prova (link, número ou o que você fez — mínimo 8 caracteres)</label><textarea id="pv"></textarea>
   <div class="row"><button class="btn primary" onclick="confirmarProva('${k}','${id}')">Concluir</button><button class="btn ghost" onclick="fecharSheet()">Cancelar</button></div><p id="pv-err" class="muted"></p>`);
  setTimeout(()=>$("#pv")?.focus(),50);
}
function confirmarProva(k,id){ const v=($("#pv").value||"").trim(); if(v.length<8){ $("#pv-err").textContent="Prova curta demais. Escreva o link, o número ou o que você fez."; return }
  const d=dia(k); d.missoes[id]={prova:v,hora:new Date().toISOString()}; if(d.motivos) delete d.motivos[id]; persistDia(k); fecharSheet(); toast("Missão concluída."); render() }
function motivo(k,id){ sheet(`<span class="eyebrow">Missão não feita</span><h3>Qual foi o motivo real?</h3><p class="muted">Seja honesto. Na revisão de domingo você vai ver o padrão dos motivos.</p><textarea id="mt"></textarea><div class="row"><button class="btn primary" onclick="confirmarMotivo('${k}','${id}')">Registrar</button><button class="btn ghost" onclick="fecharSheet()">Cancelar</button></div>`) }
function confirmarMotivo(k,id){ const v=($("#mt").value||"").trim(); if(v.length<5){toast("Escreva o motivo.");return} const d=dia(k); d.motivos=d.motivos||{}; d.motivos[id]=v; persistDia(k); fecharSheet(); render() }
function abrirModulo(i){
  const mi=moduloAtualIdx(); const m=MODULOS[i]; if(i>mi){ toast("Entregue a prova do módulo atual para abrir este."); return }
  const done=S.modulos[i];
  sheet(`<div class="lesson"><span class="eyebrow">Semana ${i+1} · fase ${m.f+1}: ${esc(FASES[m.f].n)}</span><h2>${esc(m.t)}</h2>
   <div class="block"><span class="eyebrow">Aula</span><p>${esc(m.aula)}</p></div>
   <div class="block task"><span class="eyebrow">Mão na massa</span><p>${esc(m.tarefa)}</p>${m.ferramenta?`<p class="muted" style="font-size:.88rem">Ferramenta: ${esc(m.ferramenta)}</p>`:""}${m.link?`<a href="${esc(m.link)}" target="_blank" rel="noopener" style="font-size:.88rem">Material de apoio</a>`:""}</div>
   <div class="block proofb"><span class="eyebrow">Prova de entrega</span><p>${esc(m.prova)}</p>
    ${done?`<div class="out">${esc(done.prova)}</div><p class="muted" style="font-size:.85rem">Entregue em ${esc(done.data)}.</p>`:`<textarea id="mp" placeholder="Cole aqui a prova"></textarea><p id="mp-err" class="muted"></p>`}</div>
   <div class="row">${done?"":`<button class="btn primary" onclick="entregarModulo(${i})">Entregar e destravar a próxima semana</button>`}<button class="btn ghost" onclick="fecharSheet()">Fechar</button></div></div>`);
}
function entregarModulo(i){ const v=($("#mp").value||"").trim(); if(v.length<20){ $("#mp-err").textContent="A prova precisa mostrar o trabalho feito (pelo menos 20 caracteres)."; return }
  S.modulos[i]={prova:v,data:ymd(new Date())}; persistEstado(); fecharSheet(); toast(i<47?"Entregue. Próxima semana destravada.":"Trilha completa."); render() }
function salvarLog(e){ e.preventDefault(); const k=ymd(new Date()); const d=dia(k); d.log={}; ["posts","conversas","orcamentos","vendas","faturamento"].forEach(id=>{const v=$("#log-"+id).value; if(v!=="") d.log[id]=Number(v)});
  if(d.log.faturamento!==undefined && !d.missoes["noite-numeros"] && new Date().getDay()>=1 && new Date().getDay()<=5) d.missoes["noite-numeros"]={prova:"Faturamento do dia: "+brl2(d.log.faturamento),hora:new Date().toISOString()};
  persistDia(k); toast("Dia salvo."); render() }
function salvarSlots(){ for(const s in S.slots){ const a=$("#sl-"+s+"-ini").value, b=$("#sl-"+s+"-fim").value; if(a&&b&&hm(b)>hm(a)){S.slots[s].ini=a;S.slots[s].fim=b} } persistEstado(); toast("Horários salvos. Baixe a agenda de novo para atualizar o calendário."); render() }
function salvarCfg(){ const n=id=>Number($("#cf-"+id).value); if(n("meta")>0)S.meta=n("meta"); if(n("ticket")>0)S.ticket=n("ticket"); if(n("margem")>0)S.margem=n("margem"); if(n("conv")>0)S.conv=n("conv"); const i=$("#cf-inicio").value; if(i)S.inicio=i; persistEstado(); toast("Configurações salvas."); render() }
function abrirContrato(){ const c=S.contrato;
  sheet(`<span class="eyebrow">Contrato comigo mesmo</span><h3>Compromisso de execução</h3>
  <label class="f">Eu me comprometo a…<textarea id="ct-c" placeholder="Ex.: cumprir 80% das missões toda semana nos meus horários livres por 12 meses, até chegar a R$ 1 milhão por ano.">${esc(c.compromisso)}</textarea></label>
  <label class="f">Se a semana fechar abaixo de 80%, eu…<input id="ct-m" placeholder="Ex.: fico sem streaming no fim de semana e faço o bloco de sábado em dobro" value="${esc(c.multa)}"></label>
  ${c.assinado?`<p class="muted">Assinado em ${esc(c.data)}.</p>`:""}
  <div class="row"><button class="btn primary" onclick="assinar()">${c.assinado?"Atualizar":"Assinar"}</button><button class="btn ghost" onclick="fecharSheet()">Fechar</button></div>`) }
function assinar(){ const c=$("#ct-c").value.trim(), m=$("#ct-m").value.trim(); if(c.length<15||m.length<5){toast("Escreva o compromisso e a consequência.");return} S.contrato={assinado:true,compromisso:c,multa:m,data:S.contrato.data||ymd(new Date())}; persistEstado(); fecharSheet(); toast("Contrato assinado."); render() }

/* ============ AGENDA .ICS ============ */
function gerarICS(){
  const st=new Date(); const dt=ymd(st).replace(/-/g,"");
  const ev=(slot,byday,titulo,desc)=>{const s=S.slots[slot];const a=s.ini.replace(":","")+"00",b=s.fim.replace(":","")+"00";
   return ["BEGIN:VEVENT","UID:rdm-"+slot+"@infinityguard","DTSTAMP:"+dt+"T000000Z","DTSTART;TZID=America/Sao_Paulo:"+dt+"T"+a,"DTEND;TZID=America/Sao_Paulo:"+dt+"T"+b,"RRULE:FREQ=WEEKLY;BYDAY="+byday,"SUMMARY:"+titulo,"DESCRIPTION:"+desc,
     "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+titulo+" em 5 min","TRIGGER:-PT5M","END:VALARM","BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Começou: "+titulo,"TRIGGER:PT0M","END:VALARM","END:VEVENT"].join("\r\n")};
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Infinity Guard//Rota do Milhao//PT","CALSCALE:GREGORIAN","X-WR-CALNAME:Rota do Milhão",
   "BEGIN:VTIMEZONE","TZID:America/Sao_Paulo","BEGIN:STANDARD","DTSTART:19700101T000000","TZOFFSETFROM:-0300","TZOFFSETTO:-0300","TZNAME:-03","END:STANDARD","END:VTIMEZONE",
   ev("manha","MO,TU,WE,TH,FR","Rota do Milhão: turno da manhã","Zerar o WhatsApp e 1 story. Abra o app e coloque a prova."),
   ev("almoco","MO,TU,WE,TH,FR","Rota do Milhão: turno do almoço","Missão de conteúdo do dia. Abra o app."),
   ev("noite","MO,TU,WE,TH,FR","Rota do Milhão: módulo da semana","Aula e tarefa da Trilha + registrar os números no Placar."),
   ev("sabado","SA","Rota do Milhão: bloco de sábado","Gravar os Reels da semana e entregar a prova do módulo."),
   ev("domingo","SU","Rota do Milhão: revisão semanal","15 minutos no Placar: execução, meta e 1 decisão."),
   "END:VCALENDAR"].join("\r\n");
}
async function baixarICS(){ try{ const r=await downloadsCap.save({filename:"rota-do-milhao.ics",data:new Blob([gerarICS()],{type:"text/calendar"})}); if(r?.status==="saved") toast("Agenda baixada. Abra o arquivo no celular.") }catch(e){ if(e?.code!=="cancelled"&&e?.code!=="declined") mostrarTexto(gerarICS()) } }

/* ============ ALARME ============ */
let audioCtx=null;
function beep(){ if(!S.som) return; try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); const t=audioCtx.currentTime; [0,.35,.7].forEach(o=>{const g=audioCtx.createGain(),os=audioCtx.createOscillator();os.frequency.value=880;os.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.0001,t+o);g.gain.exponentialRampToValueAtTime(.25,t+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t+o+.25);os.start(t+o);os.stop(t+o+.3)}) }catch(e){} }
function alarme(slot){
  const ms=missoesDe(new Date()).filter(m=>m.slot===slot);
  $("#layer").innerHTML=`<div class="alarm" role="alertdialog" aria-label="Hora do turno"><div class="card"><span class="eyebrow" style="color:var(--signal)">Hora do turno · ${S.slots[slot].ini}–${S.slots[slot].fim}</span><h2>${esc(S.slots[slot].nome)}</h2>
  <ul style="margin:0;padding-left:18px">${ms.map(m=>`<li><b>${esc(m.t)}</b></li>`).join("")}</ul><p class="muted">Celular na mão, cronômetro ligado. Cada missão termina com prova.</p>
  <div class="row"><button class="btn primary" onclick="fecharSheet();view='hoje';render()">Começar agora</button><button class="btn ghost" onclick="fecharSheet()">Fechar</button></div></div></div>`;
  beep(); let n=0; const orig="Rota do Milhão"; const iv=setInterval(()=>{document.title=(n++%2?orig:"● Hora do turno");if(n>20){clearInterval(iv);document.title=orig}},800);
  try{ if("Notification" in window && Notification.permission==="granted") new Notification("Rota do Milhão: "+S.slots[slot].nome,{body:ms.map(m=>m.t).join(" · ")}) }catch(e){}
}
function testarAlarme(){ try{ if("Notification" in window && Notification.permission==="default") Notification.requestPermission().catch(()=>{}) }catch(e){} const s=slotKeyFor(new Date())[0]; alarme(s) }
const avisados = new Set();
setInterval(()=>{ const n=new Date(), k=ymd(n), nm=nowMin(n);
  slotKeyFor(n).forEach(s=>{ const ini=hm(S.slots[s].ini); if(nm>=ini && nm<ini+3 && !avisados.has(k+s)){ avisados.add(k+s); alarme(s) } });
  renderStatus();
},20000);

/* ============ RENDER ============ */
function render(){
  renderStatus();
  const v={hoje:viewHoje,trilha:viewTrilha,equipe:viewEquipe,placar:viewPlacar,ia:viewIA,agenda:viewAgenda,biblioteca:viewBiblioteca}[view];
  $("#app").innerHTML=`<section class="view">${v()}</section>`;
}
render();
conectar();
</script>
