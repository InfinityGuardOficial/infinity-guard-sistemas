APO[19] = `## 1. Definição clássica
**P(A) = casos favoráveis ÷ casos possíveis**, quando todos os casos são igualmente prováveis. A probabilidade vai de 0 (impossível) a 1 (certo).
Exemplo: um dado de 6 faces. P(sair número par) = 3/6 = 1/2.

## 2. Contagem: a base da probabilidade
- **Princípio multiplicativo:** se uma escolha tem m opções e outra tem n, as duas juntas têm m × n. Senhas de 4 dígitos: 10⁴ = 10.000.
- **Permutação:** ordenar n elementos distintos: n!. Formas de 4 pessoas numa fila: 4! = 24.
- **Arranjo** (a ordem importa): A(n,p) = n!/(n−p)!. Escolher presidente e vice entre 5: 5 × 4 = 20.
- **Combinação** (a ordem não importa): C(n,p) = n!/[p!(n−p)!]. Escolher 2 pessoas entre 5: 10.
Como decidir: pergunte se trocar a ordem gera um resultado diferente. Se gera, é arranjo. Se não, é combinação.

## 3. Evento complementar
**P(não A) = 1 − P(A).**
Use quando a pergunta tem "**pelo menos um**". Probabilidade de sair pelo menos uma cara em 3 lançamentos: 1 − P(nenhuma cara) = 1 − (1/2)³ = 7/8.

## 4. União de eventos ("ou")
**P(A ou B) = P(A) + P(B) − P(A e B).**
Se A e B são **mutuamente exclusivos** (não acontecem juntos), basta somar.
Exemplo: numa turma, 60% falam inglês, 30% espanhol e 20% os dois. P(inglês ou espanhol) = 60 + 30 − 20 = 70%.

## 5. Interseção ("e")
- Eventos **independentes** (um não afeta o outro): **P(A e B) = P(A) × P(B)**.
- **Sem reposição**, os eventos são dependentes, e a segunda probabilidade muda.
Exemplo: uma urna com 3 bolas azuis e 2 brancas. Tirar 2 azuis sem reposição: 3/5 × 2/4 = 6/20 = 3/10. Com reposição: 3/5 × 3/5 = 9/25.

## 6. Probabilidade condicional
**P(A | B) = P(A e B) ÷ P(B)**: a probabilidade de A **sabendo que** B aconteceu.
Exemplo com tabela: 100 clientes, 40 com cartão. Dos que têm cartão, 10 estão inadimplentes. P(inadimplente | tem cartão) = 10/40 = 25%.
Monte sempre a tabela de dupla entrada. Ela resolve a maioria das questões de condicional sem fórmula.

## 7. Distribuição binomial (para reconhecer)
n tentativas independentes, cada uma com probabilidade p de sucesso.
P(k sucessos) = C(n,k) × p^k × (1−p)^(n−k).
Exemplo: 3 lançamentos de moeda, P(exatamente 2 caras) = C(3,2) × (1/2)² × (1/2) = 3/8.

## 8. Pegadinhas
- Somar probabilidades de eventos que **não** são exclusivos sem subtrair a interseção.
- Esquecer que sem reposição o total diminui.
- Confundir arranjo com combinação em comissões, onde a ordem não importa.`;

APO[23] = `## 1. Descontos simples
Desconto é o abatimento por pagar ou receber um título **antes do vencimento**. N é o valor nominal (no vencimento), A é o valor atual (pago hoje), d é a taxa e t é o tempo.
- **Desconto comercial (por fora):** calculado sobre o **valor nominal**. D = N × d × t e A = N × (1 − d × t). É o mais usado pelos bancos.
- **Desconto racional (por dentro):** calculado sobre o **valor atual**. A = N ÷ (1 + i × t) e D = N − A.
Exemplo: título de R$ 1.000, 2 meses antes, a 5% ao mês.
Comercial: D = 1.000 × 0,05 × 2 = 100, A = 900.
Racional: A = 1.000 ÷ 1,10 ≈ 909,09, D ≈ 90,91.
O desconto comercial é **sempre maior** que o racional nas mesmas condições.
**Taxa efetiva do desconto comercial:** i = d ÷ (1 − d × t). No exemplo, 100 de juros sobre 900 em 2 meses dá 11,1% no período, mais que os 10% nominais.

## 2. Descontos compostos
- **Racional composto:** A = N ÷ (1 + i)^n. É o mesmo que trazer a valor presente.
- **Comercial composto:** A = N × (1 − d)^n. Aparece pouco.

## 3. Séries uniformes de pagamentos
Parcelas iguais (PMT), a taxa i, por n períodos, com pagamento no fim de cada período (série postecipada).
- **Valor presente:** PV = PMT × [1 − (1 + i)^−n] ÷ i
- **Valor futuro:** FV = PMT × [(1 + i)^n − 1] ÷ i
A prova costuma dar o fator pronto numa tabela. Leia com atenção se a primeira parcela é paga no ato (série antecipada). Nesse caso, ela não sofre desconto.

## 4. Sistema SAC (Amortização Constante)
- A **amortização é igual** em todas as parcelas: A = saldo devedor ÷ n.
- Os **juros caem** a cada mês, porque o saldo cai.
- A **prestação cai** em progressão aritmética.
Exemplo: R$ 12.000 em 12 meses a 1% ao mês.
Amortização = 1.000.
1ª parcela: juros 120 + amortização 1.000 = 1.120.
2ª parcela: saldo 11.000, juros 110, parcela 1.110.
A parcela cai R$ 10 por mês (1% de 1.000). A última é 1.000 + 10 = 1.010.

## 5. Sistema Price (francês)
- A **prestação é constante**.
- Os **juros caem** e a **amortização cresce** ao longo do tempo.
Exemplo: R$ 10.000 em 2 meses a 10% ao mês.
PMT = 10.000 × 0,10 ÷ (1 − 1,1^−2) ≈ 5.761,90.
Mês 1: juros 1.000, amortização 4.761,90, saldo 5.238,10.
Mês 2: juros 523,81, amortização 5.238,09, saldo zero.

## 6. Comparação que cai na prova
- No SAC, a primeira prestação é **maior** que a da Price, e a última é **menor**.
- O **total de juros** pago no SAC é **menor**, porque o saldo cai mais depressa.
- Nos dois sistemas, os juros de cada mês são a taxa vezes o saldo devedor do início do mês.
- A CAIXA usa muito o SAC no financiamento habitacional.

## 7. Pegadinhas
- No SAC o que é constante é a **amortização**. Na Price é a **prestação**.
- Desconto comercial incide sobre o **nominal**, e o racional sobre o **atual**.
- Na série antecipada, a entrada não tem desconto.`;

APO[24] = `## 1. Os pilares da segurança da informação
- **Confidencialidade:** só quem tem autorização acessa.
- **Integridade:** a informação não é alterada sem autorização.
- **Disponibilidade:** está acessível quando precisa.
Também são cobrados a **autenticidade** (garantia de quem é o autor) e o **não repúdio** (o autor não pode negar a autoria).

## 2. Malware: os tipos que caem
- **Vírus:** precisa de um arquivo hospedeiro e da ação do usuário para se espalhar.
- **Worm:** se espalha sozinho pela rede, sem hospedeiro.
- **Cavalo de Troia (trojan):** parece útil, mas abre caminho para o invasor.
- **Ransomware:** criptografa os dados e pede resgate.
- **Spyware:** espiona. O **keylogger** grava o que é digitado.
- **Botnet:** rede de computadores infectados controlados remotamente, usada em ataques de negação de serviço (DDoS).
- **Backdoor:** porta escondida para acesso futuro.

## 3. Engenharia social e golpes bancários
Engenharia social é enganar a pessoa, e não a máquina.
- **Phishing:** e-mail ou site falso. **Smishing:** por SMS. **Vishing:** por voz, ao telefone.
- **Falsa central de atendimento:** a pessoa recebe ligação "do banco" dizendo que há uma compra suspeita e é levada a passar dados ou fazer transferências.
- **Falso funcionário ou motoboy:** pedem o cartão "para perícia". O banco **nunca** busca cartão em casa.
- **Mão fantasma:** convencem a vítima a instalar app de acesso remoto e operam a conta.
- **Boleto falso:** código de barras adulterado. Confira o beneficiário antes de pagar.
- **Golpe do WhatsApp clonado** e **SIM swap**, a clonagem do chip do celular.
**Regra de ouro para orientar o cliente:** o banco não pede senha, não pede transferência para "conta segura", não pede para instalar aplicativo e não liga pedindo código recebido por SMS.

## 4. Autenticação
Fatores:
- algo que você **sabe**: senha, PIN;
- algo que você **tem**: celular, token, cartão;
- algo que você **é**: biometria.
**Autenticação multifator (MFA)** combina fatores **de tipos diferentes**. Senha + PIN não é multifator.

## 5. Criptografia
- **Simétrica:** a mesma chave cifra e decifra. É rápida. Exemplo: AES.
- **Assimétrica:** par de chaves, pública e privada. Exemplo: RSA. Cifrar com a pública do destinatário garante confidencialidade.
- **Hash:** resumo de tamanho fixo e irreversível. Garante **integridade**. Exemplo: SHA-256.
- **Assinatura digital:** hash cifrado com a **chave privada** do autor. Garante autenticidade, integridade e não repúdio.
- **Certificado digital:** documento eletrônico que liga a chave pública a uma pessoa, emitido por autoridade certificadora da **ICP-Brasil**.

## 6. Defesa
- **Firewall:** filtra o tráfego de rede por regras.
- **IDS:** detecta intrusão. **IPS:** detecta e bloqueia.
- **VPN:** túnel criptografado sobre a internet.
- **Antivírus** e atualizações em dia.
- **Backup:** completo (tudo), incremental (o que mudou desde o último backup de qualquer tipo) e diferencial (o que mudou desde o último completo). A regra 3-2-1: 3 cópias, em 2 mídias, 1 fora do local.
- **Normas:** ISO/IEC 27001 (sistema de gestão) e 27002 (controles, que na versão de 2022 são 93, em 4 temas).

## 7. Pegadinhas

## 2. Word em português: atalhos
**Ctrl+N** negrito, **Ctrl+I** itálico, **Ctrl+S** sublinhado, **Ctrl+B** salvar, **Ctrl+Z** desfazer, **Ctrl+R** refazer, **Ctrl+C/X/V** copiar, recortar e colar, **Ctrl+P** imprimir, **Ctrl+L** localizar, **Ctrl+E** centralizar.

## 3. Redes e internet
- **LAN:** rede local. **MAN:** metropolitana. **WAN:** de longa distância, como a internet.
- **TCP/IP:** a família de protocolos da internet. O TCP é confiável e orientado a conexão. O UDP é mais rápido e sem garantia de entrega.
- **IP:** endereço do dispositivo. **DNS:** traduz nomes como caixa.gov.br em endereços IP. **DHCP:** distribui IPs automaticamente.
- **HTTP** (porta 80) e **HTTPS** (porta 443, com criptografia TLS). O cadeado no navegador indica HTTPS, mas **não** garante que o site seja honesto.
- **E-mail:** SMTP envia. POP3 baixa e normalmente apaga do servidor. IMAP sincroniza e mantém no servidor.
- **Intranet:** rede interna com tecnologia da internet. **Extranet:** parte da intranet aberta a parceiros.

## 4. Computação em nuvem
- **IaaS:** infraestrutura, como servidores e armazenamento.
- **PaaS:** plataforma para desenvolver e rodar aplicações.
- **SaaS:** software pronto pela internet, como e-mail web e Office 365.
- Modelos: **pública**, **privada**, **híbrida** e **comunitária**.
- Vantagens: **elasticidade** (cresce e diminui sob demanda), pagamento pelo uso, disponibilidade.

## 5. Dados
- **Big Data**, com os Vs: volume, velocidade, variedade, veracidade e valor.
- **Data warehouse:** dados estruturados e organizados para análise. **Data lake:** dados brutos de vários formatos.

- **Mineração de dados:** descobre padrões, como detectar fraude no cartão.

## 6. Inteligência artificial
- **Machine learning:** o sistema aprende com dados.
  **Supervisionado:** aprende com exemplos rotulados, como "fraude" e "não fraude".
  **Não supervisionado:** encontra grupos sozinho, como segmentar clientes.
  **Por reforço:** aprende por tentativa e recompensa.
- **Deep learning:** redes neurais de muitas camadas.
- **IA generativa e LLMs:** criam textos, imagens e códigos.
- Riscos: **alucinação** (resposta falsa com aparência de verdade), **viés** nos dados, privacidade. Nunca coloque dados de cliente numa ferramenta de IA não autorizada pelo banco.

## 7. Pegadinhas
- $A$1 não muda ao copiar.
- POP3 tira do servidor. IMAP mantém.
- SaaS é o software pronto. IaaS é só a infraestrutura.`;

APO[26] = `## 1. Manifesto Ágil (2001)
Valoriza:
- **indivíduos e interações** mais que processos e ferramentas;
- **software em funcionamento** mais que documentação abrangente;
- **colaboração com o cliente** mais que negociação de contratos;
- **responder a mudanças** mais que seguir um plano.
Os itens da direita têm valor, mas os da esquerda valem mais. São também **12 princípios**, como entregas frequentes e equipes auto-organizadas.

## 2. Scrum (Guia de 2020)
**Pilares:** transparência, inspeção e adaptação.
**Valores:** compromisso, foco, abertura, respeito e coragem.
**Responsabilidades:**
- **Product Owner:** maximiza o valor do produto e gerencia o Product Backlog. É uma pessoa, e não um comitê.
- **Scrum Master:** garante que o Scrum seja entendido e aplicado. É líder que serve, remove impedimentos.
- **Developers:** quem cria o incremento.
O time é pequeno, normalmente 10 pessoas ou menos, multifuncional e autogerenciável.
**Eventos:**
- **Sprint:** ciclo de **até 1 mês**, que contém todos os outros eventos.
- **Sprint Planning:** define o porquê, o quê e como da Sprint.
- **Daily Scrum:** **15 minutos**, todo dia, para os Developers inspecionarem o progresso.
- **Sprint Review:** inspeciona o incremento com as partes interessadas.
- **Sprint Retrospective:** o time discute como melhorar o próprio trabalho.
**Artefatos e compromissos:**
- **Product Backlog**, com a **Meta do Produto**.
- **Sprint Backlog**, com a **Meta da Sprint**.
- **Incremento**, com a **Definição de Pronto**.

## 3. Kanban
- **Visualizar** o fluxo num quadro (a fazer, fazendo, feito).
- **Limitar o trabalho em progresso (WIP)**.
- Gerenciar e melhorar o fluxo continuamente. Não tem sprints fixas.

## 4. Design Thinking
Abordagem centrada no usuário, em etapas que vão e voltam:
1. **Empatia (imersão):** entender o cliente de verdade.
2. **Definição:** formular o problema certo.
3. **Ideação:** gerar muitas ideias, sem julgar.
4. **Prototipação:** construir algo simples e barato.
5. **Teste:** colocar na mão do usuário e aprender.

## 5. Lean e MVP
- **Lean:** eliminar desperdício e gerar valor para o cliente.
- **MVP (Produto Mínimo Viável):** a versão mais simples que permite aprender com usuários reais.

## 6. OKR
- **Objetivo:** qualitativo e inspirador. Exemplo: "Ser o banco mais fácil de usar no celular".
- **Resultados-chave:** de 3 a 5, **mensuráveis**. Exemplo: "Reduzir de 8 para 4 o número de telas para fazer um Pix".
- Ciclos curtos, normalmente **trimestrais**, e transparentes para toda a empresa.
- Atingir cerca de **70%** de um OKR ambicioso já é considerado bom.
- **KPI** mede a saúde contínua de um processo. **OKR** puxa uma mudança.

## 7. Pegadinhas
- A Daily é para os **Developers**, e não uma reunião de status para o chefe.
- Sprint tem **até** 1 mês.
- Quem prioriza o backlog é o **Product Owner**.
- Resultado-chave sem número não é resultado-chave.`;

APO[27] = `## 1. Mentalidade de crescimento (Carol Dweck)
- **Mentalidade fixa:** acredita que inteligência e talento são fixos. Evita desafios e se sente ameaçada pelo erro.
- **Mentalidade de crescimento:** acredita que habilidades se desenvolvem com esforço, estratégia e ajuda. Vê o erro como informação.
Na prática: troque "não sou bom em matemática" por "ainda não domino juros compostos".

## 2. Inteligência emocional (Daniel Goleman)
Cinco componentes:
- **Autoconsciência:** reconhecer as próprias emoções.
- **Autorregulação:** controlar impulsos e reagir de forma adequada.
- **Motivação:** persistir por objetivos internos.
- **Empatia:** perceber e considerar as emoções dos outros.
- **Habilidades sociais:** relacionar-se, influenciar, resolver conflitos.
Os três primeiros são intrapessoais. Os dois últimos são interpessoais.

## 3. Liderança
- **Liderança situacional (Hersey e Blanchard):** o estilo depende da maturidade do liderado. Determinar (direcionar), persuadir (orientar), compartilhar (apoiar) e delegar.
- **Transacional:** troca de recompensas por resultados.
- **Transformacional:** inspira, desenvolve as pessoas e muda a forma como elas veem o trabalho.
- **Liderança servidora:** o líder existe para servir a equipe.

## 4. Feedback e comunicação
- Feedback bom é **específico**, sobre o **comportamento** e não sobre a pessoa, e dado no momento certo. Um modelo simples: **situação, comportamento, impacto**.
- **Comunicação Não Violenta (Marshall Rosenberg):** observação sem julgamento, sentimento, necessidade e pedido.
- **Escuta ativa:** prestar atenção total, parafrasear e fazer perguntas de esclarecimento.

## 5. Resiliência e trabalho em equipe
- **Resiliência:** capacidade de se recuperar e se adaptar diante de pressão e mudança.
- **Colaboração:** objetivos comuns, confiança e papéis claros.
- **Gestão de conflitos:** foco no problema e no interesse, e não na posição.

## 6. ODS e sustentabilidade
- A **Agenda 2030** da ONU tem **17 Objetivos de Desenvolvimento Sustentável** e **169 metas**.
- Exemplos ligados à CAIXA: ODS 1 (erradicação da pobreza, com o Bolsa Família), ODS 6 (água e saneamento), ODS 8 (trabalho decente e crescimento econômico), ODS 10 (redução das desigualdades) e ODS 11 (cidades sustentáveis, com a habitação).
- **ESG:** ambiental, social e governança. Os bancos seguem a **Política de Responsabilidade Social, Ambiental e Climática (PRSAC)**, exigida pelo CMN.

## 7. Diversidade e inclusão
Equipes diversas tomam decisões melhores e atendem melhor um público diverso. Inclusão é garantir que as pessoas participem de verdade, e não só que estejam presentes.

## 8. Pegadinhas
- Empatia e habilidades sociais são **interpessoais**.
- No modelo situacional, **delegar** é para quem tem alta maturidade.
- São **17** ODS, e não 8 (os 8 eram os antigos Objetivos do Milênio).`;

APO[28] = `## 1. O que a Cesgranrio pede
Um texto **dissertativo-argumentativo** sobre um tema atual, com base em textos motivadores. Vale **100 pontos**, e no edital de 2024 era preciso tirar no mínimo **70**. A banca avalia aspectos **formais** (gramática, ortografia, pontuação), **estruturais** (tipo de texto, organização, coesão) e de **conteúdo** (pertinência ao tema, argumentação, informatividade). Confira os critérios e o número de linhas no edital de 2027.

## 2. Estrutura de quatro parágrafos
1. **Introdução:** contextualize o tema em uma ou duas frases e apresente a **tese**, a sua posição.
2. **Desenvolvimento 1:** tópico frasal com o primeiro argumento, explicação, exemplo ou dado, e uma frase de fechamento ligada à tese.
3. **Desenvolvimento 2:** o mesmo modelo com o segundo argumento.
4. **Conclusão:** retome a tese com outras palavras e feche com uma reflexão ou proposta. Diferente do Enem, a proposta de intervenção detalhada **não** é obrigatória, mas uma solução bem colocada ajuda.

## 3. Argumentos que funcionam
- **Dados** de fontes conhecidas, como IBGE, Banco Central e ONU. Use só os que você tem certeza.
- **Exemplos** concretos.
- **Causa e consequência.**
- **Comparação** com outro país ou época.
- **Citação** ou **lei** pertinente, como a Constituição, o CDC ou a LGPD.
Temas prováveis para a CAIXA: inclusão financeira, golpes digitais, superendividamento, habitação, inteligência artificial no trabalho, sustentabilidade e ESG, educação financeira.

## 4. Coesão entre parágrafos
- Para começar o desenvolvimento: "Em primeiro lugar", "De início", "Nesse contexto".
- Para somar: "Além disso", "Somado a isso", "Ademais".
- Para opor: "No entanto", "Por outro lado".
- Para concluir: "Portanto", "Dessa forma", "Diante disso".

## 5. Erros que custam caro
- **Fuga ao tema:** pode zerar a redação. Releia o tema e o comando duas vezes.
- **Cópia dos textos motivadores.**
- Texto **narrativo** ou em forma de carta, quando se pede dissertação.
- Linguagem informal, gírias e abreviações.
- Parágrafos de uma linha só ou um bloco único.
- Generalizações como "todo mundo sabe".
- Primeira pessoa em excesso. Prefira a impessoalidade.

## 6. Tempo na prova
Reserve **1h20**: 10 minutos para planejar, com tese e dois argumentos, 40 minutos para o rascunho, 10 minutos para revisar e 20 minutos para passar a limpo com letra legível.

## 7. Treino
Escreva uma redação por semana na aba Redação, com cronômetro, e peça a correção. Reescreva a mesma redação usando os comentários. Melhorar um texto ensina mais do que escrever outro.`;

APO[29] = `## 1. Tempos verbais que aparecem nos textos
- **Simple present:** fatos e rotinas. "The bank **offers** loans."
- **Present continuous:** algo acontecendo agora ou tendência. "Banks **are investing** in AI."
- **Simple past:** ação terminada. "Inflation **rose** last year."
- **Present perfect:** do passado até agora, ou sem tempo definido. "Digital payments **have grown** since 2020."
- **Future:** "will" e "be going to". "Rates **will** fall."
Dica: **since** marca o início ("since 2020") e **for** marca a duração ("for three years").

## 2. Voz passiva
**be + particípio**. "The loan **was approved** by the manager." Em notícias, é comum: "It **is expected** that..." (espera-se que...).

## 3. Condicionais
- **Zero:** verdades gerais. "If you heat water, it boils."
- **First:** possibilidade real. "If rates fall, people **will** borrow more."
- **Second:** hipótese. "If I **had** money, I **would** invest."
- **Third:** passado que não aconteceu. "If they **had** checked, they **would have** avoided the fraud."
**Unless** = a menos que.

## 4. Comparativos
- Curtos: cheap**er** than, the cheap**est**.
- Longos: **more** expensive than, **the most** expensive.
- Irregulares: good, better, best. Bad, worse, worst.

## 5. Phrasal verbs frequentes
set up (criar), carry out (realizar), cut down on (reduzir), look into (investigar), take over (assumir o controle), pay off (quitar, ou valer a pena), turn down (recusar), figure out (entender), roll out (lançar), phase out (eliminar aos poucos).

## 6. Vocabulário bancário
- account (conta), checking account (conta corrente), savings account (poupança), balance (saldo)
- loan (empréstimo), mortgage (financiamento imobiliário), interest rate (taxa de juros), fee (tarifa), overdraft (cheque especial)
- withdraw (sacar), deposit (depositar), wire transfer (transferência), bill (conta a pagar), invoice (fatura)
- branch (agência), teller (caixa), ATM (caixa eletrônico)
- stock/share (ação), bond (título de dívida), shareholder (acionista), revenue (receita), earnings (lucro), debt (dívida)
- fraud (fraude), scam (golpe), money laundering (lavagem de dinheiro), compliance, cashless (sem dinheiro vivo)

## 7. Palavras de função que mudam tudo
- **however, although, despite, whereas:** contraste.
- **therefore, thus, hence:** conclusão.
- **moreover, furthermore:** adição.
- **such as, for instance:** exemplo.
- **rather than:** em vez de. **instead of:** em vez de.
- **few** (poucos, sentido negativo) e **a few** (alguns, sentido positivo).

## 8. Treino
Leia uma notícia de economia em inglês por dia. Sublinhe os verbos e diga o tempo verbal de cada um. Adicione 5 palavras ao vocabulário do app e revise com os flashcards.`;

APO[30] = `## 1. Como fazer o simulado direito

O app mostra o seu resultado por bloco e por matéria, comparado com os cortes de 50%.

- Onde você gastou mais tempo?

## 3. Classifique cada erro
- **Conteúdo:** não sabia. Solução: voltar à apostila e fazer 20 questões do assunto.
- **Atenção:** sabia, mas leu errado ("exceto", "incorreta", unidade da taxa). Solução: sublinhar o comando sempre.
- **Interpretação:** entendeu errado o texto ou a alternativa. Solução: treinar leitura e eliminar extrapolação.
- **Tempo:** chutou porque o tempo acabou. Solução: treinar ordem de resolução e pular questões longas.

## 4. Monte o caderno de erros
Para cada erro, anote assunto, tipo de erro e a regra certa em uma linha. Transforme os erros de conteúdo em **flashcards** pelo botão "Virar flashcard" na aba Questões.

- Continue a redação semanal, porque o mínimo de 70 pontos elimina muita gente.

## 6. Meta deste módulo
Fazer o simulado completo, classificar todos os erros e escrever no resumo as 3 matérias que vão receber prioridade nas próximas semanas.`;

async function genQuestions(){
  if(!AI || Q.gen) return;
  let s = Q.f;
  if(s === 'all'){ const acc = accBySubj(); s = MATERIAS.slice().sort((a,b) => { const ra = acc[a.id].n ? acc[a.id].ok/acc[a.id].n : .5, rb = acc[b.id].n ? acc[b.id].ok/acc[b.id].n : .5; return (ra - rb) || (b.q - a.q); })[0].id; }
  const m = M[s]; Q.gen = true; Q.genErr = ''; render();
  const prompt = `Você é professor especialista em concursos da banca Cesgranrio. Crie 5 questões INÉDITAS de múltipla escolha para o concurso da Caixa Econômica Federal, cargo Técnico Bancário Novo, disciplina "${m.nome}".

Regras: estilo Cesgranrio, 5 alternativas, apenas uma correta, distratores plausíveis, enunciado em português (em Língua Inglesa, texto e alternativas em inglês), cálculos conferidos, leis e números corretos e atuais. Varie a posição da correta.
Responda SOMENTE com JSON: {"questoes":[{"q":"enunciado","o":["A","B","C","D","E"],"a":0,"e":"explicação curta em português"}]}`;
  try {
    const r = await AI.json(prompt, {modelTier:'default'}); let n = 0;
    ((r && r.questoes) || []).forEach(x => { if(x && typeof x.q === 'string' && Array.isArray(x.o) && x.o.length === 5 && Number.isInteger(x.a) && x.a >= 0 && x.a < 5){ S.aiQ.push({id:'ai'+uid(), s, q:String(x.q), o:x.o.map(String), a:x.a, e:String(x.e||''), ai:true}); n++; } });
    if(!n) Q.genErr = 'A IA não devolveu questões válidas. Tente de novo.'; else { save(); toast(n+' questões novas de '+m.curto); Q.f = s; Q.mode = 'novas'; Q.cur = null; }
  } catch(e){ Q.genErr = e && e.code === 'rate_limited' ? 'Muitos pedidos seguidos. Espere um pouco.' : 'Não foi possível gerar agora.'; }
  Q.gen = false; render();
}

function startSim(k){
  const tp = SIM_TIPOS.find(x => x.k === k), bank = allQ(), ids = [];
  MATERIAS.forEach(m => { const want = Math.max(1, Math.round(m.q*tp.n/60)); const pool = bank.filter(q => q.s === m.id);
    shuffle(pool.filter(q => !S.resp[q.id])).concat(shuffle(pool.filter(q => S.resp[q.id]))).slice(0,want).forEach(q => ids.push(q.id)); });
  SIM = {k, ids, ans:{}, i:0, end:Date.now()+tp.min*60000, ini:Date.now(), done:false};
  clearInterval(simTick); simTick = setInterval(() => { if(!SIM || SIM.done) return clearInterval(simTick); if(Date.now() >= SIM.end) return finishSim(); const el = $('#sim-t'); if(el) el.textContent = simClock(); }, 1000);

}
function simClock(){ const r = Math.max(0, Math.round((SIM.end - Date.now())/1000)); return Math.floor(r/3600)+':'+pad(Math.floor(r%3600/60))+':'+pad(r%60); }

}

function sugestaoProva(id){

  if(id.endsWith('-sim')){ const s = S.sims[S.sims.length-1]; return s && s.d === t ? 'Simulado: '+s.ok+'/'+s.n+' ('+pct(s.ok,s.n)+'%)' : ''; }

A.provar = el => { const k = el.dataset.k, id = el.dataset.id; const m = missoesDoDia(parseYmd(k)).find(x => x.id === id); if(!m) return;
  sheet(`<span class="eyebrow">Prova da missão</span><h3>${esc(m.t)}</h3><p class="small muted">${esc(m.d)}</p><textarea id="pv-t" placeholder="Escreva a prova">${esc(sugestaoProva(id))}</textarea><div class="row"><button class="btn pri" data-act="provar-ok" data-k="${k}" data-id="${id}">Concluir missão</button><button class="btn ghost" data-act="fechar">Cancelar</button></div>`); };
A['provar-ok'] = el => { const t = $('#pv-t').value.trim(); if(t.length < 3) return toast('Escreva a prova da missão.'); const r = diaReg(el.dataset.k); r.missoes[el.dataset.id] = {prova:t, hora:new Date().toTimeString().slice(0,5)}; if(el.dataset.id === 'leitura-ler'){ const n = parseInt((t.match(/\d+/)||['0'])[0],10); if(n > 0 && n < 1000){ S.leitura.pags[el.dataset.k] = n; if(S.leitura.livro && !S.livros[S.leitura.livro]) S.livros[S.leitura.livro] = 'lendo'; } } delete r.motivos[el.dataset.id]; save(); fecharSheet(); toast('Missão concluída.'); render(); };
A.motivo = el => { sheet(`<span class="eyebrow">Motivo verdadeiro</span><h3>Por que essa missão não foi feita?</h3><textarea id="mt-t" placeholder="Seja honesto: ele entra na revisão de domingo"></textarea><div class="row"><button class="btn pri" data-act="motivo-ok" data-k="${el.dataset.k}" data-id="${el.dataset.id}">Registrar motivo</button><button class="btn ghost" data-act="fechar">Cancelar</button></div>`); };
A['motivo-ok'] = el => { const t = $('#mt-t').value.trim(); if(t.length < 10) return toast('Escreva o motivo com pelo menos 10 caracteres.'); diaReg(el.dataset.k).motivos[el.dataset.id] = t; save(); fecharSheet(); render(); };
A.fechar = () => fecharSheet();
A['lv-terminei'] = () => { const id = S.leitura.livro; if(!id) return; S.livros[id] = 'lido'; S.leitura.livro = null; save(); toast('Livro concluído. Escolha o próximo.'); render(); };
A['cfg-reset'] = () => { CFG.reset = true; render(); };
A['cfg-reset-no'] = () => { CFG.reset = false; render(); };
A['cfg-reset-ok'] = () => { CFG.reset = false; S.inicio = today(); S.criado = Date.now(); S.mods = {}; S.dias = {}; save(); toast('Cronograma recomeçado hoje.'); go('hoje'); };
A.qz = el => { if(QZ.done) return; QZ.ans[el.dataset.q] = +el.dataset.i; render(); };
A['qz-fim'] = () => { const i = QZ.i, qs = (quizIds(i)||[]).map(qById).filter(Boolean); let ok = 0;
  qs.forEach(q => { const c = QZ.ans[q.id] === q.a; if(c) ok++; registerAnswer(q.id, c); });
  QZ.done = true; const n = pct(ok, qs.length); S.mods[i] = Object.assign(S.mods[i]||{}, {quiz:Math.max(n, (S.mods[i]||{}).quiz||0)}); save(); render(); };
A['qz-reset'] = () => { QZ.ans = {}; QZ.done = false; render(); };
A.entregar = el => { const i = +el.dataset.i, st = S.mods[i] || {}, res = ($('#mod-res').value||'').trim();
  if((st.quiz||0) < 70) return toast('Faça o quiz e tire 70% ou mais.');
  if(res.length < 80) return toast('O resumo precisa de pelo menos 80 caracteres.');
  S.mods[i] = Object.assign(st, {ok:true, resumo:res, d:today()}); save(); toast(i+1 < NMOD ? 'Prova entregue. Módulo '+(i+2)+' liberado.' : 'Trilha concluída!'); QZ = {i:null, ans:{}, done:false}; go(i+1 < NMOD ? 'modulo:'+(i+1) : 'trilha'); };
A.qf = el => { Q.f = el.dataset.s; Q.cur = null; render(); };
A.qm = el => { Q.mode = el.dataset.m; Q.cur = null; render(); };
A.qsel = el => { if(Q.shown) return; Q.sel = +el.dataset.i; render(); };
A.qconf = () => { const q = qById(Q.cur); if(Q.sel === null) return; Q.shown = true; registerAnswer(q.id, Q.sel === q.a); save(); render(); };
A.qnext = () => { pickQ(); render(); window.scrollTo(0,0); };
A.q2card = () => { const q = qById(Q.cur); const f = q.q.length > 160 ? q.q.slice(0,157)+'...' : q.q; S.meusCards.push({id:'m'+uid(), s:q.s, f, v:LETRAS[q.a]+') '+q.o[q.a]+' — '+q.e}); save(); toast('Virou flashcard.'); };
A.qgen = () => genQuestions();
A.pchip = el => { const i = $('#pb-in'); if(i){ i.value = el.dataset.t; i.focus(); } };
A.psend = el => { const i = $('#pb-in'); const t = i ? i.value : ''; perguntar(el.dataset.p, t); };
A.pclear = el => { delete S.chat[el.dataset.p]; save(); render(); };
A.assinar = () => { const g = id => ($('#'+id).value||'').trim(), err = $('#ct-err');
  if(g('ct-comp').length < 20) return err.textContent = 'Escreva o seu motivo com pelo menos 20 caracteres.';
  if(!g('ct-m1') || !g('ct-m2') || !g('ct-m3')) return err.textContent = 'Defina as três consequências.';
  if(g('ct-frase').toUpperCase() !== FRASE) return err.textContent = 'Digite a frase exatamente: '+FRASE+'.';
  S.contrato = {assinado:true, compromisso:g('ct-comp'), multa1:g('ct-m1'), multa2:g('ct-m2'), multa3:g('ct-m3'), data:today()}; save(); toast('Contrato assinado. Sem volta.'); render(); };
A['rs-ask'] = () => { CT.rescisao = true; render(); };
A['rs-cancel'] = () => { CT.rescisao = false; toast('Seguimos.'); render(); };
A.rescindir = () => { const m = ($('#rs-m').value||'').trim(); if(m.length < 200) return toast('A justificativa precisa de pelo menos 200 caracteres.'); S.contrato = {assinado:false, encerrado:today(), motivo:m}; CT.rescisao = false; save(); render(); };
A['sim-start'] = el => startSim(el.dataset.k);
A['sim-ans'] = el => { SIM.ans[SIM.ids[SIM.i]] = +el.dataset.i; render(); };
A['sim-go'] = el => { const i = +el.dataset.i; if(i >= 0 && i < SIM.ids.length){ SIM.i = i; render(); } };
A['sim-ask'] = () => { SIM.confirm = true; render(); };
A['sim-cancel'] = () => { SIM.confirm = false; render(); };
A['sim-end'] = () => finishSim();
A['sim-close'] = () => { SIM = null; render(); };
A['red-ini'] = () => { S.rascunho.ini = Date.now(); save(); render(); };
A['red-zera'] = () => { S.rascunho.ini = 0; save(); render(); };
A.crit = el => { S.rascunho.crit = S.rascunho.crit || []; S.rascunho.crit[+el.dataset.i] = el.checked; save(); };
A['red-salvar'] = () => { const Rd = S.rascunho, min = Rd.ini ? Math.round((Date.now()-Rd.ini)/60000) : 0, nota = (redAI.out.match(/NOTA TOTAL:\s*([\d.,]+)/i)||[])[1];
  S.red.push({id:uid(), d:today(), tema:Rd.tema, texto:Rd.texto, words:wc(Rd.texto), min, ai:redAI.out||'', nota:nota ? nota+'/100' : ''}); if(min > 0) S.log.push({d:today(), s:'red', m:min});
  S.rascunho = {tema:Rd.tema, texto:'', ini:0, crit:[]}; redAI = {busy:false, out:'', err:''}; save(); toast('Redação salva.'); render(); };
A['red-ai'] = () => corrigirRedacao();
A['red-del'] = el => { S.red = S.red.filter(r => r.id !== el.dataset.id); save(); render(); };
A['fc-flip'] = () => { FC.flip = !FC.flip; render(); };
A['fc-r'] = el => { const r = +el.dataset.r, st = S.cards[FC.cur] || {b:0}; const b = r === 0 ? 1 : r === 1 ? Math.max(1, st.b) : Math.min(INTERVALOS.length-1, st.b+1);
  S.cards[FC.cur] = {b, due:addDays(today(), r === 0 ? 1 : INTERVALOS[b] || 1)}; S.fclog[today()] = (S.fclog[today()]||0) + 1; FC.cur = null; FC.flip = false; save(); render(); };
A['fc-add'] = () => { const f = $('#nc-f').value.trim(), v = $('#nc-v').value.trim(); if(!f || !v) return toast('Preencha frente e verso.'); S.meusCards.push({id:'m'+uid(), s:$('#nc-s').value, f, v}); save(); toast('Cartão criado.'); render(); };
A['fc-del'] = el => { S.meusCards = S.meusCards.filter(c => c.id !== el.dataset.id); delete S.cards[el.dataset.id]; save(); render(); };
A['salvar-prova'] = () => { S.dataProva = $('#cfg-prova').value; save(); toast(S.dataProva ? 'Data da prova salva.' : 'Data removida.'); render(); };
A['nw-add'] = () => { const t = $('#nw-t').value.trim(); if(!t) return; S.news.push({id:uid(), d:today(), t, u:$('#nw-u').value.trim()}); save(); render(); };
A['nw-del'] = el => { S.news = S.news.filter(n => n.id !== el.dataset.id); save(); render(); };
A['lv-tab'] = el => { LV.tab = el.dataset.t; LV.cat = 'Todos'; render(); };
A['lv-cat'] = el => { LV.cat = el.dataset.c; render(); };
A['lv-st'] = el => { const st = LV.tab === 'livros' ? S.livros : S.cursos, id = el.dataset.id, k = el.dataset.k; if(st[id] === k) delete st[id]; else st[id] = k; save(); render(); };
A['fac-limpar'] = () => { S.fac.disc = []; S.fac.exemplo = false; save(); render(); };
A['fac-add'] = () => { S.fac.disc.push({id:uid(), nome:'Nova disciplina', meta:7, notas:'', faltas:0, prova:''}); S.fac.exemplo = false; save(); render(); };
A['fac-del'] = el => { S.fac.disc = S.fac.disc.filter(d => d.id !== el.dataset.id); save(); render(); };
A['meta-add'] = () => { const t = $('#meta-t').value.trim(); if(!t) return; S.fac.metas.push({id:uid(), t, done:false}); save(); render(); };
A['meta-tg'] = el => { const m = S.fac.metas.find(x => x.id === el.dataset.id); if(m){ m.done = el.checked; save(); render(); } };
A['meta-del'] = el => { S.fac.metas = S.fac.metas.filter(x => x.id !== el.dataset.id); save(); render(); };
A['ing-tg'] = el => { const t = today(); S.ing.dias[t] = S.ing.dias[t] || {}; S.ing.dias[t][el.dataset.k] = el.checked; save(); render(); };
A['vc-add'] = () => { const w = $('#vc-w').value.trim(), m = $('#vc-m').value.trim(); if(!w || !m) return; S.ing.vocab.push({w, m}); save(); render(); setTimeout(() => { const e = $('#vc-w'); if(e) e.focus(); }, 0); };
A['vc-del'] = el => { S.ing.vocab.splice(+el.dataset.i, 1); save(); render(); };
A['vc-cards'] = () => { let n = 0; S.ing.vocab.forEach(v => { if(!S.meusCards.find(c => c.s === 'en' && c.f === v.w)){ S.meusCards.push({id:'m'+uid(), s:'en', f:v.w, v:v.m}); n++; } }); save(); toast(n ? n+' flashcards criados.' : 'Todas as palavras já viraram flashcards.'); };
A['bk-copy'] = () => { const ta = $('#bk-out'); const ok = () => toast('Backup copiado.'), fb = () => { ta.select(); toast('Texto selecionado: use Copiar.'); }; try { navigator.clipboard.writeText(ta.value).then(ok, fb); } catch(e){ fb(); } };
A['bk-imp'] = () => { try { const o = JSON.parse($('#bk-in').value); if(!o || typeof o !== 'object' || !o.resp) throw 0; S = migrate(o); save(); toast('Backup restaurado.'); render(); } catch(e){ toast('Texto de backup inválido.'); } };
A['bk-reset'] = () => { BK.confirm = true; render(); };
A['bk-reset-no'] = () => { BK.confirm = false; render(); };
A['bk-reset-ok'] = () => { S = defaults(); BK.confirm = false; save(); toast('Dados apagados.'); render(); };

document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if(!el) return; const f = A[el.dataset.act]; if(!f) return; if(el.tagName === 'BUTTON') e.preventDefault(); f(el, e); });
document.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.id === 'pb-in'){ e.preventDefault(); const b = document.querySelector('[data-act="psend"]'); if(b) b.click(); } if(e.key === 'Escape' && $('#layer').innerHTML) fecharSheet(); });
document.addEventListener('change', e => { const t = e.target;
  if(t.matches('input[type=checkbox][data-act]')) return;
  if(t.id === 'red-tema'){ S.rascunho.tema = t.value === '__livre' ? '' : t.value; save(); render(); }
  else if(t.id === 'lv-mes'){ S.leitura.livro = t.value || null; if(t.value && !S.livros[t.value]) S.livros[t.value] = 'lendo'; save(); render(); }
  else if(t.id === 'ing-nivel'){ S.ing.nivel = t.value; save(); }
  else if(t.id === 'fac-curso'){ S.fac.curso = t.value; save(); }
  else if(t.id === 'fac-sem'){ S.fac.sem = t.value; save(); }
  else if(t.id === 'cfg-som'){ S.som = t.checked; save(); }
  else if(t.dataset.slot){ if(/^\d\d:\d\d$/.test(t.value)){ S.slots[t.dataset.slot][t.dataset.k] = t.value; save(); toast('Horário salvo.'); } }
  else if(t.dataset.fac){ const d = S.fac.disc.find(x => x.id === t.dataset.fac); if(d){ const k = t.dataset.k; d[k] = (k==='meta'||k==='faltas') ? (parseFloat(t.value)||0) : t.value; S.fac.exemplo = false; save(); render(); } }
});
document.addEventListener('input', e => { const t = e.target;
  if(t.id === 'red-txt'){ S.rascunho.texto = t.value; const w = wc(t.value), el = $('#red-wc'); if(el) el.textContent = w+' palavras · ~'+Math.ceil(w/10)+' linhas'; clearTimeout(A._rt); A._rt = setTimeout(() => { save(); const b = document.querySelector('[data-act="red-salvar"]'); if(b) b.disabled = w < 30; const a = document.querySelector('[data-act="red-ai"]'); if(a) a.disabled = w < 80 || redAI.busy; }, 600); }
  else if(t.id === 'red-livre'){ S.rascunho.tema = t.value; clearTimeout(A._rl); A._rl = setTimeout(save, 600); }
});
redTick = setInterval(() => { const el = $('#red-t'); if(!el || !S.rascunho.ini) return; const s = Math.floor((Date.now()-S.rascunho.ini)/1000); el.textContent = pad(Math.floor(s/60))+':'+pad(s%60); }, 1000);
setInterval(() => { if(R.v === 'hoje' && !$('#layer').innerHTML && !document.activeElement.matches('input,textarea')) render(); }, 60000);

if(!localStorage.getItem || !(()=>{ try { return localStorage.getItem(KEY); } catch(e){ return null; } })()) save();
render();
initCloud();
})();

</script>
</body></html>
