<style>
/* Layout: mesmo desenho do Rota do Milhão — marinho da noite e ouro. Abas no topo no computador e embaixo no celular. */
:root{
  --bg:#06121F; --surface:#0C1D31; --sunken:#040C16; --line:#1F3550;
  --fg:#F2EEE6; --muted:#9AA7B8;
  --accent:#D4AF5F; --accent-fg:#06121F; --accent-soft:#2A2414; --gold:#D4AF5F;
  --signal:#F0A04B; --signal-soft:#38250F;
  --danger:#FF7A6B; --danger-soft:#3A1A17;
  --ok:#5CCB86; --ok-soft:#113022;
  --f-display:"Cinzel","Trajan Pro",Georgia,serif;
  --f-ui:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F5F1E8; --surface:#FFFFFF; --sunken:#EBE4D4; --line:#D8CCB2; --fg:#0A1A2E; --muted:#5A6576;
  --accent:#0B2240; --accent-fg:#E5C069; --accent-soft:#F3E8CF; --gold:#8A6420;
  --signal:#A65A10; --signal-soft:#FBEAD6; --danger:#B42318; --danger-soft:#FBE1DE; --ok:#1F7A47; --ok-soft:#DDF0E3; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F5F1E8; --surface:#FFFFFF; --sunken:#EBE4D4; --line:#D8CCB2; --fg:#0A1A2E; --muted:#5A6576;
  --accent:#0B2240; --accent-fg:#E5C069; --accent-soft:#F3E8CF; --gold:#8A6420;
  --signal:#A65A10; --signal-soft:#FBEAD6; --danger:#B42318; --danger-soft:#FBE1DE; --ok:#1F7A47; --ok-soft:#DDF0E3; color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.6rem;font-weight:700;letter-spacing:.01em} h2{font-size:1.4rem;font-weight:700;letter-spacing:.01em}
h3{font-family:var(--f-ui);font-size:1.06rem;font-weight:700}
p{margin:0} a{color:var(--gold)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:.86rem}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:2px solid var(--gold)}
header.top .in{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.1rem;letter-spacing:.04em;display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:.72rem;letter-spacing:.02em;color:var(--gold)}
.status{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bfc{text-align:right;line-height:1.1}
.bfc .num{font-size:1.3rem;color:var(--gold);display:block}
.bfc small{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
nav.tabs{display:flex;gap:4px;max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 8px;overflow-x:auto}
nav.tabs a{color:var(--muted);font:600 .9rem var(--f-body);padding:8px 12px;border-radius:8px;white-space:nowrap;text-decoration:none;display:flex;align-items:center;gap:6px}
nav.tabs a.on{background:var(--accent-soft);color:var(--gold)}
nav.tabs svg{width:18px;height:18px}
@media (min-width:721px){nav.tabs svg{display:none}}
@media (max-width:720px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);margin:0;max-width:none;gap:0;justify-content:space-between;padding-block:6px calc(6px + env(safe-area-inset-bottom,0px))}
  nav.tabs a{flex:1;min-width:0;padding:8px 1px;font-size:.72rem;flex-direction:column;gap:2px}
}
main{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(100px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{background:transparent;border-style:dashed}
.card.gold{border:1.5px solid var(--gold);background:linear-gradient(160deg,var(--accent-soft),var(--surface) 70%)}
.hero{border:1.5px solid var(--gold);background:linear-gradient(160deg,var(--accent-soft),var(--surface) 70%)}
.hero .big{font-family:var(--f-mono);font-size:2.6rem;color:var(--gold);line-height:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid2>*{min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.stat b{display:block;font-family:var(--f-mono);font-size:1.35rem;font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 .88rem var(--f-body);padding:9px 14px;border-radius:8px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--accent);border-color:var(--gold);color:var(--accent-fg)}
.btn.gold{background:var(--signal);border-color:var(--signal);color:#1b1206}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.76rem;font-weight:600;background:var(--sunken);color:var(--fg);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--danger-soft);color:var(--danger)} .pill.gold{background:var(--signal-soft);color:var(--signal)} .pill.acc{background:var(--accent-soft);color:var(--gold)}
button.pill{border:0;font:inherit;font-size:.78rem;font-weight:600}
.tag{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--sunken);color:var(--muted)}
.tag.late{background:var(--danger-soft);color:var(--danger)} .tag.now{background:var(--signal-soft);color:var(--signal)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:600 .82rem var(--f-body);white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--gold);color:var(--accent-fg)}
.bar,.meter{height:10px;border-radius:99px;background:var(--sunken);overflow:hidden;position:relative}
.bar>i,.meter>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--signal));border-radius:99px}
.meter>b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--signal)}
.list{display:flex;flex-direction:column}
.list>*{padding:12px 0;border-top:1px solid var(--line)}
.list>*:first-child{border-top:0;padding-top:0}
.subj{display:flex;gap:12px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
/* turno e missões */
.shift{border-radius:var(--r);background:var(--surface);border:1px solid var(--line);overflow:hidden}
.shift-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--sunken)}
.shift-head .clock{font-family:var(--f-mono);font-size:1.5rem;color:var(--gold)}
.shift-body{padding:6px 16px 14px}
.mission{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.mission:last-child{border-bottom:0}
.mission .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);margin-top:2px;display:grid;place-items:center}
.mission.done .box{background:var(--ok);border-color:var(--ok)}
.mission.late .box{border-color:var(--danger)}
.mission .t{font-weight:600}
.mission.done .t{color:var(--muted);text-decoration:line-through}
.mission .d{grid-column:2;color:var(--muted);font-size:.9rem}
.mission .act{grid-column:2;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.mission .proof{grid-column:2;font-size:.85rem;background:var(--ok-soft);border-radius:6px;padding:6px 8px;overflow-wrap:anywhere}
.debt{border:2px solid var(--danger);background:var(--danger-soft);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.debt h3{color:var(--danger)}
/* trilha */
.phase{display:flex;flex-direction:column;gap:8px}
.mods{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.mod{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;color:inherit;text-decoration:none}
.mod:last-child{border-bottom:0}
.mod .wk{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.mod.locked{opacity:.55} .mod.current{background:var(--accent-soft)}
.aula{display:flex;flex-direction:column;gap:10px;line-height:1.65;max-width:72ch}
.aula h4{font-family:var(--f-ui);font-size:1.05rem;margin:10px 0 0;color:var(--gold)}
.aula ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.aula b{color:var(--fg)}
.block{border-left:3px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:6px}
.block.task{border-color:var(--signal)} .block.proofb{border-color:var(--ok)}
/* questões */
.q-text{white-space:pre-wrap;font-size:1rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:11px 12px;width:100%}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);font-weight:700;font-size:.85rem}
.opt.sel{border-color:var(--gold)} .opt.sel .l{background:var(--gold);color:var(--accent-fg)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .l{background:var(--ok);color:#06121F}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft)} .opt.wrong .l{background:var(--danger);color:#06121F}
.explain{background:var(--sunken);border-radius:10px;padding:12px;font-size:.92rem}
.timer{font-family:var(--f-mono);font-size:2.6rem;color:var(--gold);font-variant-numeric:tabular-nums;text-align:center;line-height:1}
label.f,.f{display:flex;flex-direction:column;gap:4px;font-size:.84rem;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:9px 11px;font-weight:400}
textarea{min-height:100px;resize:vertical;line-height:1.55}
textarea.essay{min-height:340px;font-size:1rem}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--gold);flex:none}
details{border-top:1px solid var(--line);padding-top:10px}
details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:10px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";margin-left:auto;font-weight:700;color:var(--muted)}
details[open] summary::after{content:"–"}
.flash{min-height:200px;display:grid;place-items:center;text-align:center;font-size:1.15rem;font-weight:600;padding:24px;border-radius:var(--r);background:var(--sunken);border:1px dashed var(--line);width:100%;color:var(--fg)}
.flash.back{background:var(--accent-soft);border:1.5px solid var(--gold);font-weight:500}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.menu a{text-align:left;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;text-decoration:none}
.menu a:hover{border-color:var(--gold)}
.menu b{font-family:var(--f-ui);font-size:1rem}
.menu .ag{font-size:.78rem;color:var(--gold);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:var(--fg);min-width:0}
.tile b{font-family:var(--f-ui)} .tile span{font-size:.8rem;color:var(--muted)}
.table{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.streak{display:flex;gap:4px;flex-wrap:wrap}
.streak i{width:14px;height:14px;border-radius:4px;background:var(--sunken)}
.streak i.on{background:var(--gold)}
.ai-out{white-space:pre-wrap;font-size:.92rem;background:var(--sunken);border-radius:10px;padding:12px;overflow-wrap:anywhere}
/* professores */
.profs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.prof{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-decoration:none;color:var(--fg)}
.prof:hover{border-color:var(--hc)}
.holo{position:relative;flex:none;width:64px;height:76px;border-radius:12px;background:radial-gradient(70% 50% at 50% 100%,color-mix(in srgb,var(--hc) 35%,transparent),transparent 75%),#04121f;overflow:hidden;display:grid;place-items:end center}
.holo svg{width:46px;height:64px;filter:drop-shadow(0 0 5px var(--hc));-webkit-mask-image:repeating-linear-gradient(0deg,#000 0 2px,rgba(0,0,0,.6) 2px 3px);mask-image:repeating-linear-gradient(0deg,#000 0 2px,rgba(0,0,0,.6) 2px 3px)}
.holo::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:70%;height:6px;border-radius:50%;background:var(--hc);opacity:.55;box-shadow:0 0 10px var(--hc)}
.holo.big{width:96px;height:120px} .holo.big svg{width:70px;height:98px}
@media (prefers-reduced-motion:no-preference){.holo svg{animation:flut 4s ease-in-out infinite}@keyframes flut{50%{transform:translateY(-3px)}}.pulse{animation:p 1.4s ease-in-out infinite}@keyframes p{50%{opacity:.55}}}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;font-size:.93rem;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.eu{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:4px}
.msg.pr{align-self:flex-start;background:var(--sunken);border:1px solid var(--line);border-bottom-left-radius:4px}
/* camadas */
.sheet{position:fixed;inset:0;z-index:19;background:color-mix(in srgb,var(--bg) 60%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 0 0;width:100%;max-width:640px;max-height:88%;overflow:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.alarm{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px}
.alarm .card{max-width:440px;width:100%;border:2px solid var(--signal)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:21;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:.9rem;max-width:calc(100% - 32px)}
</style>

<script>
/* ===== Dados do app: edital 2024 (referência), questões, flashcards, livros e cursos ===== */

  {id:'pt', nome:'Língua Portuguesa', curto:'Português', q:5, bloco:'Básicos', cor:'#2f7d6d',
   topicos:['Compreensão e interpretação de textos','Argumentação e persuasão; comunicação assertiva','Organização textual, coesão e coerência','Tipologia textual','Ortografia oficial e novo Acordo Ortográfico','Acentuação gráfica','Crase','Sintaxe da oração e do período','Pontuação','Concordância nominal e verbal','Regência nominal e verbal','Significação das palavras','Colocação do pronome átono','Redação oficial (Manual de Redação da Presidência)'],

 {s:'et',q:'De acordo com a Lei 9.613/1998, as etapas típicas da lavagem de dinheiro são',o:['captação, aplicação e resgate','colocação, ocultação e integração','emissão, distribuição e liquidação','depósito, saque e transferência','fraude, desvio e corrupção'],a:1,e:'Colocação (inserir o dinheiro no sistema), ocultação ou estratificação (dificultar o rastreio) e integração (dar aparência lícita).'},
 {s:'et',q:'Ao identificar operação com indícios de lavagem de dinheiro, a instituição deve comunicá-la ao COAF',o:['após avisar o cliente para que ele se explique','somente se o cliente autorizar','abstendo-se de dar ciência ao cliente','apenas se o valor passar de R$ 1 milhão','depois de encerrar a conta do cliente'],a:2,e:'A lei determina a comunicação sem dar ciência ao cliente ou a terceiros, para não prejudicar a investigação.'},
 {s:'et',q:'Segundo a LGPD (Lei 13.709/2018), é exemplo de dado pessoal sensível',o:['nome completo','endereço residencial','número da conta bancária','convicção religiosa','e-mail profissional'],a:3,e:'Dados sensíveis: origem racial ou étnica, convicção religiosa, opinião política, filiação sindical, saúde, vida sexual, dado genético ou biométrico.'},
 {s:'et',q:'A Lei Anticorrupção (Lei 12.846/2013) estabelece que a pessoa jurídica responde pelos atos lesivos à administração pública de forma',o:['subjetiva, dependendo de prova de culpa dos sócios','objetiva, nas esferas administrativa e civil','apenas penal','apenas se houver condenação de um dirigente','solidária somente com o Estado'],a:1,e:'A responsabilidade da empresa é objetiva (independe de culpa) nas esferas administrativa e civil. A lei prevê multa de 0,1% a 20% do faturamento bruto e acordo de leniência.'},
 {s:'et',q:'Os princípios da administração pública previstos no caput do art. 37 da Constituição Federal são',o:['legalidade, impessoalidade, moralidade, publicidade e eficiência','legalidade, isonomia, sigilo, publicidade e economia','moralidade, eficácia, lucro, transparência e celeridade','impessoalidade, hierarquia, disciplina, sigilo e economia','legitimidade, eficiência, razoabilidade, sigilo e moralidade'],a:0,e:'O famoso LIMPE: Legalidade, Impessoalidade, Moralidade, Publicidade e Eficiência.'},
 {s:'et',q:'Pela Lei Complementar 105/2001, NÃO constitui violação do dever de sigilo bancário',o:['informar o saldo de um cliente a um vizinho que pediu','divulgar movimentações de clientes em rede social','comunicar às autoridades competentes a prática de ilícitos penais ou administrativos','repassar dados de clientes a uma loja parceira sem consentimento','comentar com amigos o limite de crédito de um cliente famoso'],a:2,e:'O art. 1º, § 3º, da LC 105 lista exceções ao sigilo, entre elas a comunicação de ilícitos às autoridades e as operações com consentimento expresso dos interessados.'},
 {s:'et',q:'A Resolução CMN 4.893/2021 trata, principalmente, de',o:['tarifas bancárias','política de segurança cibernética e contratação de serviços de processamento, armazenamento de dados e computação em nuvem','regras do crédito rural','funcionamento das ouvidorias','abertura de contas para menores'],a:1,e:'A Res. 4.893/2021 exige das instituições uma política de segurança cibernética e regras para contratar serviços de dados e nuvem.'},
 // Conhecimentos Bancários
 {s:'cb',q:'Integram o Conselho Monetário Nacional (CMN)',o:['o Presidente da República, o Presidente do BC e o Presidente da CVM','o Ministro da Fazenda, o Ministro do Planejamento e Orçamento e o Presidente do Banco Central','os presidentes do Banco do Brasil, da CAIXA e do BNDES','o Presidente do BC, os diretores do BC e o Ministro da Fazenda','o Ministro da Fazenda, o Presidente da CVM e o Superintendente da Susep'],a:1,e:'O CMN, órgão normativo máximo do SFN, é formado pelo Ministro da Fazenda (presidente), pelo Ministro do Planejamento e Orçamento e pelo Presidente do Banco Central.'},
 {s:'cb',q:'O órgão responsável por supervisionar o mercado de seguros, a capitalização e a previdência aberta é',o:['a CVM','a Previc','a Susep','o Banco Central','o Copom'],a:2,e:'A Susep supervisiona seguros, capitalização, resseguros e previdência aberta. A Previc cuida da previdência fechada (fundos de pensão) e a CVM, do mercado de valores mobiliários.'},
 {s:'cb',q:'O Fundo Garantidor de Créditos (FGC) garante depósitos e alguns investimentos até o limite de',o:['R$ 100 mil por CPF, por instituição','R$ 250 mil por CPF ou CNPJ, por instituição ou conglomerado','R$ 500 mil por conta','R$ 1 milhão por instituição','valor ilimitado para poupança'],a:1,e:'O FGC cobre até R$ 250 mil por CPF/CNPJ em cada instituição ou conglomerado, com teto global de R$ 1 milhão a cada 4 anos. Cobre poupança, CDB, LCI, LCA, entre outros.'},
 {s:'cb',q:'Quando a meta da taxa Selic está acima de 8,5% ao ano, a remuneração da caderneta de poupança é de',o:['70% da Selic + TR','0,5% ao mês + TR','100% do CDI','IPCA + 6% ao ano','TR + 3% ao ano'],a:1,e:'Regra vigente desde 2012: Selic acima de 8,5% a.a. → 0,5% ao mês + TR. Selic igual ou abaixo de 8,5% → 70% da Selic + TR.'},
 {s:'cb',q:'Entre as aplicações abaixo, é isenta de Imposto de Renda para pessoa física',o:['CDB','fundo DI','Letra de Crédito Imobiliário (LCI)','Tesouro Selic','debênture comum'],a:2,e:'LCI e LCA são isentas de IR para pessoa física (assim como a poupança). CDB, fundos e Tesouro seguem a tabela regressiva.'},
 {s:'cb',q:'O Comitê de Política Monetária (Copom) tem como principal atribuição',o:['emitir moeda','fixar a meta da taxa Selic','fiscalizar as cooperativas de crédito','definir a meta de inflação','autorizar o funcionamento de bancos'],a:1,e:'O Copom, do Banco Central, define a meta da Selic em 8 reuniões por ano. A meta de inflação é fixada pelo CMN.'},
 {s:'cb',q:'Para um cliente que faz a declaração completa do IR e quer deduzir as contribuições, o plano de previdência mais indicado é',o:['VGBL, pois deduz até 12% da renda bruta','PGBL, pois permite deduzir até 12% da renda bruta tributável','título de capitalização','consórcio','VGBL, pois o IR incide sobre o total resgatado'],a:1,e:'PGBL: deduz contribuições até 12% da renda bruta tributável, mas o IR incide sobre o valor total no resgate. VGBL: não deduz, e o IR incide só sobre o rendimento.'},
 {s:'cb',q:'Sobre o Pix, é correto afirmar que',o:['foi criado pela Febraban e funciona só em dias úteis','é o arranjo de pagamentos instantâneos instituído pelo Banco Central, disponível 24 horas por dia, todos os dias','só pode ser usado por pessoas físicas','exige cartão de crédito','tem tarifa obrigatória para pessoas físicas em transferências'],a:1,e:'O Pix foi instituído pelo BC e lançado em novembro de 2020. Funciona 24/7 e é gratuito para pessoas físicas em transferências e compras, salvo exceções previstas.'},
 {s:'cb',q:'No Open Finance, o compartilhamento de dados do cliente entre instituições depende',o:['de ordem judicial','do consentimento do cliente','apenas de autorização do Banco Central','de pagamento de tarifa','de o cliente ter conta há mais de um ano'],a:1,e:'O cliente é dono dos seus dados: o compartilhamento só ocorre com consentimento, por prazo e finalidade definidos, e pode ser revogado.'},
 {s:'cb',q:'NÃO é instrumento clássico de política monetária',o:['operações de mercado aberto','depósito compulsório','redesconto','alteração da alíquota do Imposto de Renda','operações compromissadas'],a:3,e:'Alterar impostos é política fiscal. Política monetária usa open market (inclui compromissadas), compulsório e redesconto.'},
 {s:'cb',q:'No consórcio, é correto afirmar que',o:['há cobrança de juros compostos sobre o crédito','o consorciado paga taxa de administração e a contemplação ocorre por sorteio ou lance','a contemplação é garantida no primeiro mês','é supervisionado pela Susep','o crédito só pode ser usado para imóveis'],a:1,e:'Consórcio (Lei 11.795/2008) não tem juros, mas tem taxa de administração. A contemplação é por sorteio ou lance, e a supervisão é do Banco Central.'},
 {s:'cb',q:'Na alienação fiduciária,',o:['o bem permanece com o credor até a quitação, sem uso pelo devedor','a propriedade resolúvel do bem fica com o credor até a quitação, enquanto o devedor tem a posse direta','um terceiro garante a dívida com seu patrimônio pessoal','o bem é sempre um imóvel rural','não há possibilidade de retomada do bem'],a:1,e:'O devedor usa o bem (posse direta), mas a propriedade fica com o credor (fiduciário) até a quitação. É muito usada em veículos e imóveis.'},
 {s:'cb',q:'Pela Lei 8.036/1990, NÃO é hipótese de saque do FGTS',o:['demissão sem justa causa','aposentadoria','pedido de demissão pelo trabalhador','aquisição de moradia própria, cumpridos os requisitos','doença grave prevista em lei, como neoplasia maligna'],a:2,e:'Quem pede demissão não pode sacar o FGTS nessa hipótese. As outras alternativas são hipóteses de saque previstas no art. 20.'},
 {s:'cb',q:'Uma elevação da taxa Selic tende a',o:['aumentar o consumo e a inflação','reduzir o custo do crédito','encarecer o crédito, desestimular o consumo e ajudar a conter a inflação','desvalorizar a moeda nacional automaticamente','reduzir a rentabilidade da renda fixa'],a:2,e:'Juros mais altos encarecem o crédito e estimulam a poupança, reduzindo a demanda e a pressão sobre os preços.'},
 {s:'cb',q:'O Drex, desenvolvido pelo Banco Central, é',o:['um novo cartão de crédito público','uma plataforma para a versão digital do real e de ativos tokenizados','uma criptomoeda privada como o Bitcoin','um substituto do Pix para pessoas físicas','um fundo de investimento do Tesouro'],a:1,e:'O Drex é a plataforma do BC para o real digital e para liquidação de ativos tokenizados, em ambiente regulado.'},
 {s:'cb',q:'Correspondentes bancários são',o:['agências próprias de bancos estrangeiros','empresas contratadas por instituições financeiras para prestar alguns serviços em nome delas, como lotéricas','órgãos normativos do SFN','bancos digitais sem autorização do BC','cooperativas de crédito'],a:1,e:'Correspondentes (como lotéricas e o Caixa Aqui) atuam em nome da instituição contratante, que responde pelos serviços prestados.'},
 // Atendimento Bancário
 {s:'ab',q:'Segundo a Súmula 297 do STJ, o Código de Defesa do Consumidor',o:['não se aplica a bancos','aplica-se às instituições financeiras','aplica-se só a cartões de crédito','aplica-se só a pessoas jurídicas','foi substituído pelas resoluções do CMN'],a:1,e:'A Súmula 297 afirma: "O Código de Defesa do Consumidor é aplicável às instituições financeiras".'},
 {s:'ab',q:'O consumidor que contrata um produto pelo aplicativo, fora do estabelecimento, pode desistir no prazo de',o:['3 dias','7 dias','15 dias','30 dias','90 dias'],a:1,e:'Art. 49 do CDC: direito de arrependimento em 7 dias a contar da assinatura ou do recebimento, quando a contratação ocorre fora do estabelecimento.'},
 {s:'ab',q:'O consumidor cobrado indevidamente que pagou o valor tem direito, segundo o CDC, a',o:['receber o valor pago, sem correção','receber o dobro do que pagou em excesso, com correção e juros, salvo engano justificável','receber apenas um pedido de desculpas','um crédito na conta igual à metade do valor','multa de 10% paga pelo banco ao Procon'],a:1,e:'Art. 42, parágrafo único, do CDC: repetição do indébito em dobro, com correção monetária e juros legais, salvo hipótese de engano justificável.'},
 {s:'ab',q:'Na fila de atendimento, uma cliente de 85 anos e um cliente de 65 anos aguardam. Conforme o Estatuto da Pessoa Idosa, alterado pela Lei 13.466/2017,',o:['os dois têm a mesma prioridade, por ordem de chegada','a cliente de 85 anos tem prioridade especial sobre o cliente de 65 anos','o cliente de 65 anos tem prioridade por ter chegado antes','nenhum tem prioridade, pois a regra vale só em órgãos públicos','a prioridade só vale com atestado médico'],a:1,e:'Pessoas com 60 anos ou mais têm prioridade. Entre elas, as maiores de 80 anos têm prioridade especial, atendidas antes dos demais idosos.'},
 {s:'ab',q:'De acordo com a Resolução CMN 4.860/2020, a ouvidoria',o:['é o primeiro canal de atendimento do cliente','atua como última instância administrativa e deve responder em até 10 dias úteis','pode cobrar tarifa pelo atendimento','só atende reclamações por carta','responde em até 30 dias corridos'],a:1,e:'A ouvidoria atua em última instância, depois dos canais primários, e responde em até 10 dias úteis (prorrogáveis excepcionalmente, com justificativa).'},
 {s:'ab',q:'Condicionar a concessão de um empréstimo à contratação de um seguro é',o:['prática permitida se o seguro for barato','venda casada, prática abusiva vedada pelo CDC','estratégia recomendada de vendas','obrigatório por norma do CMN','permitido apenas para clientes novos'],a:1,e:'Art. 39, I, do CDC proíbe condicionar o fornecimento de um produto ou serviço à compra de outro (venda casada).'},
 {s:'ab',q:'Pela Lei 12.764/2012, a pessoa com transtorno do espectro autista',o:['não tem direito a atendimento prioritário','é considerada pessoa com deficiência para todos os efeitos legais','só tem prioridade se tiver mais de 60 anos','precisa de laudo renovado todo mês','só pode ser atendida por canais digitais'],a:1,e:'A lei que institui a Política Nacional dos Direitos da Pessoa com TEA a considera pessoa com deficiência, com os direitos correspondentes, inclusive atendimento prioritário.'},
 {s:'ab',q:'Na abordagem consultiva de vendas, o primeiro passo do atendente deve ser',o:['apresentar o produto com maior comissão','identificar as necessidades e o perfil do cliente por meio de perguntas e escuta ativa','oferecer desconto imediato','falar sobre todos os produtos do banco','encerrar o atendimento rapidamente'],a:1,e:'Venda consultiva parte do diagnóstico: entender necessidade, perfil e objetivo para oferecer o produto adequado (também exigido pela Res. 4.949/2021).'},
 {s:'ab',q:'"Restam só 3 vagas com essa condição" é exemplo do gatilho mental de',o:['prova social','autoridade','escassez','reciprocidade','compromisso'],a:2,e:'Escassez explora a limitação de quantidade ou tempo. Prova social usa o comportamento de outras pessoas; autoridade, a credibilidade de especialistas.'},
 {s:'ab',q:'O inbound marketing se caracteriza por',o:['ligações em massa para listas compradas','atrair clientes com conteúdo relevante, convertendo visitantes em leads e nutrindo o relacionamento','anúncios em outdoor sem segmentação','envio de spam por e-mail','descontos agressivos sem planejamento'],a:1,e:'Inbound atrai o cliente pelo conteúdo útil (blog, redes, materiais) em vez de interromper com abordagens invasivas (outbound).'},
 {s:'ab',q:'A Resolução CMN 4.949/2021 determina que, no relacionamento com clientes, as instituições devem',o:['priorizar a venda de produtos com maior margem','oferecer produtos adequados às necessidades, interesses e objetivos dos clientes, com transparência','dispensar informações sobre tarifas','atender apenas por canais digitais','impedir o cancelamento de serviços pelo aplicativo'],a:1,e:'A norma trata de princípios de ética, responsabilidade, transparência e diligência, com oferta adequada ao perfil do cliente e informações claras.'},
 // TI
 {s:'ti',q:'Um cliente recebe um e-mail que imita o banco e pede que ele clique em um link para "atualizar seus dados". Trata-se de',o:['firewall','phishing','backup','criptografia','spam legítimo'],a:1,e:'Phishing é a fraude que imita uma instituição confiável para obter dados pessoais, senhas ou códigos.'},
 {s:'ti',q:'O malware que criptografa os arquivos da vítima e exige pagamento para liberá-los é o',o:['spyware','adware','ransomware','worm','keylogger'],a:2,e:'Ransomware "sequestra" os dados com criptografia e pede resgate. Spyware espiona, keylogger captura o que é digitado, worm se replica pela rede.'},
 {s:'ti',q:'Os três pilares clássicos da segurança da informação são',o:['confidencialidade, integridade e disponibilidade','criptografia, backup e antivírus','autenticidade, velocidade e custo','legalidade, sigilo e publicidade','hardware, software e rede'],a:0,e:'A tríade CID: confidencialidade (só quem pode acessa), integridade (dado não alterado indevidamente) e disponibilidade (acessível quando necessário).'},
 {s:'ti',q:'A estratégia de backup 3-2-1 recomenda',o:['3 cópias, em 2 tipos de mídia, com 1 cópia fora do local','3 senhas, 2 usuários e 1 servidor','backup a cada 3 dias, 2 vezes ao mês','3 antivírus em 2 computadores','apagar cópias antigas a cada 3 meses'],a:0,e:'Mantenha 3 cópias dos dados, em 2 mídias diferentes, sendo 1 fora do local (por exemplo, na nuvem).'},
 {s:'ti',q:'No modelo de computação em nuvem em que o usuário usa um software pronto pela internet, como um e-mail web, o serviço é do tipo',o:['IaaS','PaaS','SaaS','LAN','VPN'],a:2,e:'SaaS (Software como Serviço): aplicação pronta. PaaS oferece plataforma para desenvolver; IaaS oferece infraestrutura (servidores, armazenamento).'},
 {s:'ti',q:'No Excel, a fórmula que exibe "Aprovado" se o valor de A1 for maior ou igual a 7, e "Reprovado" caso contrário, é',o:['=SE(A1>=7;"Aprovado";"Reprovado")','=SOMA(A1>=7;"Aprovado")','=PROCV(A1;7;"Aprovado")','=SE(A1>7;"Reprovado";"Aprovado")','=CONT.SE(A1;"Aprovado")'],a:0,e:'A função SE testa uma condição: =SE(teste; valor_se_verdadeiro; valor_se_falso). Note que ">=" inclui o 7.'},
 {s:'ti',q:'A autenticação em dois fatores (2FA/MFA) aumenta a segurança porque',o:['dispensa o uso de senha','exige, além da senha, outro fator, como um código no celular ou biometria','criptografa o disco rígido','bloqueia todos os anexos de e-mail','impede o uso de redes Wi-Fi'],a:1,e:'MFA combina fatores diferentes: algo que você sabe (senha), algo que você tem (celular, token) e algo que você é (biometria).'},
 {s:'ti',q:'Um dos valores do Manifesto Ágil é valorizar',o:['processos e ferramentas mais que indivíduos e interações','documentação abrangente mais que software funcionando','indivíduos e interações mais que processos e ferramentas','seguir um plano mais que responder a mudanças','negociação de contratos mais que colaboração com o cliente'],a:2,e:'Os 4 valores: indivíduos e interações; software em funcionamento; colaboração com o cliente; responder a mudanças. Os itens da direita têm valor, mas os da esquerda valem mais.'},
 // Comportamentos Digitais
 {s:'cd',q:'Um cliente recebe ligação de suposto "funcionário do banco" pedindo o código recebido por SMS para "cancelar uma compra suspeita". A orientação correta é',o:['informar o código, pois a ligação veio do número do banco','desligar e procurar o banco pelos canais oficiais, pois o banco não pede senhas nem códigos','enviar o código por WhatsApp','instalar o aplicativo indicado na ligação','transferir o saldo para uma "conta segura"'],a:1,e:'É o golpe do falso funcionário (engenharia social). O número na tela pode ser falsificado. Banco não pede senha, código nem transferência para "conta segura".'},
 {s:'cd',q:'As etapas do design thinking, em sua forma mais difundida, são',o:['planejar, executar, checar e agir','empatia, definição, ideação, prototipação e teste','sprint, review e retrospectiva','atrair, converter e fidelizar','análise, projeto e implantação'],a:1,e:'Design thinking parte da empatia com o usuário, define o problema, gera ideias, prototipa e testa. PDCA é outra ferramenta (planejar, executar, checar, agir).'},
 {s:'cd',q:'No Scrum, o papel responsável por maximizar o valor do produto e gerenciar o Product Backlog é o',o:['Scrum Master','Product Owner','gerente de projetos','cliente final','Developer sênior'],a:1,e:'O Product Owner prioriza o backlog. O Scrum Master remove impedimentos e promove o Scrum. Os Developers constroem o incremento em Sprints de até um mês.'},
 {s:'cd',q:'Na metodologia OKR, "Key Results" devem ser',o:['ideias inspiradoras sem números','resultados mensuráveis que indicam se o objetivo foi alcançado','tarefas diárias do time','metas secretas da diretoria','sempre financeiros'],a:1,e:'OKR = Objectives (objetivo qualitativo e inspirador) and Key Results (2 a 5 resultados mensuráveis).'},
 {s:'cd',q:'Segundo Carol Dweck, a pessoa com mindset de crescimento',o:['acredita que a inteligência é fixa','evita desafios para não errar','entende que habilidades se desenvolvem com esforço, estratégia e feedback','ignora críticas','só aprende sozinha'],a:2,e:'No mindset de crescimento, erros e desafios são oportunidades de aprendizado. No mindset fixo, a pessoa acredita que talento é inato e imutável.'},
 {s:'cd',q:'Os Objetivos de Desenvolvimento Sustentável (ODS) da ONU',o:['são 8 metas para o ano 2015','são 17 objetivos que integram a Agenda 2030','tratam apenas de meio ambiente','são obrigatórios apenas para bancos','foram criados pelo Banco Central'],a:1,e:'São 17 ODS da Agenda 2030, cobrindo temas sociais, ambientais e econômicos. O Pacto Global da ONU convida empresas a apoiá-los.'},
 {s:'cd',q:'Uma ferramenta de IA generativa produziu um texto com uma lei que não existe. Esse fenômeno é chamado de',o:['overfitting','alucinação','phishing','criptografia','compilação'],a:1,e:'Alucinação é quando o modelo gera informação falsa com aparência de verdade. Por isso, as respostas de IA devem ser verificadas em fontes confiáveis.'},
 {s:'cd',q:'Em uma estratégia omnichannel, o cliente',o:['é atendido apenas na agência','tem experiência integrada entre canais, podendo começar no app e concluir na agência sem repetir informações','precisa refazer o cadastro em cada canal','só usa o canal escolhido pelo banco','é atendido por canais que não se comunicam'],a:1,e:'Omnichannel integra os canais (app, internet banking, agência, telefone, WhatsApp). No multicanal, os canais existem, mas não se integram.'},
];

A Cesgranrio aplicou em 2024 uma prova de **60 questões** com 5 alternativas, cada uma valendo **1 ponto**, mais uma **redação** de 100 pontos. Tudo em **5 horas**. Para continuar no concurso você precisa de:

- pelo menos 70 na redação.

Passar no corte não basta: a classificação é pela nota. Quem aprova costuma acertar bem acima de 70% das objetivas.

## Onde estão os pontos
Conhecimentos Bancários (15) e Atendimento Bancário (10) somam **25 das 60 questões**, quase metade da prova. Por isso a trilha dá mais semanas para essas duas matérias. As outras sete matérias valem 5 questões cada.

O desempate também favorece essas matérias: depois da idade (60 anos ou mais), contam a nota em Específicos, depois Bancários e depois Atendimento.

## O método deste curso
O que mais funciona para concurso, segundo a pesquisa sobre aprendizagem, é **testar a memória** e **espaçar as revisões**:
- **Aula curta e questões no mesmo dia.** Ler sem testar dá a falsa sensação de que você sabe.
- **Revisão espaçada.** Revise no dia seguinte, depois de 3 e 7 dias e depois de 15 e 30. Os flashcards do app fazem isso sozinhos.
- **Caderno de erros.** Toda questão errada vira um flashcard com a regra que você esqueceu.
- **Intercalar matérias.** Durante a semana você foca o módulo, mas as missões diárias misturam revisão de tudo.

## A sua rotina
Você treina às 5h30, trabalha no CLT das 8h às 18h, faz faculdade e cuida da loja. Por isso o plano usa os horários livres: no almoço, flashcards (12h20) e 10 questões (12h35); à noite, 1 hora de módulo (19h); sábado à tarde, bloco longo e simulado; domingo, redação e revisão. Cada módulo é dividido em 4 noites: segunda, aula e apostila; terça, vídeo-aula; quarta, leitura oficial e tarefa; quinta, quiz e resumo. Sexta à noite fica para faculdade e inglês.

{f:0, s:'cb', t:'Sistema Financeiro Nacional', q:[45,46], nq:[
 {s:'cb',q:'A autarquia federal responsável por regular e fiscalizar o mercado de valores mobiliários, como ações e debêntures, é',o:['o Banco Central do Brasil','a Comissão de Valores Mobiliários (CVM)','a Superintendência de Seguros Privados (Susep)','o Conselho Monetário Nacional','a Febraban'],a:1,e:'A CVM regula e fiscaliza o mercado de valores mobiliários. O BC cuida das instituições financeiras e da moeda; a Susep, de seguros.'}],
 aula:`## A estrutura em três camadas
O SFN é o conjunto de órgãos e instituições que fazem o dinheiro circular entre quem poupa e quem precisa de crédito. A Cesgranrio cobra a divisão em **órgãos normativos**, **supervisores** e **operadores**.

**Normativos** (criam as regras):
- **CMN – Conselho Monetário Nacional**: órgão máximo. Formado pelo Ministro da Fazenda (presidente), pelo Ministro do Planejamento e Orçamento e pelo Presidente do Banco Central. Fixa a meta de inflação e as diretrizes da política monetária, cambial e de crédito.
- **CNSP – Conselho Nacional de Seguros Privados**: regras de seguros, capitalização e previdência aberta.
- **CNPC – Conselho Nacional de Previdência Complementar**: regras dos fundos de pensão.

**Supervisores** (fiscalizam e executam):
- **Banco Central (BCB)**: autarquia com autonomia (LC 179/2021). Emite a moeda, executa a política monetária, fiscaliza bancos e cooperativas, administra as reservas internacionais e o sistema de pagamentos (inclusive o Pix).
- **CVM**: mercado de valores mobiliários (ações, debêntures, fundos).
- **Susep**: seguros, capitalização, resseguros e previdência **aberta** (PGBL, VGBL).
- **Previc**: previdência **fechada** (fundos de pensão de empresas).

**Operadores** (atendem o público): bancos comerciais, múltiplos, de investimento e de desenvolvimento, caixas econômicas, cooperativas de crédito, corretoras e distribuidoras, bolsa (B3), seguradoras e entidades de previdência.

## A CAIXA no sistema
A CAIXA é **empresa pública federal**, com capital 100% da União, vinculada ao Ministério da Fazenda. Além de banco, executa políticas públicas: é agente operador do **FGTS**, paga o **Bolsa Família**, o **seguro-desemprego** e o **abono salarial**, opera as **Loterias** e lidera o crédito habitacional, como o Minha Casa, Minha Vida.

## Pegadinhas comuns
- Quem fixa a **meta de inflação** é o CMN; quem persegue a meta definindo a Selic é o **Copom**, do BC.
- Previdência **aberta** = Susep. **Fechada** = Previc.
- O CMN **não** fiscaliza; ele normatiza. Quem fiscaliza bancos é o BC.`,
 tarefa:'Desenhe à mão o mapa do SFN (normativos, supervisores, operadores) e tire uma foto. Faça o quiz e 15 questões de Bancários.',
 prova:'Quiz com 70% ou mais e, no resumo, quem compõe o CMN e a diferença entre Susep e Previc.', mat:MAT_LIVRO.bancos},

{f:0, s:'mf', t:'Porcentagem e juros simples', q:[16,24], nq:[
 {s:'mf',q:'Um produto de R$ 800,00 foi vendido com desconto de 15%. O preço final foi',o:['R$ 680,00','R$ 785,00','R$ 720,00','R$ 685,00','R$ 650,00'],a:0,e:'Desconto de 15% = multiplicar por 0,85. 800 × 0,85 = R$ 680,00.'}],
 aula:`## Porcentagem é multiplicação
Pense em **fator**: aumentar 20% é multiplicar por **1,20**; dar desconto de 15% é multiplicar por **0,85**. Isso resolve aumentos e descontos sucessivos sem erro:
- +20% e depois −20% → 1,20 × 0,80 = 0,96 → **queda de 4%**.
- Dois aumentos de 10% → 1,1 × 1,1 = 1,21 → **aumento de 21%**, não 20%.

Para achar o percentual de variação: (valor final ÷ valor inicial) − 1.

## Juros simples
Os juros incidem sempre sobre o **capital inicial**:
- **J = C · i · n**
- **M = C + J = C · (1 + i · n)**

Regras de ouro:
- Taxa e prazo na **mesma unidade**. 2% ao mês por 1 ano → n = 12.
- Em juros simples, taxas **proporcionais** são equivalentes: 1% a.m. = 12% a.a.
- Ano comercial = 360 dias; mês comercial = 30 dias.

**Exemplo:** R$ 5.000 a 1,5% a.m. por 8 meses → J = 5.000 × 0,015 × 8 = R$ 600 → M = R$ 5.600.

**Achando o prazo:** em quanto tempo um capital dobra a 5% a.m. simples? M = 2C → 1 + 0,05n = 2 → n = 20 meses.

## Como a Cesgranrio cobra
Questões curtas com contas "redondas". Se a conta ficar feia, revise a unidade da taxa. Treine fazer as contas à mão: não há calculadora.`,
 tarefa:'Faça o quiz e resolva à mão 10 exercícios de porcentagem e juros simples (Khan Academy ou questões do app). Crie 3 flashcards com as fórmulas.',
 prova:'Quiz com 70% ou mais e, no resumo, a conta de "+20% e depois −20%" explicada com fatores.', mat:MAT_LIVRO.mat},

{f:0, s:'pt', t:'Interpretação de textos e coesão', q:[5,7,8], nq:[],
 aula:`## O que a Cesgranrio pede
A banca usa textos jornalísticos ou de opinião, muitas vezes sobre economia, tecnologia e comportamento. As perguntas mais comuns:
- **ideia central** do texto ou de um parágrafo;
- **inferência**: o que o texto permite concluir;
- **reescrita**: a nova frase mantém o sentido e a correção?
- **valor dos conectivos** e **referência** de pronomes.

## Compreender x interpretar
- **Compreensão**: está escrito no texto.
- **Interpretação (inferência)**: não está escrito, mas é consequência lógica do que está.
- **Extrapolação** é o erro: ir além do texto com opinião ou conhecimento externo. Alternativas com "sempre", "nunca", "todos", "somente" costumam extrapolar.

## Conectivos: o mapa
- **Adição**: e, além disso, também, ademais.
- **Oposição**: mas, porém, contudo, todavia, no entanto, entretanto.
- **Concessão**: embora, ainda que, mesmo que, apesar de (a ideia contrária não impede o fato).
- **Causa**: porque, já que, visto que, uma vez que.
- **Consequência**: tão... que, de modo que.
- **Conclusão**: logo, portanto, assim, por isso.
- **Condição**: se, caso, desde que.
- **Finalidade**: para que, a fim de que.

Na reescrita, troque o conectivo por outro do **mesmo grupo** e ajuste o modo verbal: "embora" pede subjuntivo ("embora **seja**").

## Coesão por referência
Pronomes e expressões retomam termos anteriores (anáfora). Em "A CAIXA lançou o programa. **Ele** atende famílias de baixa renda", "ele" retoma "o programa". Pergunta típica: "o termo X refere-se a...". Volte no texto e teste a substituição.

## Tipologia textual
- **Dissertativo-argumentativo**: defende uma tese com argumentos (é o tipo da redação).
- **Expositivo**: informa sem defender opinião.
- **Narrativo**, **descritivo** e **injuntivo** (instruções, manuais).`,
 tarefa:'Leia 2 editoriais de jornal nesta semana e sublinhe os conectivos de cada um. Faça o quiz e 10 questões de Português.',
 prova:'Quiz com 70% ou mais e, no resumo, 3 conectivos de oposição e 3 de concessão com a diferença entre eles.', mat:MAT_LIVRO.port},

{f:1, s:'cb', t:'Política monetária, Selic e Copom', q:[50,54,58], nq:[],
 aula:`## Para que serve a política monetária
É a forma como o Banco Central controla a quantidade de dinheiro e o custo do crédito para manter a **inflação na meta**. O **CMN** define a meta (desde 2025, meta contínua de 3% ao ano, com tolerância de 1,5 ponto) e o **Copom** decide a taxa Selic para alcançá-la.

## Selic
- **Selic meta**: definida pelo Copom em **8 reuniões por ano** (a cada 45 dias, aproximadamente).
- **Selic efetiva** (ou over): a média das operações diárias com títulos públicos registradas no sistema Selic (Sistema Especial de Liquidação e de Custódia).
- É a **taxa básica** da economia: influencia o CDI, os juros dos empréstimos, a poupança e a renda fixa.

**Selic sobe** → crédito mais caro → menos consumo e investimento → inflação cai (e a renda fixa rende mais).
**Selic cai** → crédito mais barato → economia aquece.

## Instrumentos clássicos
- **Operações de mercado aberto (open market)**: compra e venda de títulos públicos pelo BC. Vender títulos tira dinheiro de circulação; comprar injeta. As **operações compromissadas** (com compromisso de recompra ou revenda) são a ferramenta do dia a dia.
- **Depósito compulsório**: parte dos depósitos que os bancos são obrigados a deixar no BC. Compulsório maior = menos dinheiro para emprestar.
- **Redesconto**: empréstimo do BC aos bancos para cobrir falta de liquidez. É o "emprestador de última instância".

Alterar impostos e gastos do governo é **política fiscal**, não monetária. Pegadinha clássica.

## Quantitative easing (QE)
Quando os juros já estão perto de zero, bancos centrais compram grandes volumes de títulos (inclusive privados) para injetar dinheiro. Foi muito usado nos EUA e na Europa depois de 2008 e na pandemia.

## Títulos públicos e dívida
O Tesouro Nacional emite títulos (Tesouro Selic, Prefixado, IPCA+) para financiar a dívida pública. O BC usa esses títulos nas compromissadas. Orçamento público: receita menos despesa; o resultado primário exclui os juros da dívida.`,
 tarefa:'Leia o comunicado da última reunião do Copom (site do BC) e anote a Selic atual e o motivo da decisão. Faça o quiz e 15 questões de Bancários.',
 prova:'Quiz com 70% ou mais e, no resumo, a Selic atual e o que acontece com o crédito e a inflação quando ela sobe.', mat:MAT_LIVRO.bancos},

{f:1, s:'mf', t:'Juros compostos e taxas', q:[17,18,19,25], nq:[],
 aula:`## Juros sobre juros
Em juros compostos, os juros de cada período entram no capital do período seguinte:
- **M = C · (1 + i)ⁿ**
- **J = M − C**

Potências que aparecem muito (decore): 1,01¹² ≈ 1,1268 · 1,02² = 1,0404 · 1,02³ ≈ 1,0612 · 1,1² = 1,21 · 1,1³ = 1,331 · 1,05² = 1,1025.

## Taxas equivalentes
Duas taxas são equivalentes quando levam ao mesmo montante no mesmo prazo:
- **(1 + iₐ) = (1 + iₘ)¹²** → 1% a.m. ≈ **12,68% a.a.** (e não 12%).
- Para o caminho inverso, use raiz: 21% a.a. em 2 anos ↔ 10% a.a.

## Nominal x efetiva
- **Nominal**: o período da taxa é diferente do período de capitalização. "24% ao ano capitalizados mensalmente".
- Para usar, transforme em **efetiva** dividindo pelo número de períodos: 24% ÷ 12 = **2% a.m. efetiva**.
- A efetiva anual fica maior: (1,02)¹² − 1 ≈ 26,82%.

## Taxa real (Fisher)
Desconta a inflação: **(1 + nominal) = (1 + real) · (1 + inflação)**.
Rendeu 15,5% com inflação de 5%: 1,155 ÷ 1,05 = 1,10 → **10% real**. Subtrair (10,5%) é o erro que a banca espera.

## Valor presente e futuro
Trazer um valor do futuro para hoje: **VP = VF ÷ (1 + i)ⁿ**. R$ 1.210 daqui a 2 anos, a 10% a.a., valem hoje R$ 1.000. Essa é a base da equivalência de capitais e dos sistemas de amortização.`,
 tarefa:'Monte uma tabela com as potências da aula e revise até saber de cabeça. Faça o quiz e 10 questões de Matemática Financeira à mão.',
 prova:'Quiz com 70% ou mais e, no resumo, a conversão de 24% a.a. capitalizados mensalmente em taxa efetiva mensal e anual.', mat:MAT_LIVRO.mat},

{f:1, s:'pt', t:'Concordância verbal e nominal', q:[0,6], nq:[
 {s:'pt',q:'Está de acordo com a norma-padrão a frase:',o:['Segue anexo as planilhas do mês.','Seguem anexas as planilhas do mês.','Segue anexas as planilhas do mês.','Seguem anexo as planilhas do mês.','Seguem anexos as planilhas do mês.'],a:1,e:'"Anexo" é adjetivo e concorda com o substantivo (planilhas: anexas). O verbo concorda com o sujeito plural "as planilhas": seguem.'}],
 aula:`## Concordância verbal: o verbo segue o sujeito
Ache o sujeito antes de tudo (pergunte "quem?" ao verbo). Casos que a Cesgranrio adora:
- **Haver = existir**: impessoal, fica no singular. "**Havia** muitas filas." "**Deve haver** soluções."
- **Fazer (tempo)**: impessoal. "**Faz** dois anos."
- **Existir, ocorrer, acontecer**: pessoais, concordam. "**Existem** riscos."
- **Partícula apassivadora (VTD + se)**: o verbo concorda. "**Vendem-se** imóveis" (imóveis são vendidos).
- **Índice de indeterminação (VTI/VI + se)**: singular. "**Precisa-se** de técnicos."
- **Sujeito posposto**: concorda igual. "**Chegaram** os novos cartões."
- **Coletivo partitivo** ("a maioria dos clientes"): singular ou plural.
- **"Um dos que"**: geralmente plural. "Foi um dos que mais **venderam**."
- **Sujeito composto antes do verbo**: plural. Depois do verbo: plural ou concordância com o mais próximo.

## Concordância nominal
- **Adjetivo depois de dois substantivos**: concorda com o mais próximo ou vai ao plural. "Conta e cartão **novos**."
- **Anexo, incluso, obrigado, mesmo, próprio, quite**: variam. "Seguem **anexas** as cópias." "Ela disse: **obrigada**."
- **Menos e alerta**: invariáveis. "**Menos** pessoas."
- **Meio**: advérbio (= um pouco) não varia: "Ela está **meio** cansada". Numeral varia: "**meia** hora".
- **Bastante**: adjetivo varia ("**bastantes** clientes"); advérbio não ("estudaram **bastante**").
- **É proibido / é necessário**: sem artigo, fica invariável ("É proibido **entrada**"); com artigo, concorda ("É proibid**a a** entrada").

## Acordo Ortográfico (revisão rápida)
- Sem acento nos ditongos abertos de paroxítonas: ideia, assembleia, heroico.
- Sem circunflexo em "oo" e "ee": voo, enjoo, leem, creem.
- Sem trema: frequente, consequência.
- Acento diferencial mantido: pôde (passado), pôr (verbo), têm/vêm (plural).`,
 tarefa:'Crie 6 flashcards com os casos de concordância que você erra. Faça o quiz e 10 questões de Português.',
 prova:'Quiz com 70% ou mais e, no resumo, a diferença entre "Vendem-se casas" e "Precisa-se de funcionários".', mat:MAT_LIVRO.port},

{f:1, s:'en', t:'Leitura em inglês: estratégias', q:[9,10,11,12,13], nq:[],
 aula:`## A prova de inglês é de leitura
São 5 questões, normalmente sobre um texto de economia, banco ou tecnologia. Você não precisa falar inglês: precisa **entender o texto**. Estratégia em 4 passos:
- **1. Leia as perguntas primeiro.** Elas dizem o que procurar.
- **2. Skimming**: leia o título, a primeira e a última frase de cada parágrafo para pegar a ideia geral.
- **3. Scanning**: procure palavras-chave das perguntas (nomes, números, datas).
- **4. Leia com atenção só o trecho** que responde.

## Cognatos ajudam (e enganam)
Muitas palavras parecem o português: *economy, digital, transaction, financial, investment*. Mas cuidado com os **falsos cognatos**:
- *actually* = na verdade · *currently* = atualmente
- *eventually* = finalmente, por fim
- *pretend* = fingir · *intend* = pretender
- *push* = empurrar · *library* = biblioteca
- *college* = faculdade · *parents* = pais
- *sensible* = sensato · *fabric* = tecido
- *assist* = ajudar · *attend* = frequentar, participar

## Conectivos que viram questão
- Contraste: *however, but, yet, although, though, whereas, nevertheless*
- Adição: *moreover, furthermore, besides, in addition*
- Conclusão/consequência: *therefore, thus, hence, so, as a result*
- Causa: *because, since, due to*
- Exemplo: *for instance, for example, such as*

## Referência
Perguntas como "the word **it** refers to..." pedem que você volte ao texto. Teste substituir o pronome pelo termo da alternativa.

## Formação de palavras
- *-er/-or*: quem faz (*lender*, credor). *-ster*: quem pratica (*fraudster*).
- *-less*: sem (*cashless*). *-ful*: cheio de (*useful*).
- *un-, dis-, in-*: negação (*unpaid*, *dishonest*).`,
 tarefa:'Leia 1 notícia por dia na BBC Learning English (nível do seu teste) aplicando os 4 passos. Faça o quiz.',
 prova:'Quiz com 70% ou mais e, no resumo, 5 falsos cognatos com o significado certo.', mat:MAT_LIVRO.ing},

{f:2, s:'cb', t:'Contas, capacidade civil e crédito', q:[48], nq:[
 {s:'cb',q:'Segundo o Código Civil, são relativamente incapazes a certos atos, entre outros,',o:['os menores de 16 anos','os maiores de 16 e menores de 18 anos','os maiores de 60 anos','as pessoas casadas','os estrangeiros'],a:1,e:'Absolutamente incapazes: menores de 16 anos. Relativamente incapazes: maiores de 16 e menores de 18, ébrios habituais, viciados em tóxicos, quem não pode exprimir a vontade por causa transitória e os pródigos.'},
 {s:'cb',q:'Desde 2024, por lei, os juros e encargos do crédito rotativo do cartão de crédito',o:['são livres e sem limite','não podem ultrapassar 100% do valor original da dívida','são limitados a 8% ao mês','são proibidos','só podem ser cobrados após 90 dias'],a:1,e:'A Lei 14.690/2023 limitou juros e encargos do rotativo e do parcelamento da fatura a 100% do valor original da dívida. O limite de 8% ao mês vale para o cheque especial.'}],
 aula:`## Capacidade civil e abertura de conta
Para abrir conta e contratar, a pessoa precisa de capacidade civil (Código Civil):
- **Absolutamente incapazes**: menores de **16 anos**. Agem por meio de **representante** (pais ou tutor).
- **Relativamente incapazes**: maiores de 16 e menores de 18, ébrios habituais, viciados em tóxicos, quem não pode exprimir a vontade por causa transitória e os **pródigos**. Agem **assistidos**.
- A menoridade cessa aos 18 anos ou pela **emancipação** (por exemplo, concessão dos pais a partir dos 16, casamento, emprego público efetivo, colação de grau, economia própria a partir dos 16).
- **Domicílio**: lugar onde a pessoa vive com ânimo definitivo; serve para comprovação de endereço.

## Tipos de conta
- **Conta de depósitos à vista** (conta corrente): movimentação livre, cartão de débito, pacotes de tarifas. Há serviços essenciais gratuitos definidos pelo CMN.
- **Conta poupança**: rende 0,5% a.m. + TR se a Selic estiver acima de 8,5% a.a., ou 70% da Selic + TR se estiver igual ou abaixo. Crédito no aniversário (mensal). Isenta de IR para pessoa física e garantida pelo FGC.
- **Conta-salário**: só recebe salário; transferência gratuita para outra conta.
- **Conta de pagamento**: das instituições de pagamento (contas digitais).

## Crédito
- **Crédito pessoal** e **CDC**: empréstimo com ou sem destinação específica.
- **Consignado**: desconto em folha ou benefício do INSS, dentro da margem consignável. Juros mais baixos pelo menor risco.
- **Cheque especial**: limite pré-aprovado, juros limitados a **8% ao mês** (Resolução CMN 4.765/2019).
- **Cartão de crédito**: rotativo por no máximo 30 dias; depois, parcelamento. Juros e encargos limitados a **100% da dívida original** (Lei 14.690/2023).
- **Crédito imobiliário**: SFH (com regras e limites) e SFI.
- **Crédito rural**: regras do Manual de Crédito Rural, com programas como o Pronaf para a agricultura familiar.
- **Microcrédito**: para empreendedores de baixa renda.

## Na hora do atendimento
Antes de oferecer crédito, o banco avalia a capacidade de pagamento e informa o **CET (Custo Efetivo Total)**, que soma juros, tarifas, seguros e impostos. O CET é o número certo para comparar ofertas.`,
 tarefa:'Abra o app do seu banco e ache o CET de uma simulação de empréstimo. Faça o quiz e 15 questões de Bancários.',
 prova:'Quiz com 70% ou mais e, no resumo, o CET que você encontrou e a regra de rendimento da poupança.', mat:MAT_LIVRO.bancos},

{f:2, s:'cb', t:'Investimentos, impostos e FGC', q:[47,49], nq:[
 {s:'cb',q:'Na tabela regressiva do Imposto de Renda para aplicações de renda fixa, a alíquota para resgates após 720 dias é de',o:['22,5%','20%','17,5%','15%','10%'],a:3,e:'Tabela regressiva: até 180 dias 22,5%; de 181 a 360 dias 20%; de 361 a 720 dias 17,5%; acima de 720 dias 15%.'}],
 aula:`## Renda fixa
Você sabe a regra de rendimento na hora da aplicação (prefixado, pós-fixado ou atrelado à inflação).
- **CDB** (Certificado de Depósito Bancário): o banco capta dinheiro. Geralmente rende um percentual do CDI. Tem **FGC**.
- **LCI e LCA**: lastreadas em crédito imobiliário e do agronegócio. **Isentas de IR para pessoa física** e com FGC. Têm prazo mínimo de carência.
- **Poupança**: liquidez, isenção de IR e FGC, mas costuma render menos.
- **Tesouro Direto**: títulos públicos. **Tesouro Selic** (pós-fixado, baixa oscilação, bom para reserva), **Prefixado** e **IPCA+** (protege da inflação). Garantia do Tesouro Nacional, não do FGC.
- **Debêntures**: dívida de empresas. Sem FGC. As incentivadas (infraestrutura) são isentas de IR para pessoa física.

## Renda variável
- **Ações**: participação em empresas, negociadas na **B3**. Ordinárias (ON) dão voto; preferenciais (PN) têm preferência nos dividendos.
- **Fundos de investimento**: condomínio de investidores com gestor. Regulados pela CVM. Fundos abertos sofrem o **come-cotas** em maio e novembro.

## Impostos
- **IR regressivo** na renda fixa: até 180 dias **22,5%**; 181 a 360 dias **20%**; 361 a 720 dias **17,5%**; acima de 720 dias **15%**.
- **IOF** regressivo sobre o rendimento em resgates **antes de 30 dias**.
- Isentos para pessoa física: poupança, LCI, LCA, debêntures incentivadas.

## FGC
O Fundo Garantidor de Créditos é privado, mantido pelas instituições. Garante até **R$ 250 mil por CPF ou CNPJ por instituição** (ou conglomerado), com teto de **R$ 1 milhão a cada 4 anos**. Cobre depósitos à vista, poupança, CDB, LCI, LCA, entre outros. Não cobre títulos públicos, ações, fundos nem debêntures.

## Suitability
Antes de recomendar investimento, o banco precisa verificar o **perfil do cliente** (conservador, moderado, arrojado) e se o produto é adequado (Resolução CVM 30/2021). Oferecer produto inadequado é falha de conduta.`,
 tarefa:'Monte uma tabela com os produtos da aula: tem FGC? paga IR? qual o risco? Faça o quiz e 15 questões de Bancários.',
 prova:'Quiz com 70% ou mais e a tabela resumida no campo de resumo.', mat:'Material de apoio: Certificação ANBIMA CPA (o conteúdo é quase o mesmo deste módulo).'},

{f:2, s:'pe', t:'Estatística descritiva', q:[27,28,32,35,36], nq:[],
 aula:`## Conceitos básicos
- **População**: todos os elementos de interesse. **Amostra**: parte dela.
- **Variável qualitativa** (categorias: estado civil, banco) ou **quantitativa** (números). Quantitativa **discreta** (contagem: nº de filhos) ou **contínua** (medida: renda, altura).

## Tendência central
- **Média**: soma ÷ quantidade. Sensível a valores extremos.
- **Mediana**: valor do meio dos dados **ordenados**. Com quantidade par, média dos dois centrais.
- **Moda**: valor mais frequente. Pode haver mais de uma (bimodal) ou nenhuma.

Exemplo {2, 4, 4, 5, 10}: média 5, mediana 4, moda 4.

## Posição
- **Quartis**: Q1 (25%), Q2 (= mediana) e Q3 (75%). **Percentis** dividem em 100 partes.
- Amplitude interquartil = Q3 − Q1. O **boxplot** mostra Q1, mediana, Q3 e valores extremos.

## Dispersão
- **Amplitude**: maior − menor.
- **Variância**: média dos quadrados dos desvios em relação à média. Populacional divide por n; amostral divide por **n − 1**.
- **Desvio-padrão**: raiz da variância, na mesma unidade dos dados.
- **Coeficiente de variação**: CV = desvio-padrão ÷ média. Compara dispersões de grupos com médias diferentes.

Propriedades que caem: somar uma constante a todos os dados muda a média, mas **não** muda a variância. Multiplicar por k multiplica a média e o desvio por k, e a variância por k².

## Forma da distribuição
- Simétrica: média ≈ mediana ≈ moda.
- Assimetria positiva (cauda à direita): média > mediana.
- **Normal**: em forma de sino. Cerca de 68% dos dados em ±1 desvio, 95% em ±2 e 99,7% em ±3.

## Correlação
O coeficiente de Pearson (r) vai de −1 a 1. Próximo de 1: relação linear positiva forte; próximo de −1: negativa forte; perto de 0: sem relação linear. **Correlação não prova causa.**`,
 tarefa:'Pegue seus gastos das últimas 10 compras e calcule média, mediana, moda e amplitude. Faça o quiz e 10 questões de Estatística.',
 prova:'Quiz com 70% ou mais e, no resumo, os 4 números das suas compras.', mat:MAT_LIVRO.mat},

{f:2, s:'pt', t:'Regência, crase e colocação pronominal', q:[1,2,3,4], nq:[],
 aula:`## Regência verbal: os verbos que mais caem
- **Assistir** (ver) pede "a": assisti **ao** vídeo. (Ajudar: assistir o cliente.)
- **Visar** (ter como objetivo) pede "a": visa **ao** lucro. (Mirar, dar visto: sem preposição.)
- **Aspirar** (desejar) pede "a": aspira **ao** cargo. (Respirar: sem preposição.)
- **Obedecer e desobedecer**: **ao** regulamento.
- **Preferir**: prefiro isto **a** aquilo. Nunca "mais... do que".
- **Implicar** (acarretar): implica **mudanças**, sem "em".
- **Chegar e ir**: **a** algum lugar ("chegou **à** agência").
- **Esquecer/lembrar**: esqueci **o** prazo; esqueci-**me do** prazo.
- **Pagar e perdoar**: algo (coisa) **a** alguém (pessoa): pagou **ao** fornecedor.
- **Informar**: informar **algo a alguém** ou **alguém de/sobre algo**.

## Crase = a + a
Ocorre quando o termo exige a preposição "a" e o seguinte aceita o artigo "a". Teste: troque por uma palavra masculina. Se virar "ao", há crase ("fui **à** agência" → "fui **ao** banco").

**Sempre**: horas exatas ("**às** 10h"), locuções femininas ("**à** vista, **à** medida que, **às** vezes"), "**à** moda de".
**Nunca**: antes de verbo, de palavra masculina, de pronome pessoal e de tratamento (a ele, a Vossa Senhoria), em palavras repetidas (cara a cara), antes de "uma" na maioria dos casos.
**Facultativa**: antes de possessivo feminino (a/à minha conta), depois de "até" (até a/à agência) e antes de nome próprio feminino de pessoa.

## Colocação pronominal
- **Próclise** (antes do verbo) é obrigatória com palavras atrativas: negativas (**não**, nunca), advérbios sem vírgula, pronomes relativos (**que**), indefinidos (**alguém**, tudo), interrogativos e conjunções subordinativas.
- **Ênclise** (depois): no início da frase e após vírgula. "**Informaram-me** o saldo."
- **Mesóclise**: com futuro do presente ou do pretérito sem palavra atrativa. "**Informar-lhe-ei**."
- Nunca ênclise ao **particípio** ("tinha informado-me" está errado).

## Pontuação (revisão)
Não se separa sujeito do verbo nem verbo do complemento por vírgula. Use vírgula para aposto, vocativo, adjunto adverbial deslocado longo e orações intercaladas.`,
 tarefa:'Crie flashcards com os 10 verbos da aula. Faça o quiz e 15 questões de Português.',
 prova:'Quiz com 70% ou mais e, no resumo, 3 casos de crase obrigatória e 3 de crase proibida.', mat:MAT_LIVRO.port},

{f:3, s:'ab', t:'Código de Defesa do Consumidor nos bancos', q:[61,62,63,66], nq:[],
 aula:`## O CDC vale para bancos
A **Súmula 297 do STJ** diz: "O Código de Defesa do Consumidor é aplicável às instituições financeiras". Para a prova, conheça a Lei 8.078/1990 nos pontos abaixo.

## Conceitos
- **Consumidor**: quem adquire produto ou serviço como destinatário final.
- **Fornecedor**: quem oferece no mercado, inclusive serviços bancários, financeiros, de crédito e securitários (art. 3º, § 2º).

## Direitos básicos (art. 6º)
Informação clara sobre preço, tarifas e riscos; proteção contra publicidade enganosa e práticas abusivas; revisão de cláusulas que se tornaram excessivamente onerosas; **inversão do ônus da prova** a favor do consumidor quando a alegação for verossímil ou ele for hipossuficiente; prevenção e tratamento do **superendividamento** (incluído pela Lei 14.181/2021).

## Responsabilidade do banco
- O fornecedor de serviços responde **independentemente de culpa** (responsabilidade objetiva) por defeitos na prestação (art. 14).
- **Súmula 479 do STJ**: as instituições financeiras respondem objetivamente por danos causados por fraudes e delitos praticados por terceiros em operações bancárias (o chamado fortuito interno).

## Prazos
- Reclamar de **vício aparente**: **30 dias** para produto ou serviço não durável; **90 dias** para durável (art. 26).
- **Arrependimento**: **7 dias** quando a contratação ocorre fora do estabelecimento, como pelo aplicativo ou telefone (art. 49). O dinheiro volta corrigido.

## Práticas abusivas (art. 39)
- **Venda casada**: condicionar um produto à compra de outro (ex.: empréstimo só com seguro).
- Enviar produto **sem solicitação** (como cartão não pedido): é amostra grátis, sem obrigação de pagar.
- Aproveitar-se da fraqueza do consumidor por idade, saúde ou conhecimento.
- Exigir vantagem manifestamente excessiva.

## Cobrança (art. 42)
Não pode expor o consumidor ao ridículo nem constrangê-lo. Quem pagou valor cobrado indevidamente recebe o **dobro** do que pagou em excesso, com correção e juros, salvo engano justificável.

## Cadastros de inadimplentes (art. 43)
O consumidor deve ser **comunicado por escrito** antes da inclusão. A informação negativa pode ficar no máximo **5 anos**. Pagou a dívida, o registro deve ser retirado.`,
 tarefa:'Leia os artigos 6º, 39, 42, 43 e 49 do CDC no planalto.gov.br. Faça o quiz e 10 questões de Atendimento.',
 prova:'Quiz com 70% ou mais e, no resumo, 3 práticas abusivas que podem acontecer numa agência.', mat:MAT_LIVRO.leis},

{f:3, s:'ab', t:'Normas de relacionamento e ouvidoria', q:[65,71], nq:[
 {s:'ab',q:'De acordo com a Resolução CMN 4.860/2020, o atendimento prestado pela ouvidoria deve',o:['ser cobrado por demanda','ser identificado por número de protocolo informado ao demandante','ocorrer apenas presencialmente','substituir o SAC em todas as situações','dispensar registro das demandas'],a:1,e:'A ouvidoria deve ser gratuita, identificar cada atendimento por número de protocolo e responder em até 10 dias úteis.'}],
 aula:`## Resolução CMN 4.949/2021: relacionamento com clientes
Substituiu a Resolução 4.539/2016. Exige que bancos tenham uma **política institucional de relacionamento** com clientes e usuários, baseada nos princípios de:
- **ética, responsabilidade, transparência e diligência**;
- convergência de interesses e consolidação de uma imagem de credibilidade.

Na prática, o banco deve:
- oferecer produtos **adequados às necessidades, interesses e objetivos** do cliente;
- dar informações claras sobre preço, riscos, prazos e condições, antes e depois da contratação;
- não dificultar o **cancelamento** de produtos e serviços;
- ter atenção especial a clientes vulneráveis, como idosos e pessoas com pouca escolaridade;
- treinar empregados e correspondentes nessas regras.

## Resolução CMN 3.694/2009: prevenção de riscos
Trata da prevenção de riscos na contratação e na prestação de serviços: contratos e recibos devem ser claros, o cliente tem direito a cópia do contrato e a informações sobre todas as condições.

## Resolução CMN 4.860/2020: ouvidoria
- Toda instituição deve ter **ouvidoria**, com diretor responsável.
- É o **último nível** de atendimento: o cliente procura primeiro os canais primários (agência, SAC, app). Se não resolver, vai à ouvidoria.
- Atendimento **gratuito** e com **número de protocolo**.
- Prazo de resposta: até **10 dias úteis**, prorrogável excepcionalmente por mais 10, com justificativa ao cliente.
- A ouvidoria também propõe melhorias a partir das reclamações e faz relatórios periódicos.

## SAC
O Serviço de Atendimento ao Consumidor segue o Decreto 11.034/2022: acesso fácil, atendimento humano disponível, registro com protocolo e **resolução em até 7 dias corridos**.

## Autorregulação (SARB)
O Sistema de Autorregulação Bancária, da Febraban, cria normativos que os bancos associados se comprometem a seguir, como regras de atendimento, crédito responsável e prevenção a fraudes. Não é lei, mas é cobrado no edital.

## Fluxo para decorar
Cliente com problema → canal primário (agência, app, SAC) → sem solução → **ouvidoria** → sem solução → Banco Central (Registrato e reclamações no site), Procon, consumidor.gov.br ou Justiça.`,
 tarefa:'Desenhe o fluxo de reclamação da aula e cole no resumo. Faça o quiz e 10 questões de Atendimento.',
 prova:'Quiz com 70% ou mais e o fluxo de reclamação no resumo.', mat:MAT_LIVRO.leis},

{f:3, s:'ab', t:'Acessibilidade e atendimento prioritário', q:[64,67], nq:[
 {s:'ab',q:'A Lei 13.146/2015, também chamada Estatuto da Pessoa com Deficiência, considera pessoa com deficiência aquela que tem impedimento de',o:['curto prazo, apenas de natureza física','longo prazo de natureza física, mental, intelectual ou sensorial que, em interação com barreiras, pode obstruir sua participação plena na sociedade','qualquer natureza, desde que comprovado por laudo renovado anualmente','natureza exclusivamente visual ou auditiva','natureza temporária, como fraturas'],a:1,e:'O conceito da LBI (art. 2º) é o de impedimento de longo prazo que, em interação com barreiras, pode obstruir a participação plena e efetiva em igualdade de condições.'}],
 aula:`## Quem tem prioridade
- **Pessoas idosas** (60 anos ou mais) – Estatuto da Pessoa Idosa, Lei 10.741/2003.
- **Maiores de 80 anos** têm **prioridade especial**, à frente dos demais idosos (Lei 13.466/2017).
- **Pessoas com deficiência** – Lei 13.146/2015 (LBI).
- **Pessoas com transtorno do espectro autista** – consideradas pessoas com deficiência para todos os efeitos legais (Lei 12.764/2012).
- **Gestantes, lactantes, pessoas com criança de colo e pessoas com mobilidade reduzida**.
O Decreto 5.296/2004 regulamenta a prioridade e a acessibilidade (Leis 10.048 e 10.098 de 2000).

## Lei Brasileira de Inclusão (13.146/2015)
- **Pessoa com deficiência**: impedimento de longo prazo (físico, mental, intelectual ou sensorial) que, em interação com **barreiras**, pode obstruir sua participação.
- **Barreiras**: urbanísticas, arquitetônicas, nos transportes, nas comunicações, atitudinais e tecnológicas.
- **Acessibilidade**: possibilidade de usar espaços, serviços e tecnologias com segurança e autonomia.
- **Desenho universal**: produtos e ambientes que todos podem usar sem adaptação.
- **Tecnologia assistiva**: recursos que ampliam a autonomia (leitores de tela, Libras, piso tátil).
- Atendimento prioritário inclui acesso a informações e comunicações acessíveis e disponibilização de recursos humanos e tecnológicos.

## Outras normas do edital
- **Decreto 5.904/2006**: direito da pessoa com deficiência visual de entrar e permanecer com **cão-guia** em locais públicos e privados de uso coletivo.
- **Decreto 8.727/2016**: uso do **nome social** e reconhecimento da identidade de gênero de pessoas travestis e transexuais na administração pública federal. No atendimento, chame a pessoa pelo nome social.
- **Estatuto da Pessoa Idosa**: proíbe discriminação, garante prioridade e protege contra abuso financeiro. Desconfie de terceiros que pressionam o idoso a sacar ou emprestar.

## No balcão
Pergunte como a pessoa prefere ser ajudada, fale diretamente com ela (não só com o acompanhante), descreva o que está fazendo para quem tem deficiência visual e respeite o tempo de cada um. Atendimento prioritário não é favor, é direito.`,
 tarefa:'Observe o atendimento prioritário numa agência ou lotérica e anote 2 boas práticas e 1 falha. Faça o quiz e 10 questões de Atendimento.',
 prova:'Quiz com 70% ou mais e as anotações da observação no resumo.', mat:MAT_LIVRO.leis},

{f:3, s:'ab', t:'Vendas, marketing e qualidade no atendimento', q:[68,69,70], nq:[],
 aula:`## Valor percebido
O cliente compra quando os **benefícios percebidos** superam os **custos percebidos** (dinheiro, tempo, esforço, risco). Atendimento bom aumenta o valor sem mexer no preço.

## Características dos serviços
- **Intangibilidade**: não dá para tocar antes de comprar.
- **Inseparabilidade**: produção e consumo acontecem juntos (o atendente faz parte do serviço).
- **Variabilidade**: a qualidade depende de quem atende e quando.
- **Perecibilidade**: não se estoca serviço.

## Etapas da venda
- **Prospecção e pré-abordagem**: identificar e estudar o cliente (histórico, segmento, necessidades prováveis).
- **Abordagem**: criar confiança.
- **Levantamento de necessidades**: perguntas abertas e **escuta ativa** (técnica SPIN: situação, problema, implicação e necessidade de solução).
- **Apresentação**: benefícios, não só características.
- **Objeções**: ouvir, entender, responder com fatos.
- **Fechamento**.
- **Pós-venda**: acompanhar, resolver problemas, fidelizar.

## Marketing digital
- **Lead**: contato interessado que deixou seus dados.
- **Funil**: atração → conversão → venda → relacionamento.
- **Inbound**: atrair com conteúdo útil. **Outbound**: o vendedor vai atrás do cliente.
- **Copywriting**: texto persuasivo, claro e orientado à ação.
- **Gatilhos mentais** (Cialdini): reciprocidade, compromisso e coerência, prova social, afinidade, autoridade, escassez e unidade.

## Ética em vendas e clientecentrismo
Venda ética não empurra produto: oferece o que é **adequado** ao perfil (Res. 4.949 e suitability). Clientecentrismo põe o cliente no centro das decisões. Escassez falsa, pressão e venda casada são condutas vedadas.

## Qualidade no atendimento
Dimensões da qualidade em serviços (modelo SERVQUAL): **confiabilidade**, **responsividade** (presteza), **segurança**, **empatia** e **tangíveis** (aparência do ambiente e materiais). No atendimento remoto, valem ainda clareza, tempo de resposta e resolução no primeiro contato. Indicadores comuns: **NPS** (quanto o cliente recomendaria) e taxa de resolução.

## Segmentação e CRM
Segmentar é dividir clientes em grupos com necessidades parecidas (pessoa física, MEI, agro, alta renda). O **CRM** registra o histórico para personalizar o atendimento.`,
 tarefa:'Escreva um roteiro de atendimento consultivo para vender um seguro de forma ética (sem venda casada). Faça o quiz e 10 questões de Atendimento.',
 prova:'Quiz com 70% ou mais e o roteiro no resumo.', mat:'Livros de apoio: Comunicação Não Violenta e Administração de Marketing (aba Livros).'},
];
