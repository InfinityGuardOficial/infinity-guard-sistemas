{f:4, s:'et', t:'Prevenção à lavagem de dinheiro', q:[38,39], nq:[
 {s:'et',q:'Pela Circular BCB 3.978/2020, as instituições devem adotar procedimentos para conhecer seus clientes, incluindo identificação, qualificação e classificação de risco. Esses procedimentos são conhecidos como',o:['suitability','"conheça seu cliente" (KYC)','compliance tributário','Open Finance','auditoria externa'],a:1,e:'"Conheça seu cliente" (Know Your Customer) é a base da PLD/FT. A circular também exige conhecer funcionários, parceiros e prestadores de serviços.'}],
 aula:`## O que é lavagem de dinheiro
É dar aparência legal a recursos de origem criminosa. A Lei 9.613/1998 tipifica o crime. Desde a Lei 12.683/2012, **qualquer infração penal** pode ser crime antecedente (antes havia uma lista fechada).

## As 3 fases
- **Colocação**: o dinheiro entra no sistema (depósitos fracionados, compra de bens, câmbio).
- **Ocultação** (estratificação): muitas movimentações para apagar o rastro (transferências em cadeia, contas de terceiros, empresas de fachada).
- **Integração**: o dinheiro volta "limpo" à economia (imóveis, empresas, investimentos).

## Quem faz o quê
- **COAF** – Conselho de Controle de Atividades Financeiras: unidade de inteligência financeira. Recebe as comunicações, analisa e envia relatórios às autoridades. Hoje é vinculado administrativamente ao **Banco Central** (Lei 13.974/2020).
- **Instituições financeiras**: identificam clientes, monitoram operações e comunicam ao COAF.

## Circular BCB 3.978/2020
- Exige **política de PLD/FT**, aprovada pela diretoria, com **abordagem baseada em risco**: clientes e operações de maior risco recebem controles mais fortes.
- **Avaliação interna de risco**.
- Procedimentos de **conheça seu cliente (KYC)**, funcionário, parceiro e prestador de serviço.
- **Pessoas expostas politicamente (PEP)**: monitoramento reforçado.
- **Monitoramento** de operações e **comunicação ao COAF** sem dar ciência ao cliente.
- Operações em **espécie de R$ 50 mil ou mais** (depósito, saque, provisionamento de saque) são comunicadas ao COAF.
- Guarda de registros por prazo mínimo definido na norma.

## Carta Circular 4.001/2020
Lista **situações que podem indicar** lavagem ou financiamento do terrorismo, como: movimentação incompatível com a renda, fracionamento de depósitos para fugir do controle, uso de contas de terceiros, resistência a fornecer informações e operações sem fundamento econômico.

## Resolução CVM 50/2021
Regras de PLD/FT para o **mercado de valores mobiliários** (corretoras, distribuidoras, gestores).

## No atendimento
Ao perceber indício, o empregado **não alerta o cliente** (seria crime de "tipping off" e prejudicaria a investigação). Ele registra e comunica pelos canais internos, que decidem a comunicação ao COAF.`,
 tarefa:'Liste 5 situações suspeitas da Carta Circular 4.001 que você poderia ver numa agência. Faça o quiz e 10 questões de Ética e Compliance.',
 prova:'Quiz com 70% ou mais e, no resumo, as 3 fases da lavagem com um exemplo de cada.', mat:MAT_LIVRO.leis},

{f:4, s:'et', t:'LGPD, sigilo bancário e segurança cibernética', q:[40,43,44], nq:[],
 aula:`## LGPD (Lei 13.709/2018)
- **Dado pessoal**: informação de pessoa natural identificada ou identificável (nome, CPF, endereço, IP).
- **Dado sensível**: origem racial ou étnica, convicção religiosa, opinião política, filiação sindical, saúde, vida sexual, dado genético ou **biométrico**.
- **Dado anonimizado**: não permite identificar a pessoa; fica fora da LGPD.
- **Titular**: a pessoa dona dos dados. **Controlador**: decide o tratamento (o banco). **Operador**: trata em nome do controlador (uma empresa terceirizada). **Encarregado (DPO)**: canal com titulares e com a ANPD.
- **ANPD**: Autoridade Nacional de Proteção de Dados, que fiscaliza e aplica sanções.

**Bases legais** (o tratamento precisa de pelo menos uma): consentimento, obrigação legal ou regulatória, execução de políticas públicas, estudos por órgão de pesquisa, execução de contrato, exercício regular de direitos, proteção da vida, tutela da saúde, legítimo interesse e **proteção do crédito**.

**Princípios**: finalidade, adequação, necessidade, livre acesso, qualidade dos dados, transparência, segurança, prevenção, não discriminação e responsabilização.

**Direitos do titular**: confirmação e acesso, correção, anonimização ou eliminação de dados desnecessários, portabilidade, informação sobre compartilhamento e revogação do consentimento.

**Sanções**: advertência, multa de até 2% do faturamento limitada a R$ 50 milhões por infração, bloqueio e eliminação de dados.

## Sigilo bancário (LC 105/2001)
Bancos devem manter sigilo das operações ativas e passivas. **Não** violam o sigilo, entre outros:
- troca de informações entre instituições para cadastro, nos termos do CMN;
- fornecimento de dados a sistemas de proteção ao crédito;
- **comunicação às autoridades de ilícitos** penais ou administrativos;
- revelação com **consentimento expresso** dos interessados.
A quebra pode ser decretada pelo **Poder Judiciário** e por **CPIs**; a Receita pode acessar dados com processo administrativo instaurado. Violar o sigilo é crime (reclusão de 1 a 4 anos e multa).

## Resolução CMN 4.893/2021
Exige das instituições:
- **política de segurança cibernética** aprovada pelo conselho;
- **plano de ação e de resposta a incidentes**;
- comunicação de incidentes relevantes ao Banco Central;
- regras para contratar serviços de **processamento, armazenamento de dados e computação em nuvem**, com avaliação do fornecedor e comunicação ao BC.`,
 tarefa:'Abra a política de privacidade de um banco e identifique quem é o encarregado e quais bases legais aparecem. Faça o quiz e 10 questões de Ética e Compliance.',
 prova:'Quiz com 70% ou mais e, no resumo, 4 exemplos de dado sensível e 2 situações que não violam o sigilo bancário.', mat:MAT_LIVRO.ti},

{f:4, s:'et', t:'Anticorrupção, ética e governança', q:[37,41,42], nq:[],
 aula:`## Lei Anticorrupção (Lei 12.846/2013)
Responsabiliza **empresas** por atos contra a administração pública, nacional ou estrangeira:
- Responsabilidade **objetiva** (independe de culpa), nas esferas **administrativa e civil**.
- Atos lesivos: prometer ou dar vantagem indevida a agente público, fraudar licitações, financiar atos ilícitos, usar laranjas para ocultar interesses.
- Sanções administrativas: **multa de 0,1% a 20% do faturamento bruto** do ano anterior (nunca menor que a vantagem obtida) e **publicação extraordinária** da decisão.
- **Acordo de leniência**: a empresa que colabora pode ter a multa reduzida em até 2/3.
- **Programa de integridade** (compliance) bem estruturado reduz a penalidade.
O Decreto 8.420/2015, citado no edital de 2024, regulamentava a lei; ele foi substituído pelo **Decreto 11.129/2022**. Confira qual o novo edital citar.

## Art. 37 da Constituição
A administração pública obedece aos princípios de **Legalidade, Impessoalidade, Moralidade, Publicidade e Eficiência** (LIMPE). O mesmo artigo exige **concurso público** para cargos e empregos públicos, como o seu na CAIXA, e prevê punição por improbidade.

## Ética no trabalho
- **Moral**: costumes e regras de um grupo. **Ética**: reflexão sobre o que é certo.
- **Conflito de interesses**: interesse pessoal que pode influenciar uma decisão profissional. Conduta: declarar e se afastar da decisão.
- **Brindes e presentes**: aceitar só os de valor simbólico, conforme o código da empresa.
- **Código de Ética, Conduta e Integridade da CAIXA**: valores como respeito, integridade, transparência e responsabilidade; canais de denúncia com sigilo e proteção contra retaliação.

## Assédio
- **Moral**: conduta abusiva e **repetitiva** que humilha ou constrange (gritos, isolamento, metas abusivas com exposição).
- **Sexual**: constranger alguém para obter vantagem ou favor sexual, prevalecendo-se de superioridade hierárquica (crime do art. 216-A do Código Penal). Uma única conduta já configura.

## Governança corporativa
Princípios do IBGC: **integridade, transparência, equidade, responsabilização (accountability) e sustentabilidade**. Estatais seguem a Lei 13.303/2016, com regras de governança, compliance e gestão de riscos.
**Modelo das três linhas**: 1ª linha, a gestão do dia a dia; 2ª, riscos e compliance; 3ª, auditoria interna independente.

## Responsabilidade socioambiental
A **Resolução CMN 4.945/2021** exige a Política de Responsabilidade Social, Ambiental e Climática (PRSAC). A CAIXA tem a sua política alinhada a ela e aos ODS.`,
 tarefa:'Leia o resumo do Código de Ética da CAIXA no site da empresa e anote 3 condutas proibidas. Faça o quiz e 10 questões de Ética e Compliance.',
 prova:'Quiz com 70% ou mais e as 3 condutas no resumo.', mat:MAT_LIVRO.leis},

{f:4, s:'pe', t:'Probabilidade', q:[29,30,31,33,34], nq:[],
 aula:`## Probabilidade clássica
**P(A) = casos favoráveis ÷ casos possíveis**, quando todos os resultados são igualmente prováveis (Laplace). Vai de 0 a 1.
- Evento **complementar**: P(não A) = 1 − P(A). Use quando "pelo menos um" aparecer: P(pelo menos um) = 1 − P(nenhum).

## União e interseção
- **P(A ∪ B) = P(A) + P(B) − P(A ∩ B)**.
- Eventos **mutuamente exclusivos** (não acontecem juntos): P(A ∩ B) = 0.

## Condicional e independência
- **P(A | B) = P(A ∩ B) ÷ P(B)**: probabilidade de A sabendo que B ocorreu.
- **Independentes**: um não altera o outro. P(A ∩ B) = P(A) · P(B).
- **Sem reposição**, as retiradas são dependentes: o total diminui a cada retirada.

## Árvore de probabilidades
Multiplique ao longo dos ramos e some os caminhos que levam ao evento. Exemplo: urna com 3 brancas e 2 pretas, duas retiradas sem reposição. P(duas brancas) = 3/5 × 2/4 = 3/10.

## Teorema de Bayes
Atualiza uma probabilidade com uma nova informação:
**P(A | B) = P(B | A) · P(A) ÷ P(B)**.
Exemplo bancário: 2% das transações são fraudes. O sistema alerta 90% das fraudes e 5% das transações normais. Dado um alerta, qual a chance de fraude? P(alerta) = 0,9 × 0,02 + 0,05 × 0,98 = 0,018 + 0,049 = 0,067. P(fraude | alerta) = 0,018 ÷ 0,067 ≈ 27%. A maioria dos alertas é falso positivo.

## Distribuição binomial
n tentativas independentes, cada uma com probabilidade p de sucesso:
**P(k sucessos) = C(n,k) · pᵏ · (1 − p)ⁿ⁻ᵏ**.
Média = n·p. Variância = n·p·(1 − p).
Exemplo: 3 lançamentos de moeda, exatamente 2 caras: C(3,2) × (1/2)³ = 3/8.

## Contagem que ajuda
Princípio multiplicativo, combinação C(n,k) = n! ÷ [k!(n − k)!] quando a ordem não importa e arranjo quando importa.`,
 tarefa:'Refaça à mão o exemplo de Bayes da aula sem olhar. Faça o quiz e 10 questões de Probabilidade.',
 prova:'Quiz com 70% ou mais e, no resumo, o cálculo de Bayes refeito por você.', mat:MAT_LIVRO.mat},

{f:5, s:'cb', t:'Pix, Drex, Open Finance e bancos digitais', q:[52,53,59,60], nq:[],
 aula:`## Pix
- Arranjo de **pagamentos instantâneos** do Banco Central, lançado em **novembro de 2020**.
- Funciona **24 horas, 7 dias**. Gratuito para pessoas físicas em transferências e compras (com exceções previstas).
- **Chaves**: CPF/CNPJ, e-mail, celular ou chave aleatória.
- Modalidades: Pix Cobrança (com vencimento), Pix Saque e Pix Troco, Pix Agendado, **Pix Automático** (pagamentos recorrentes, lançado em 2025).
- Segurança: limite padrão menor à noite (20h às 6h) para pessoa física, e o **MED – Mecanismo Especial de Devolução**, para casos de fraude e falha operacional.

## Drex
Plataforma do BC para a **versão digital do real** e para operações com ativos **tokenizados**, em rede regulada (tecnologia de registro distribuído). Diferente das criptomoedas privadas: é dinheiro oficial, emitido sob regulação.

## Criptoativos e moedas digitais
O marco legal dos criptoativos (Lei 14.478/2022) regula as prestadoras de serviços de ativos virtuais, supervisionadas pelo Banco Central. Criptomoedas como o Bitcoin não têm emissor central nem garantia.

## Open Finance
Compartilhamento padronizado de dados e serviços entre instituições, **com consentimento do cliente**, por prazo e finalidade definidos, revogável a qualquer momento. Permite comparar ofertas, levar seu histórico e até iniciar pagamentos por outra instituição. Começou como Open Banking em 2021.

## Fintechs, big techs e shadow banking
- **Fintechs de crédito** (Resolução CMN 4.656/2018): SCD (empresta com recursos próprios) e SEP (empréstimo entre pessoas).
- **Instituições de pagamento**: contas digitais, carteiras, maquininhas.
- **Big techs**: gigantes de tecnologia que entram em pagamentos e crédito.
- **Shadow banking**: intermediação de crédito fora do sistema bancário regulado.

## Correspondentes bancários
Empresas contratadas pela instituição para prestar alguns serviços em nome dela (lotéricas, Caixa Aqui, lojas). A instituição contratante **responde** pelos serviços. Regra atual: Resolução CMN 4.935/2021.

## Sistema de Pagamentos Brasileiro (SPB)
Conjunto de sistemas que liquidam transferências: **STR** (Sistema de Transferência de Reservas, do BC), **Selic** (títulos públicos), câmaras da **B3**, além do **SPI** (que liquida o Pix). Mercado **interbancário**: bancos emprestam entre si por um dia; a taxa média é o **DI**, base do CDI.

## Internet e mobile banking
Mais da metade das transações bancárias no Brasil acontece no celular. Isso muda o papel da agência: mais consultoria e negócios, menos transações simples.`,
 tarefa:'No app do seu banco, ache onde se gerencia o consentimento do Open Finance e o limite noturno do Pix. Faça o quiz e 15 questões de Bancários.',
 prova:'Quiz com 70% ou mais e, no resumo, o que é o MED e a diferença entre Drex e criptomoeda.', mat:MAT_LIVRO.bancos},

{f:5, s:'cb', t:'Previdência, seguros, capitalização, consórcio e garantias', q:[51,55,56], nq:[],
 aula:`## Previdência complementar aberta (Susep)
- **PGBL**: deduz as contribuições até **12% da renda bruta tributável** na declaração completa. No resgate, IR sobre o **valor total**.
- **VGBL**: não deduz. IR só sobre o **rendimento**. Indicado para quem faz declaração simplificada ou já usou os 12%.
- Tabela **progressiva** (como a do salário) ou **regressiva** (de 35% até **10% após 10 anos**). A escolha da regressiva premia o longo prazo.
- Fases: **acumulação** e **benefício** (renda ou resgate).

## Seguros
- **Prêmio**: o que o segurado paga. **Sinistro**: o evento coberto que acontece. **Indenização**: o que a seguradora paga. **Franquia**: parte do prejuízo que fica com o segurado.
- Tipos: vida, residencial, auto, prestamista (quita dívida em caso de morte ou invalidez), empresarial.
- Seguro é produto da Susep, mas é vendido também em bancos (bancassurance). Lembre: **não** pode ser condição para empréstimo (venda casada).

## Capitalização
Título em que o cliente guarda dinheiro e concorre a **sorteios**. No fim, resgata parte ou todo o valor pago, conforme as condições. Não é investimento rentável; o atrativo é o sorteio.

## Consórcio (Lei 11.795/2008)
- Grupo de pessoas que contribui para comprar bens. **Sem juros**, com **taxa de administração** e fundo de reserva.
- Contemplação por **sorteio** ou **lance**.
- Supervisionado pelo **Banco Central**.

## Garantias do SFN
**Pessoais (fidejussórias)**: o patrimônio de uma pessoa garante a dívida.
- **Aval**: garantia em **título de crédito** (nota promissória, cédula). O avalista responde junto com o devedor, sem benefício de ordem.
- **Fiança**: garantia em **contrato**. O fiador tem benefício de ordem (o credor cobra primeiro o devedor), salvo renúncia. **Fiança bancária**: o banco é o fiador, mediante comissão.

**Reais**: um bem garante a dívida.
- **Penhor**: bem **móvel**, em regra entregue ao credor (o penhor rural, industrial, mercantil e de veículos fica com o devedor). A CAIXA tem o penhor de joias.
- **Hipoteca**: **imóveis** (e navios e aeronaves). O bem fica com o devedor.
- **Alienação fiduciária**: a **propriedade** fica com o credor até a quitação; o devedor tem a **posse** e usa o bem. Muito usada em veículos e imóveis, porque a retomada é mais rápida.`,
 tarefa:'Monte uma tabela com as garantias da aula: pessoal ou real, bem móvel ou imóvel, quem fica com o bem. Faça o quiz e 15 questões de Bancários.',
 prova:'Quiz com 70% ou mais e a tabela de garantias no resumo.', mat:MAT_LIVRO.bancos},

{f:5, s:'cb', t:'FGTS, programas sociais, capitais e câmbio', q:[57], nq:[
 {s:'cb',q:'O regime cambial adotado pelo Brasil desde 1999 é o de',o:['câmbio fixo, com paridade ao dólar','bandas cambiais','câmbio flutuante, com possibilidade de intervenção do Banco Central','câmbio administrado pelo Tesouro','câmbio múltiplo, com uma taxa por setor'],a:2,e:'Desde janeiro de 1999 o real flutua conforme oferta e demanda, e o BC intervém em momentos de volatilidade (flutuação "suja").'},
 {s:'cb',q:'No Brasil, as ações de companhias abertas são negociadas principalmente',o:['no Banco Central','na B3, a bolsa de valores brasileira','no Tesouro Direto','na Susep','nas agências de fomento'],a:1,e:'A B3 é a bolsa onde se negociam ações e outros ativos. A CVM regula e fiscaliza esse mercado.'}],
 aula:`## FGTS (Lei 8.036/1990)
- Depósito mensal do empregador de **8% do salário** em conta vinculada do trabalhador.
- A **CAIXA é o agente operador**: centraliza as contas e aplica os recursos em habitação, saneamento e infraestrutura.
- Saques (art. 20), entre outros: **demissão sem justa causa** (com multa de 40% paga pelo empregador), aposentadoria, compra da casa própria (com requisitos), doenças graves previstas em lei, idade igual ou superior a 70 anos, calamidade pública e **saque-aniversário** (opcional; quem adere perde o saque do saldo na demissão, exceto a multa).
- **Pedido de demissão não permite saque.**
- **CRF – Certificado de Regularidade do FGTS**: emitido pela CAIXA, prova que a empresa está em dia; exigido em licitações e financiamentos.
- **GRF**: guia de recolhimento; o recolhimento passou a ser feito pelo **FGTS Digital** desde 2024.

## PIS e abono salarial
- **PIS** (LC 7/1970): programa dos trabalhadores da iniciativa privada, pago pela **CAIXA**. O Pasep (servidores públicos) é pago pelo Banco do Brasil.
- **Abono salarial** (Lei 7.998/1990): até um salário mínimo, proporcional aos meses trabalhados, para quem está inscrito no PIS/Pasep há pelo menos 5 anos, trabalhou com carteira por 30 dias ou mais no ano-base e recebeu até o limite de renda da lei (em redução gradual desde a EC 135/2024).

## Seguro-desemprego (Lei 7.998/1990)
Assistência temporária ao trabalhador demitido sem justa causa, de 3 a 5 parcelas conforme o tempo trabalhado. Pago pela CAIXA.

## Bolsa Família
Criado pela Lei 10.836/2004 e reestruturado pela Lei 14.601/2023. Usa o **Cadastro Único**. Benefício mínimo de R$ 600 por família, com adicionais por crianças, gestantes e jovens, e condicionalidades em saúde e educação. A **CAIXA é o agente operador** e paga os benefícios.

## Mercado de capitais
Financia empresas no médio e longo prazo: **ações** (ON com voto, PN com preferência), **debêntures**, IPO (primeira oferta de ações), mercado primário (empresa vende) e secundário (investidores negociam entre si na **B3**). Regulação da **CVM**.

## Mercado de câmbio
- Troca de moedas estrangeiras, operada por instituições autorizadas pelo BC.
- **Regime flutuante** desde 1999, com intervenções do BC.
- **PTAX**: taxa média de referência divulgada pelo BC.
- A nova lei cambial (Lei 14.286/2021) simplificou as regras.
- Real valorizado barateia importações; desvalorizado favorece exportações.`,
 tarefa:'Entre no app FGTS (ou simule) e veja quais hipóteses de saque aparecem. Faça o quiz e 15 questões de Bancários.',
 prova:'Quiz com 70% ou mais e, no resumo, 4 hipóteses de saque do FGTS e 1 situação que não permite saque.', mat:MAT_LIVRO.bancos},

{f:5, s:'mf', t:'Descontos, séries e amortização (SAC e Price)', q:[20,21,22,23,26], nq:[],
 aula:`## Descontos
Antecipar o pagamento de um título de valor nominal **N** gera um valor atual **A** menor.
- **Comercial simples (por fora)**: D = N · d · n e A = N − D. Mais usado pelos bancos.
- **Racional simples (por dentro)**: A = N ÷ (1 + i · n).
- **Racional composto**: A = N ÷ (1 + i)ⁿ (é o valor presente).
O desconto comercial é sempre **maior** que o racional para a mesma taxa e prazo.

## Séries uniformes
Pagamentos iguais (PMT) em intervalos iguais. Valor presente de uma série postecipada:
**PV = PMT · [1 − (1 + i)⁻ⁿ] ÷ i**.
Isolando a parcela: **PMT = PV · i ÷ [1 − (1 + i)⁻ⁿ]**.

## Sistema Price (francês)
- **Parcelas iguais**.
- No início, a parcela tem mais juros e menos amortização; com o tempo, inverte.
- Exemplo: R$ 1.000 em 2 parcelas a 10% → PMT ≈ R$ 576,19. 1ª parcela: juros 100, amortização 476,19. 2ª: juros 52,38, amortização 523,81.

## SAC (Sistema de Amortização Constante)
- **Amortização igual** em todas as parcelas: A = PV ÷ n.
- Juros sobre o saldo devedor, que cai a cada mês. Por isso as **parcelas diminuem** em progressão aritmética.
- Exemplo: R$ 12.000 em 12 meses a 1% → amortização 1.000; 1ª parcela 1.120; 2ª 1.110; cai 10 por mês.
- Paga **menos juros no total** que o Price, mas a primeira parcela é maior. É o sistema mais usado no crédito imobiliário.

## Sequências
- **PA**: aₙ = a₁ + (n − 1)r; soma = (a₁ + aₙ)n ÷ 2. As parcelas do SAC formam uma PA.
- **PG**: aₙ = a₁ · qⁿ⁻¹; soma finita = a₁(qⁿ − 1) ÷ (q − 1). Os montantes de juros compostos formam uma PG.

## HP12C
O edital cita a calculadora financeira, mas **na prova não há calculadora**. Saber as teclas n, i, PV, PMT, FV ajuda a entender, mas treine as contas à mão.`,
 tarefa:'Monte à mão a tabela completa de um SAC de R$ 6.000 em 6 meses a 2% e de um Price de R$ 1.000 em 2 meses a 10%. Faça o quiz.',
 prova:'Quiz com 70% ou mais e, no resumo, a 1ª e a última parcela do seu SAC.', mat:MAT_LIVRO.mat},

{f:6, s:'ti', t:'Segurança da informação e golpes', q:[72,73,74,75,78], nq:[],
 aula:`## Pilares
- **Confidencialidade**: só quem tem autorização acessa.
- **Integridade**: a informação não é alterada indevidamente.
- **Disponibilidade**: acessível quando necessário.
- Complementos: **autenticidade** (garante a origem) e **não repúdio** (o autor não pode negar a autoria).

## Ameaças
- **Vírus**: precisa de um hospedeiro e de ação do usuário.
- **Worm**: se espalha sozinho pela rede.
- **Cavalo de Troia (trojan)**: parece útil, mas abre a porta para ataques.
- **Spyware** e **keylogger**: espionam e capturam o que é digitado.
- **Ransomware**: criptografa os dados e pede resgate.
- **Botnet**: rede de máquinas infectadas controladas remotamente.
- **Phishing** (e-mail), **smishing** (SMS), **vishing** (ligação): fraudes que imitam instituições.
- **Engenharia social**: manipula a pessoa, não a máquina. Base do golpe do falso funcionário e do falso suporte.

## Defesas
- **Antivírus**, **firewall** (filtra o tráfego da rede), atualizações do sistema.
- **Autenticação multifator (MFA)**: algo que você sabe (senha), tem (celular, token) e é (biometria).
- **Backup 3-2-1**: 3 cópias, 2 mídias, 1 fora do local. Backup completo, incremental (o que mudou desde o último backup) e diferencial (o que mudou desde o último completo).
- **Criptografia simétrica** (uma chave) e **assimétrica** (chave pública e privada). **Assinatura digital** usa a chave privada e garante autenticidade, integridade e não repúdio. **Certificado digital** (ICP-Brasil) vincula a chave a uma pessoa.
- **VPN**: túnel criptografado sobre a internet.
- **HTTPS** com cadeado: a conexão é criptografada, mas o site pode ser falso. Confira o endereço.

## Normas ISO
- **ISO/IEC 27001**: requisitos do **Sistema de Gestão de Segurança da Informação (SGSI)**. É **certificável**.
- **ISO/IEC 27002**: guia de **controles** de segurança (na versão de 2022, 93 controles em 4 temas: organizacionais, pessoas, físicos e tecnológicos).

## Golpes que você vai ver no balcão
Falso funcionário pedindo código ou senha, falsa central pedindo para instalar aplicativo de acesso remoto, "conta segura" para transferir o saldo, boleto adulterado, Pix para falso parente com número novo. Regra de ouro: **banco não pede senha, código nem transferência para proteger a conta**.`,
 tarefa:'Ative a autenticação em dois fatores no seu e-mail e no WhatsApp e explique para um familiar o golpe do falso funcionário. Faça o quiz e 10 questões de TI.',
 prova:'Quiz com 70% ou mais e, no resumo, a diferença entre vírus, worm e ransomware.', mat:MAT_LIVRO.ti},

{f:6, s:'ti', t:'Office, redes, nuvem, dados e IA', q:[76,77,86], nq:[
 {s:'ti',q:'A rede privada de uma empresa, que usa as mesmas tecnologias da internet mas é acessível apenas aos seus colaboradores, é chamada de',o:['extranet','intranet','WAN pública','deep web','rede peer-to-peer'],a:1,e:'Intranet é a rede interna com tecnologias da internet. Extranet é a extensão dela para parceiros externos autorizados.'}],
 aula:`## Pacote Office 365
- **Excel**: referências relativas (A1) e absolutas (**$A$1**, não muda ao copiar). Funções que caem: SOMA, MÉDIA, MÁXIMO, MÍNIMO, **SE**, **CONT.SE**, **SOMASE**, **PROCV** e PROCX (busca), CONCATENAR. Toda fórmula começa com "=". Separador de argumentos em português: **ponto e vírgula**.
- **Word**: estilos, sumário automático, controle de alterações, mala direta.
- **PowerPoint**: modo apresentador, transições e animações, slide mestre.
- **Outlook**: Para, **Cc** (cópia visível) e **Cco** (cópia oculta), regras, calendário compartilhado.
- **Teams, OneDrive e SharePoint**: colaboração e armazenamento na nuvem; ferramentas de trabalho remoto.

## Redes
- **Internet** (pública), **intranet** (interna, com tecnologias da internet) e **extranet** (intranet aberta a parceiros).
- Por alcance: **LAN** (local), **MAN** (cidade) e **WAN** (longa distância).
- Protocolos: **TCP/IP** (base da internet), **HTTP/HTTPS** (páginas), **DNS** (traduz nomes em endereços IP), **SMTP** (envio de e-mail), **POP3/IMAP** (recebimento).
- Meios de transmissão: cabo de par trançado, fibra óptica, Wi-Fi, 4G/5G.

## Navegadores
Edge e Firefox: navegação anônima (não guarda histórico local, mas não esconde você do provedor), cookies, cache, favoritos, extensões, bloqueador de pop-up.

## Nuvem
- **IaaS** (infraestrutura), **PaaS** (plataforma para desenvolver) e **SaaS** (software pronto).
- Nuvem **pública**, **privada** e **híbrida**.

## Dados e IA
- **Big data**: volume, velocidade, variedade, veracidade e valor.
- **Business intelligence e analytics**: transformar dados em decisão; sistemas de **suporte à decisão**.
- **Machine learning**: o sistema aprende padrões com dados. Supervisionado (com respostas certas para treinar, como detectar fraude) e não supervisionado (agrupa sem rótulos, como segmentar clientes).
- **IA generativa** (como o ChatGPT): cria texto, imagem e código a partir de **modelos de linguagem**. Riscos: **alucinação**, vieses e vazamento de dados. Nunca cole dados de clientes em ferramentas públicas.
- **Blockchain**: registro distribuído, encadeado e difícil de alterar. Base de criptoativos e de projetos como o Drex.
- **Ciência de dados**: estatística + programação + conhecimento do negócio.`,
 tarefa:'No Excel ou Google Planilhas, monte uma planilha com suas notas da faculdade usando MÉDIA, SE e uma referência absoluta. Faça o quiz e 10 questões de TI.',
 prova:'Quiz com 70% ou mais e, no resumo, a fórmula SE que você usou.', mat:MAT_LIVRO.ti},

{f:6, s:'cd', t:'Agilidade, design thinking, Scrum e OKR', q:[79,81,82,83], nq:[],
 aula:`## Manifesto Ágil (2001)
Quatro valores (os da esquerda valem mais):
- **Indivíduos e interações** mais que processos e ferramentas.
- **Software em funcionamento** mais que documentação abrangente.
- **Colaboração com o cliente** mais que negociação de contratos.
- **Responder a mudanças** mais que seguir um plano.
São 12 princípios, como entregas frequentes, simplicidade e times auto-organizados.

## Scrum
- **Papéis**: Product Owner (maximiza o valor e ordena o Product Backlog), Scrum Master (remove impedimentos e ensina Scrum) e Developers (constroem o incremento).
- **Eventos**: Sprint (até 1 mês), Sprint Planning, **Daily Scrum (15 minutos)**, Sprint Review (mostra o incremento) e Sprint Retrospective (melhora o processo).
- **Artefatos**: Product Backlog, Sprint Backlog e Incremento.

## Kanban e Lean
- **Kanban**: quadro visual (a fazer, fazendo, feito) e **limite de trabalho em progresso (WIP)**.
- **Lean**: eliminar desperdícios e entregar valor. **MVP** (produto mínimo viável) testa a ideia com o menor esforço.

## Design thinking
Abordagem centrada no usuário: **empatia → definição → ideação → prototipação → teste**. Errar cedo e barato.

## OKR
**Objectives and Key Results**: um objetivo qualitativo e inspirador, medido por 2 a 5 resultados-chave numéricos. Criado na Intel e popularizado pelo Google. Ciclos curtos (trimestrais). Exemplo: Objetivo "ser aprovado na CAIXA"; KRs: 80% de acerto em simulados, 2.000 questões até junho, nota 80 na redação.

## Intraempreendedorismo e resolução de problemas
**Intraempreendedor** age como dono dentro da empresa: propõe melhorias e assume riscos calculados. Para problemas complexos: definir bem o problema, buscar a causa raiz (5 porquês, Ishikawa), gerar alternativas e testar.

## Pensamento computacional
Quatro pilares: **decomposição** (quebrar o problema), **reconhecimento de padrões**, **abstração** (focar no essencial) e **algoritmos** (passo a passo).

## Análise de negócios
Entender necessidades, mapear processos e propor soluções que geram valor, ponte entre o negócio e a tecnologia.`,
 tarefa:'Escreva o seu OKR de estudos para os próximos 3 meses. Faça o quiz e 10 questões de Comportamentos Digitais.',
 prova:'Quiz com 70% ou mais e o seu OKR no resumo.', mat:'Livro de apoio: Essencialismo e Hábitos Atômicos (aba Livros).'},

{f:6, s:'cd', t:'Mindset, inteligência emocional, liderança e ODS', q:[80,84,85,87], nq:[],
 aula:`## Mindset de crescimento (Carol Dweck)
- **Mindset fixo**: acredita que talento é inato. Evita desafios, desiste diante de erros, sente-se ameaçado pelo sucesso alheio.
- **Mindset de crescimento**: habilidades se desenvolvem com **esforço, estratégia e feedback**. Erros são aprendizado.
A frase "ainda não sei" resume o mindset de crescimento.

## Aprender a aprender e autodesenvolvimento
Saber como você aprende melhor, buscar feedback, estudar com método (teste e revisão espaçada) e manter a **aprendizagem contínua** (lifelong learning). A tecnologia muda rápido; quem aprende rápido se mantém relevante.

## Inteligência emocional (Daniel Goleman)
- **Autoconsciência**: reconhecer as próprias emoções.
- **Autogestão** (autocontrole): lidar com elas.
- **Automotivação**.
- **Empatia**: perceber as emoções dos outros.
- **Habilidades sociais**: relacionar-se bem.
No atendimento, a inteligência emocional ajuda a lidar com o cliente irritado sem levar para o lado pessoal.

## Liderança e autoliderança
- **Liderança situacional**: o estilo muda conforme a maturidade do liderado (dirigir, orientar, apoiar, delegar).
- **Autoliderança**: definir metas, organizar a rotina e se motivar sem depender de cobrança externa. Este app é um exercício de autoliderança.

## Gestão do tempo
- **Matriz de Eisenhower**: urgente e importante (faça), importante e não urgente (agende), urgente e não importante (delegue), nenhum (elimine).
- **Pomodoro**: blocos de foco de 25 minutos com pausas.

## Trabalho a distância
Comunicação clara e por escrito, rotinas, limites entre vida pessoal e trabalho, segurança da informação em casa.

## Experiência do consumidor (CX)
Soma de todas as interações do cliente com a marca. **Omnichannel**: canais integrados, o cliente começa no app e termina na agência sem repetir nada. Indicador comum: **NPS**.

## Desenvolvimento sustentável
- **ODS**: 17 Objetivos de Desenvolvimento Sustentável da **Agenda 2030** da ONU (erradicação da pobreza, educação de qualidade, igualdade de gênero, trabalho decente, ação climática e outros).
- **Pacto Global**: iniciativa da ONU com **10 princípios** para empresas em 4 áreas: direitos humanos, trabalho, meio ambiente e anticorrupção.
- **ESG**: ambiental, social e governança.`,
 tarefa:'Classifique suas tarefas da semana na Matriz de Eisenhower. Faça o quiz e 10 questões de Comportamentos Digitais.',
 prova:'Quiz com 70% ou mais e, no resumo, os 5 componentes da inteligência emocional com um exemplo de atendimento.', mat:'Livros de apoio: Mindset e Inteligência Emocional (aba Livros).'},

 aula:`## O que a banca avalia
Cinco critérios do edital: **adequação ao tema**, **adequação ao tipo de texto**, **coesão**, **seleção e organização dos argumentos** e **domínio da norma-padrão**. Nota mínima: **70 de 100**.

## Estrutura que funciona (4 parágrafos)
**1. Introdução** (3 a 4 linhas): contextualize o tema e apresente a **tese** de forma clara.
**2. Desenvolvimento 1**: um argumento + explicação + exemplo ou dado.
**3. Desenvolvimento 2**: outro argumento, com a mesma estrutura.
**4. Conclusão**: retome a tese e feche com uma solução, consequência ou reflexão. A Cesgranrio **não exige** proposta de intervenção como o ENEM, mas uma solução bem pensada fortalece o texto.

## Tipos de argumento
- **Exemplificação**: um caso concreto.
- **Dados e números**: só se tiver certeza; números inventados prejudicam.
- **Causa e consequência**.
- **Comparação** (com outro país ou época).
- **Autoridade**: citação de especialista ou instituição.
- **Contra-argumentação**: apresentar a objeção e responder a ela.

## Coesão
Use conectivos variados entre parágrafos e frases: "Em primeiro lugar", "Além disso", "Por outro lado", "Nesse sentido", "Dessa forma", "Portanto". Evite repetir a mesma palavra: use sinônimos e pronomes.

## Erros que mais tiram pontos
- Fugir do recorte do tema (falar de bancos em geral quando o tema é golpes digitais em idosos).
- Frases longas demais e sem pontuação.
- Vírgula entre sujeito e verbo.
- Informalidade ("a gente", "tipo", "né"), gírias e abreviações.
- Primeira pessoa em excesso. Prefira a impessoalidade.
- Título, se não for pedido, e qualquer marca de identificação.

## Temas prováveis
Inclusão financeira, golpes digitais, endividamento, educação financeira, IA no atendimento, acessibilidade, proteção de dados, habitação, sustentabilidade. Para cada um, prepare 2 argumentos e 1 repertório (dado, lei ou exemplo).

## Treino
Escreva 1 redação por semana a partir de agora, com cronômetro de 60 minutos, e corrija com a IA do app pelos critérios do edital.`,

{f:7, s:'en', t:'Inglês: gramática para leitura e vocabulário bancário', q:[14,15], nq:[
 {s:'en',q:'Read: "The bank was fined after a data breach exposed thousands of customer records." The word "fined" means that the bank',o:['was praised','was penalized with a fine (multa)','was closed permanently','was finished','received a loan'],a:1,e:'"To fine" é multar. "Data breach" é vazamento de dados. A frase diz que o banco foi multado depois do vazamento.'}],
 aula:`## Tempos verbais que mais aparecem
- **Simple present**: fatos e rotinas (*Banks offer loans*).
- **Simple past**: ação concluída com tempo definido (*The bank launched an app last year*). Regulares terminam em *-ed*.
- **Present perfect** (*has/have + particípio*): passado sem tempo definido ou que chega ao presente (*Pix has changed payments*).
- **Future**: *will* e *going to*.
- **Passive voice** (*be + particípio*): *Loans are granted to...*, *The rate was raised*. Muito comum em textos de economia.

## Modais
- *can* (capacidade, possibilidade) · *may/might* (possibilidade)
- *must* (obrigação forte, dedução) · *should* (conselho)
- *have to* (obrigação externa) · *would* (hipótese)

## Comparativos e superlativos
*cheaper than* (mais barato que), *more secure than*, *the most popular*, *the largest*. *Less* = menos.

## Pronomes relativos
*who* (pessoas), *which* (coisas), *that* (ambos), *whose* (posse), *where* (lugar).

## Vocabulário bancário
- *loan* empréstimo · *mortgage* financiamento imobiliário · *interest rate* taxa de juros
- *savings account* poupança · *checking account* conta corrente · *overdraft* cheque especial
- *fee* tarifa · *fine* multa · *debt* dívida · *income* renda · *outstanding balance* saldo devedor
- *statement* extrato · *wire transfer* transferência · *withdrawal* saque · *deposit* depósito
- *stock/share* ação · *bond* título de dívida · *yield* rendimento
- *fraud, scam* golpe · *breach* violação, vazamento · *compliance* conformidade
- *customer* cliente · *branch* agência · *teller* caixa (pessoa) · *ATM* caixa eletrônico

## Dica final
Na dúvida, escolha a alternativa que está **no texto** com outras palavras. Alternativas que trazem informação nova costumam estar erradas.`,
 tarefa:'Transforme o vocabulário da aula em flashcards (aba Inglês → Transformar em flashcards) e leia 3 notícias de economia em inglês. Faça o quiz.',
 prova:'Quiz com 70% ou mais e, no resumo, 10 palavras do vocabulário bancário com tradução.', mat:MAT_LIVRO.ing},

{f:7, s:'geral', t:'Simulado completo 1 e caderno de erros', q:'mix', nq:[],
 aula:`## Por que simular
O simulado treina o que a aula não treina: **gestão do tempo**, resistência e decisão sob pressão. Faça em condições reais: sem celular, sem consulta, em um bloco só.

## Como fazer
- Aba **Simulado → Completo** (60 questões, 3h30).
- Marque as respostas na folha de rascunho também, como na prova real.
- Não pare para estudar durante o simulado.

## Gestão do tempo na prova real (5 horas)
- **Objetivas**: cerca de 3 horas a 3h30 (média de 3 minutos por questão).
- **Redação**: 1 hora (rascunho e versão final).
- **Gabarito**: 20 minutos no final para transcrever com calma.
- Ordem sugerida: comece pelas matérias que você domina para ganhar confiança e tempo; deixe as contas mais longas para o fim.

## Análise de erros (a parte mais importante)
Para cada questão errada, classifique:
- **Não sabia o conteúdo** → volte à aula do módulo.
- **Sabia, mas errei por desatenção** → treine leitura do comando (palavras como EXCETO, INCORRETA, NÃO).
- **Faltou tempo** → treine velocidade nessa matéria.
- **Chutei e errei** → estude o tema.
Toda questão errada vira flashcard com a regra certa.

## Chute consciente
A Cesgranrio **não desconta** pontos por erro. Nunca deixe questão em branco. Elimine as alternativas absurdas e escolha entre as que sobram.`,
 tarefa:'Faça o simulado completo, classifique todos os erros e crie flashcards para eles. Faça o quiz de revisão.',
 prova:'Quiz com 70% ou mais e, no resumo, sua nota no simulado e a matéria com mais erros.', mat:'Use a aba Simulado e a aba Flashcards.'},

{f:7, s:'geral', t:'Simulado completo 2 e plano para o dia da prova', q:'mix', nq:[],
 aula:`## Segundo simulado
Repita o simulado completo e compare com o primeiro. Se a nota subiu nas matérias que você revisou, o método está funcionando. Se não, mude a forma de estudar essa matéria (mais questões, menos leitura).

## Quando o edital sair
- Leia o edital **inteiro** e compare o conteúdo com esta trilha. Marque o que mudou.
- Confira número de vagas, cadastro de reserva, polo de lotação, data, horário e documentos.
- Ajuste a data da prova na aba Edital para a contagem regressiva.
- Nas semanas finais: **só revisão e questões**. Nada de conteúdo novo pesado.

## Semana da prova
- Revise flashcards e o caderno de erros.
- Faça 1 simulado curto no máximo até 3 dias antes.
- Durma bem nas 3 noites anteriores.
- Visite o local da prova ou veja o trajeto e o tempo de deslocamento.

## Dia da prova
- Documento oficial com foto e **caneta esferográfica preta de material transparente**.
- Chegue com folga; os portões fecham no horário.
- Leia o comando de cada questão até o fim.
- Redação a caneta, sem nenhuma marca de identificação.
- Confira o gabarito antes de entregar.

## Depois da prova
Confira o gabarito preliminar, avalie recursos e continue estudando de leve até o resultado. Se o concurso tiver nova fase ou outro edital próximo, você já está pronto.

## Daqui em diante
Ao terminar a trilha, o app continua: missões diárias de revisão, questões novas geradas pela IA, redação semanal e simulados quinzenais até a prova.`,
 tarefa:'Faça o segundo simulado completo, compare com o primeiro e escreva o seu plano do dia da prova. Faça o quiz de revisão.',
 prova:'Quiz com 70% ou mais e, no resumo, a nota dos dois simulados e o seu plano para o dia da prova.', mat:'Use a aba Simulado e a aba Edital.'}
);

APO[1] = `## 1. Para que serve o Sistema Financeiro Nacional
O SFN liga quem tem dinheiro sobrando (poupadores, chamados de agentes superavitários) a quem precisa de dinheiro (tomadores, os agentes deficitários). Os bancos fazem essa ponte: captam depósitos e emprestam. Esse papel se chama **intermediação financeira**, e o ganho do banco vem do **spread**, que é a diferença entre o juro cobrado no empréstimo e o juro pago na captação.
A base legal é a **Lei 4.595/1964**, que criou o Conselho Monetário Nacional e transformou a antiga Sumoc no Banco Central. A Constituição trata do SFN no art. 192.

## 2. As três camadas
**Órgãos normativos:** fazem as regras e não fiscalizam ninguém diretamente.
- **CMN (Conselho Monetário Nacional):** órgão máximo do SFN. É formado pelo Ministro da Fazenda, que o preside, pelo Ministro do Planejamento e Orçamento e pelo Presidente do Banco Central. Define a meta de inflação, as diretrizes da política monetária, cambial e de crédito, e publica **Resoluções**.
- **CNSP (Conselho Nacional de Seguros Privados):** regras de seguros, capitalização e previdência aberta.
- **CNPC (Conselho Nacional de Previdência Complementar):** regras dos fundos de pensão, que formam a previdência fechada.
**Supervisores:** fiscalizam e também editam normas operacionais.
- **Banco Central (BC):** autarquia federal com autonomia (LC 179/2021). Diretores têm mandato de 4 anos, não coincidente com o do Presidente da República. O BC fiscaliza bancos e outras instituições financeiras, executa a política monetária, emite a moeda, administra as reservas internacionais e é o "banco dos bancos", com redesconto e depósito compulsório. Publica **Circulares** e, junto com o CMN, Resoluções BCB.
- **CVM (Comissão de Valores Mobiliários):** autarquia criada pela Lei 6.385/1976. Fiscaliza o mercado de **valores mobiliários**, como ações, debêntures, fundos de investimento e a bolsa.
- **Susep:** fiscaliza seguradoras, empresas de capitalização, resseguradoras e previdência aberta (PGBL e VGBL).
- **Previc:** fiscaliza as entidades fechadas de previdência complementar, os fundos de pensão.
**Operadores:** fazem as operações com o público. São bancos comerciais e múltiplos, Caixa Econômica Federal, cooperativas de crédito, corretoras e distribuidoras, bolsa (B3), seguradoras, administradoras de consórcio, instituições de pagamento e fintechs.

## 3. Quem é quem entre os bancos
- **Banco comercial:** capta depósito à vista (conta corrente) e faz empréstimos de curto e médio prazo.
- **Banco múltiplo:** tem ao menos duas carteiras, sendo uma delas comercial ou de investimento. A maioria dos grandes bancos é múltiplo.
- **Banco de investimento:** não capta depósito à vista. Trabalha com capital de giro, financiamento de longo prazo e mercado de capitais.
- **Banco de desenvolvimento:** financia projetos de longo prazo. O **BNDES** é empresa pública federal.
- **Caixa Econômica Federal:** **empresa pública federal**, com capital 100% da União e vinculada ao Ministério da Fazenda. Além do papel de banco, é agente operador do **FGTS**, paga benefícios sociais (Bolsa Família, seguro-desemprego, abono), opera as Loterias e é a maior financiadora de habitação do país.
- **Banco do Brasil:** sociedade de economia mista, com ações na bolsa e controle da União.
- **Cooperativas de crédito:** os donos são os próprios associados. Os depósitos têm a proteção do FGCoop.

## 4. Moeda, crédito e o efeito multiplicador
Quando o banco empresta parte dos depósitos, esse dinheiro volta ao sistema como novo depósito e é emprestado de novo. É assim que os bancos "criam" moeda escritural. O BC controla esse efeito com o **depósito compulsório**: quanto maior o compulsório, menos dinheiro sobra para emprestar.

## 5. Pegadinhas da Cesgranrio
- O CMN **não** fiscaliza e não tem funcionários próprios. A fiscalização cabe ao BC, à CVM, à Susep e à Previc.
- Ações e debêntures ficam com a **CVM**, e não com o BC.
- PGBL e VGBL ficam com a **Susep**. Fundo de pensão de empresa fica com a **Previc**.
- A CAIXA é **empresa pública**, e não sociedade de economia mista. Quem é de economia mista é o Banco do Brasil.
- O Copom é um comitê **do Banco Central** e não faz parte do CMN.
- Quem fixa a meta de inflação é o **CMN**. Quem persegue a meta, mexendo na Selic, é o **Copom**.

## 6. Como revisar
Desenhe as três camadas numa folha e coloque cada órgão no lugar sem olhar. Depois responda em voz alta: quem fiscaliza um consórcio? Resposta: o Banco Central. E uma corretora que vende ações? A CVM fiscaliza o mercado de valores mobiliários, e o BC também autoriza e supervisiona a corretora como instituição.`;

APO[2] = `## 1. Porcentagem é fração de 100
Dizer 15% é o mesmo que 15/100, ou 0,15. Para achar 15% de 240, faça 0,15 × 240 = 36. Na prova não há calculadora, então decomponha: 10% de 240 é 24, 5% é metade disso, 12, e 24 + 12 = 36.

## 2. O método dos fatores
Esse é o truque mais útil da matéria.
- Aumento de x%: multiplique por (1 + x/100). Um aumento de 20% vira **× 1,20**.
- Desconto de x%: multiplique por (1 − x/100). Um desconto de 30% vira **× 0,70**.
- Aumentos e descontos sucessivos: **multiplique os fatores**.
Exemplo: um produto sobe 20% e depois cai 20%. O fator total é 1,20 × 0,80 = 0,96. O preço final é 96% do inicial, ou seja, caiu 4%. A Cesgranrio adora essa pegadinha, porque a intuição diz que "voltou ao mesmo preço".
Exemplo 2: dois aumentos seguidos de 10% dão 1,1 × 1,1 = 1,21, o que é 21% de aumento, e não 20%.

## 3. Variação percentual
Variação = (valor final − valor inicial) ÷ valor inicial.
Se a tarifa passou de R$ 40 para R$ 50, a variação é 10/40 = 25%. Se voltar de R$ 50 para R$ 40, a queda é 10/50 = 20%. A base muda, e por isso a porcentagem muda também.

## 4. Lucro sobre custo e sobre venda
- Lucro de 25% **sobre o custo**: venda = custo × 1,25.
- Lucro de 25% **sobre a venda**: custo = venda × 0,75, então venda = custo ÷ 0,75.
Leia com atenção qual é a base que o enunciado usa.

## 5. Juros simples
No regime simples, o juro de cada período é calculado sempre sobre o **capital inicial**.
- **J = C × i × t**
- **M = C + J = C × (1 + i × t)**
C é o capital, i é a taxa na forma decimal, t é o tempo, e **taxa e tempo precisam estar na mesma unidade**.
Exemplo: R$ 2.000 a 3% ao mês por 5 meses. J = 2.000 × 0,03 × 5 = 300, e M = 2.300.

## 6. Taxas proporcionais
No regime simples, as taxas são proporcionais ao tempo. 2% ao mês equivale a 24% ao ano, e 36% ao ano equivale a 3% ao mês. Isso **não** vale nos juros compostos, assunto do módulo 6.
Juro comercial usa ano de 360 dias e mês de 30 dias. Juro exato usa o calendário real, com 365 dias. Se a questão não disser nada, use o comercial.

## 7. Questões típicas e como resolver
- **"Em quanto tempo o capital dobra a 5% a.m. simples?"** Dobrar significa J = C. Então C = C × 0,05 × t, e t = 20 meses.
- **"Qual a taxa que transforma 800 em 1.000 em 10 meses?"** J = 200 = 800 × i × 10, logo i = 2,5% a.m.
- **"Descontos de 10% e 5% equivalem a um desconto único de quanto?"** 0,90 × 0,95 = 0,855, ou seja, 14,5%.

## 8. Pegadinhas
- Somar porcentagens sucessivas em vez de multiplicar fatores.
- Esquecer de converter a taxa anual para mensal, ou o contrário.
- Calcular a variação percentual sobre o valor final em vez do inicial.

## 9. Treino de cabeça
Calcule de cabeça: 12% de 350 (42); 35% de 80 (28); 1,5% de 2.000 (30). Repita até ficar automático. Isso economiza minutos na prova.`;

APO[3] = `## 1. Compreender e interpretar não são a mesma coisa
- **Compreensão:** o que o texto diz de forma explícita. A resposta está escrita, às vezes com outras palavras.
- **Interpretação:** o que se pode **concluir** do texto, as inferências. A resposta não está escrita, mas decorre logicamente do que está.
A Cesgranrio costuma usar comandos como "de acordo com o texto" (compreensão) e "infere-se do texto" ou "o texto sugere" (interpretação).

## 2. Os três erros que derrubam candidatos
- **Extrapolação:** a alternativa vai além do que o texto permite. Exemplo: o texto diz que "muitos clientes preferem o aplicativo", e a alternativa afirma que "a agência física vai acabar".
- **Redução:** a alternativa pega uma parte e trata como o todo. Exemplo: o texto discute vantagens e riscos do Pix, e a alternativa diz que o texto "condena o Pix".
- **Contradição:** a alternativa diz o oposto do texto, muitas vezes com uma palavra trocada, como "sempre" no lugar de "às vezes".
Desconfie de alternativas com palavras absolutas: **sempre, nunca, todos, nenhum, somente, exclusivamente**.

## 3. Método de leitura
1. Leia o título e o primeiro parágrafo. Eles costumam trazer a tese.
2. Leia o texto inteiro uma vez sem marcar nada, só para entender.
3. Leia as perguntas.
4. Volte ao texto e sublinhe o trecho que responde a cada pergunta.
5. Elimine alternativas pelos três erros acima antes de escolher.

## 4. Coesão: como o texto se amarra
**Coesão referencial** é a retomada de termos.
- **Anáfora:** retoma algo que já apareceu. "O banco lançou o aplicativo. **Ele** já tem 2 milhões de usuários."
- **Catáfora:** antecipa algo que vem depois. "O motivo era **este**: a taxa caiu."
- Pronomes relativos como **que, o qual, cujo e onde** também retomam termos. "Onde" só pode se referir a lugar.
A pergunta clássica é "o pronome X refere-se a...". Substitua o pronome pelo candidato e veja se a frase mantém o sentido.
**Coesão sequencial** é feita pelos conectivos. Memorize os grupos:
- **Adição:** e, além disso, também, não só... mas também.
- **Oposição (adversativos):** mas, porém, contudo, todavia, entretanto, no entanto.
- **Concessão:** embora, ainda que, mesmo que, apesar de. Pede verbo no subjuntivo: "Embora **seja** caro...".
- **Causa:** porque, já que, visto que, uma vez que.
- **Conclusão:** logo, portanto, por isso, assim, por conseguinte.
- **Condição:** se, caso, desde que, contanto que.
- **Finalidade:** para que, a fim de que.
- **Explicação:** pois (antes do verbo), porque, que.
Questão típica: "a substituição de **porém** por **embora** mantém o sentido?" Mantém a ideia de contraste, mas exige reescrever a frase com subjuntivo. Se a alternativa não reescreve, está errada.

## 5. Coerência
Um texto coerente não se contradiz e faz sentido no mundo real. Uma frase pode ter coesão perfeita e ainda ser incoerente: "Choveu muito, portanto as ruas ficaram secas".

## 6. Tipos e gêneros
A Cesgranrio usa muito texto **dissertativo-argumentativo** (artigo de opinião, crônica reflexiva) e **expositivo** (reportagem). Saiba reconhecer:
- **Tese:** a opinião central.
- **Argumentos:** dados, exemplos, comparações, citações de autoridade.
- **Conclusão:** retomada da tese ou proposta.

## 7. Treino
Pegue um editorial de jornal. Escreva em uma linha a tese, sublinhe três conectivos e diga a relação que cada um estabelece, e circule dois pronomes dizendo a que eles se referem. Faça isso três vezes na semana.`;

APO[4] = `## 1. O que é política monetária
É o controle da quantidade de dinheiro na economia e do preço do dinheiro, que são os juros, com um objetivo principal: **manter a inflação na meta**. Quem executa é o **Banco Central**.

## 2. Meta de inflação
O regime de metas existe desde 1999. O **CMN define a meta** e o BC persegue essa meta. O índice usado é o **IPCA**, calculado pelo IBGE.
Desde 2025 vale a **meta contínua**: centro de 3% com tolerância de 1,5 ponto percentual para cima ou para baixo. Considera-se que a meta foi descumprida quando a inflação acumulada em 12 meses fica fora do intervalo por **seis meses seguidos**. Nesse caso, o presidente do BC precisa publicar uma nota explicando os motivos e as providências.

## 3. Copom e Selic
O **Copom (Comitê de Política Monetária)** é formado pela Diretoria Colegiada do BC, ou seja, o presidente e os oito diretores. Ele se reúne **8 vezes por ano**, em reuniões de dois dias, e define a **meta da taxa Selic**. A ata é publicada na semana seguinte.
- **Selic meta:** a taxa decidida pelo Copom.
- **Selic over (efetiva):** a média dos juros das operações de um dia com títulos públicos, que o BC mantém perto da meta.
A Selic é a **taxa básica de juros** da economia e serve de referência para todas as outras.

## 4. Os instrumentos do BC
- **Open market (mercado aberto):** compra e venda de títulos públicos, normalmente por operações compromissadas. É o instrumento mais usado no dia a dia. Quando o BC **vende** títulos, ele recolhe dinheiro e a liquidez diminui. Quando **compra**, injeta dinheiro.
- **Depósito compulsório:** parte dos depósitos que os bancos são obrigados a deixar no BC. Se o compulsório aumenta, sobra menos para emprestar.
- **Redesconto:** empréstimo do BC aos bancos para cobrir falta de caixa. Encarecer o redesconto desestimula esse uso.

## 5. Política contracionista e expansionista
**Contracionista (restritiva)** serve para combater a inflação:
- sobe a Selic;
- aumenta o compulsório;
- vende títulos no open market;
- encarece o redesconto.
O efeito é crédito mais caro, menos consumo, preços sob controle e atividade mais fraca.
**Expansionista** serve para estimular a economia: faz o contrário de tudo isso.

## 6. Como os juros chegam ao seu bolso
Quando a Selic sobe, sobe o custo de captação dos bancos, e por isso sobem os juros de empréstimos e financiamentos. As aplicações de renda fixa pós-fixadas, como CDB e Tesouro Selic, passam a render mais. O real tende a se valorizar, porque o capital estrangeiro procura juros altos.

## 7. Outras políticas que caem junto
- **Política fiscal:** gastos e tributos do governo, conduzida pelo Ministério da Fazenda.
- **Política cambial:** regime de câmbio flutuante, com intervenções do BC por meio de swaps cambiais e venda de reservas.
- **Política de crédito:** direcionamento do crédito, como o crédito rural e o imobiliário.

## 8. Pegadinhas
- Quem fixa a meta é o **CMN**. O Copom fixa a **Selic**.
- Vender título público **retira** dinheiro de circulação.
- A Selic não é a taxa do cheque especial nem do cartão. É a referência básica.
- O IPCA mede a inflação oficial. O IGP-M é outro índice, usado em aluguéis.`;

APO[5] = `## 1. Juros sobre juros
No regime composto, o juro de cada período entra no saldo e passa a render no período seguinte.
- **M = C × (1 + i)^n**
- **J = M − C**
Exemplo: R$ 1.000 a 10% ao mês por 3 meses. M = 1.000 × 1,1³ = 1.000 × 1,331 = 1.331.
No simples, o mesmo caso daria 1.300. A diferença cresce com o tempo.

## 2. Potências que a prova costuma dar
A Cesgranrio costuma fornecer uma tabela de potências. Mesmo assim, saiba de cabeça:
- 1,1² = 1,21; 1,1³ = 1,331; 1,1⁴ = 1,4641
- 1,2² = 1,44; 1,2³ = 1,728
- 1,05² = 1,1025
- 1,01¹² ≈ 1,1268
- 1,02² = 1,0404

## 3. Taxas equivalentes
Duas taxas são equivalentes quando, aplicadas ao mesmo capital no mesmo prazo, geram o mesmo montante. No regime composto, elas **não** são proporcionais.
- **(1 + i_anual) = (1 + i_mensal)^12**
Exemplo: 1% ao mês equivale a 1,01¹² − 1 ≈ 12,68% ao ano, e não 12%.
Para ir da taxa anual para a mensal, tire a raiz: 21% ao ano equivale a 10% ao semestre, porque 1,1² = 1,21.

## 4. Taxa nominal e taxa efetiva
- **Nominal:** o período da taxa é diferente do período de capitalização. Exemplo: "24% ao ano, capitalizados mensalmente".
- Para converter, faça a **divisão proporcional**: 24% ÷ 12 = **2% ao mês**, que é a taxa efetiva mensal.
- A **efetiva anual** é 1,02¹² − 1 ≈ 26,82%.
É a pergunta mais cobrada do tema: a nominal se divide proporcionalmente, e a efetiva se compõe.

## 5. Taxa real e taxa aparente
A taxa aparente é a que você vê no contrato. A taxa real desconta a inflação.
- **(1 + aparente) = (1 + real) × (1 + inflação)**
Exemplo: uma aplicação rendeu 10% com inflação de 4%. 1,10 ÷ 1,04 ≈ 1,0577, então o ganho real foi de cerca de 5,77%, e não 6%.

## 6. Valor presente
Trazer um valor futuro para hoje: **C = M ÷ (1 + i)^n**.
Exemplo: quanto aplicar hoje, a 10% ao mês, para ter 1.331 em 3 meses? 1.331 ÷ 1,331 = 1.000.
Esse raciocínio é a base dos descontos compostos e das séries de pagamentos, que você vê no módulo 24.

## 7. Comparar simples e composto
- Em **menos de 1 período**, o simples rende mais.
- Em **exatamente 1 período**, os dois são iguais.
- Em **mais de 1 período**, o composto rende mais.
A Cesgranrio já cobrou exatamente essa comparação.

## 8. Pegadinhas
- Converter taxa composta dividindo por 12.
- Esquecer que a taxa nominal precisa ser transformada em efetiva antes de usar na fórmula.
- Subtrair a inflação da taxa aparente em vez de dividir os fatores.`;

APO[6] = `## 1. Concordância verbal: a regra geral
O verbo concorda com o sujeito em número e pessoa. Parece simples, mas a prova coloca o sujeito **depois** do verbo ou longe dele para confundir.
"**Faltam** dois documentos." O sujeito é "dois documentos", que está no plural.
"**Chegaram**, ontem à tarde, as novas normas do Banco Central."
Dica: pergunte "o que falta?" ou "o que chegou?" e ponha a resposta antes do verbo.

## 2. Sujeito composto
- **Antes do verbo:** verbo no plural. "O gerente e o caixa **atenderam**."
- **Depois do verbo:** plural ou concordância com o mais próximo. "**Atendeu** o gerente e o caixa" também é aceito.
- Núcleos ligados por **ou**: plural se houver soma, singular se houver exclusão. "Pedro ou Paulo **será** o novo gerente."
- Núcleos ligados por **com**: normalmente plural. "O diretor com os assessores **chegaram**."

## 3. Verbos impessoais: ficam no singular
- **Haver** no sentido de existir ou de tempo decorrido: "**Havia** muitas filas." "**Há** dez anos." E o auxiliar acompanha: "**Deve haver** problemas", nunca "devem haver".
- **Fazer** indicando tempo: "**Faz** dois anos que ele trabalha aqui."
- Verbos de fenômeno da natureza: "Choveu muito."
Já **existir**, **ocorrer** e **acontecer** têm sujeito e vão para o plural: "**Existem** muitas filas."

## 4. O pronome SE
- **Partícula apassivadora** (verbo transitivo direto): o verbo concorda com o sujeito. "**Vendem-se** casas" significa "casas são vendidas".
- **Índice de indeterminação do sujeito** (verbo com preposição): o verbo fica no singular. "**Precisa-se** de funcionários." "**Trata-se** de normas novas."
Essa é uma das questões mais cobradas pela Cesgranrio.

## 5. Casos especiais
- **Um dos que:** o verbo vai para o plural. "Ele é um dos que mais **vendem**."
- **Porcentagem:** concorda com o número ou com o termo depois dele. "30% dos clientes **usam** o app." "1% da população **votou**."
- **Coletivo:** singular. "A equipe **chegou**." Com especificador no plural, aceita os dois: "A maioria dos clientes **preferiu** (ou **preferiram**)".
- **Quem:** verbo na 3ª pessoa do singular ou concordando com o antecedente. "Fui eu quem **resolveu**" ou "Fui eu que **resolvi**".
- **Ser:** concorda muitas vezes com o predicativo. "Tudo **são** flores." "Hoje **são** 10 de maio."

## 6. Concordância nominal
O adjetivo concorda com o substantivo.
- **Anexo, incluso, obrigado, mesmo, próprio, quite:** variam. "Seguem **anexas** as planilhas." "Elas **mesmas** assinaram." "**Obrigada**", diz a mulher.
- **Meio:** como advérbio (= um pouco), não varia: "Ela está **meio** cansada". Como numeral, varia: "**meia** hora".
- **Bastante:** como adjetivo (= suficiente), varia: "provas **bastantes**". Como advérbio, não varia: "estudaram **bastante**".
- **É proibido, é necessário, é bom:** sem artigo, ficam invariáveis. "É **proibido** entrada." Com artigo, concordam: "É **proibida** a entrada."
- **Menos** e **alerta** nunca variam: "**menos** pessoas".
- Um adjetivo para vários substantivos: depois deles, concorda com o mais próximo ou vai para o plural: "relatório e planilha **corrigida/corrigidos**".

## 7. Treino
Corrija: "Devem haver soluções." (Deve haver.) "Precisam-se de caixas." (Precisa-se.) "Aluga-se salas." (Alugam-se.) "Seguem anexo os documentos." (anexos.) "Ela ficou meia preocupada." (meio.)`;

APO[8] = `## 1. Capacidade civil: quem pode abrir conta sozinho

APO[10] = `## 1. Tipos de variáveis
- **Qualitativas:** categorias. Podem ser nominais (cor, estado) ou ordinais (escolaridade, classificação).
- **Quantitativas:** números. Podem ser discretas (número de filhos, de clientes) ou contínuas (altura, saldo, tempo).

## 2. Medidas de posição
- **Média aritmética:** soma dos valores dividida pela quantidade. Exemplo: 4, 6, 8, 10 → 28/4 = 7.
- **Média ponderada:** cada valor vezes o seu peso, dividido pela soma dos pesos. Notas 6 (peso 2) e 9 (peso 1): (12 + 9)/3 = 7.
- **Mediana:** o valor do meio com os dados **em ordem**. Com quantidade par, é a média dos dois centrais. Em 3, 5, 7, 20 a mediana é (5 + 7)/2 = 6.
- **Moda:** o valor que mais aparece. Pode não existir, ou haver mais de uma (bimodal).
A mediana não é afetada por valores extremos, e a média é. Se um cliente tem saldo de R$ 1 milhão e os outros têm R$ 1 mil, a média engana.

## 3. Medidas de dispersão
- **Amplitude:** maior valor menos o menor.
- **Variância:** média dos quadrados dos desvios em relação à média.
- **Desvio padrão:** raiz quadrada da variância, na mesma unidade dos dados.
- **Coeficiente de variação (CV):** desvio padrão dividido pela média. Serve para comparar a dispersão de grupos com médias diferentes. Quanto menor o CV, mais homogêneo o grupo.
Exemplo de cálculo: dados 2, 4, 6. Média 4. Desvios −2, 0, 2. Quadrados 4, 0, 4. Variância populacional = 8/3 ≈ 2,67. Desvio padrão ≈ 1,63.
Na **variância amostral**, divide-se por n − 1 em vez de n.

## 4. Propriedades que a Cesgranrio adora
- **Somar uma constante** a todos os valores: a média aumenta essa constante, e o desvio padrão e a variância **não mudam**.
- **Multiplicar** todos os valores por k: a média e o desvio padrão são multiplicados por k, e a variância por **k²**.
- A soma dos desvios em relação à média é sempre **zero**.
Exemplo: todos os salários recebem R$ 200 a mais. A média sobe R$ 200 e o desvio padrão fica igual. Se recebem 10% a mais, a média e o desvio padrão sobem 10%, e a variância sobe 21%.

## 5. Quartis, percentis e boxplot
- **Q1:** 25% dos dados estão abaixo. **Q2:** é a mediana. **Q3:** 75% estão abaixo.
- **Amplitude interquartil:** Q3 − Q1.
- O **boxplot** mostra a mediana, os quartis e os valores atípicos (outliers).

## 6. Tabelas e gráficos
- **Frequência absoluta:** quantas vezes aparece. **Relativa:** a porcentagem do total. **Acumulada:** soma até aquela classe.
- **Histograma:** dados contínuos agrupados em classes. **Barras:** categorias. **Setores (pizza):** partes de um todo. **Linha:** evolução no tempo.
- Na tabela de classes, o **ponto médio** representa a classe no cálculo da média.

## 7. Treino
Para os dados 3, 3, 5, 7, 12: média 6, mediana 5, moda 3, amplitude 9. Agora some 10 a cada valor e diga o que muda: média 16, mediana 15, moda 13, amplitude 9 e desvio padrão iguais.`;

APO[11] = `## 1. Crase: a regra que resolve quase tudo
Crase é a junção da **preposição a** com o **artigo a** (ou com o "a" de aquele, aquela, aquilo, a qual).
**Teste da troca:** troque a palavra feminina por uma masculina. Se aparecer **ao**, tem crase.
"Fui à agência" → "Fui ao banco". Tem crase.
"Comprei a máquina" → "Comprei o carro". Não tem.
Outro teste, para lugares: "Vou **a** Curitiba, volto **de** Curitiba" (sem crase). "Vou **à** Bahia, volto **da** Bahia" (com crase).

## 2. Crase obrigatória
- Locuções femininas: **à noite, às vezes, à vista, à medida que, à custa de, às pressas**.
- Horas determinadas: "às 14h", "das 9h às 18h".
- "À moda de", mesmo subentendido: "bife à (moda) milanesa".

## 3. Crase proibida
- Antes de **palavra masculina**: "pagamento a prazo".
- Antes de **verbo**: "começou a estudar".
- Antes de pronomes pessoais, de tratamento (exceto senhora e senhorita) e da maioria dos indefinidos: "a ela", "a Vossa Senhoria", "a qualquer pessoa".
- Antes de "uma" com sentido de numeral indefinido: "chegou a uma conclusão".
- Entre palavras repetidas: "cara a cara", "gota a gota".
- "A" no singular antes de palavra no plural: "falou a pessoas".
- "Casa" sem determinante (a própria casa) e "terra" como oposto de bordo.

## 4. Crase facultativa
- Antes de **pronome possessivo feminino** no singular: "à minha gerente" ou "a minha gerente".
- Antes de **nome próprio feminino** de pessoa: "Entreguei à Ana" ou "a Ana".
- Depois de **até**: "até à agência" ou "até a agência".

## 5. Regência verbal: os verbos que caem
- **Assistir:** no sentido de ver, pede "a": "assistiu **ao** vídeo". No sentido de ajudar, é direto: "o gerente assistiu o cliente".
- **Aspirar:** desejar pede "a" ("aspira **ao** cargo"). Respirar é direto.
- **Visar:** objetivar pede "a" ("visa **ao** lucro", embora o uso sem preposição seja aceito por muitos gramáticos). Mirar ou dar visto é direto.
- **Obedecer, desobedecer:** pedem "a": "obedecer **às** normas".
- **Preferir:** "preferir uma coisa **a** outra". Nunca "do que" nem "mais".
- **Implicar** (acarretar): direto. "A mudança implica custos", e não "implica em custos".
- **Chegar, ir:** pedem "a": "chegou **ao** trabalho", e não "no trabalho".
- **Pagar e perdoar:** direto para a coisa e com "a" para a pessoa. "Pagou a dívida **ao** banco."
- **Informar, avisar, comunicar:** "informar algo **a** alguém" ou "informar alguém **de** algo".
- **Esquecer, lembrar:** sem pronome, são diretos ("esqueci a senha"). Com pronome, pedem "de" ("esqueci-**me da** senha").
- **Proceder** (realizar): pede "a": "procedeu **à** análise".

## 6. Regência nominal
- **Acessível a, apto a/para, compatível com, favorável a, prejudicial a, responsável por, residente em, situado em**.

## 7. Colocação pronominal
**Próclise (pronome antes do verbo)** é obrigatória com palavras atrativas:
- negativas: **não, nunca, jamais, ninguém** → "Não **me** avisaram";
- pronomes relativos: "o cliente que **me** atendeu";
- conjunções subordinativas: "quando **se** trata de";
- advérbios sem vírgula: "aqui **se** trabalha";
- pronomes indefinidos: "tudo **se** resolve".
**Ênclise (depois do verbo)**: no início de frase, no imperativo afirmativo e com gerúndio. "Informaram-**me** ontem." Pela norma-padrão, não se começa frase com pronome oblíquo átono.
**Mesóclise (no meio do verbo)**: com futuro do presente ou do pretérito, sem palavra atrativa. "Informar-**te**-ei", "far-**se**-ia".

Decida se há crase: "Refiro-me a esta proposta" (não, porque "esta" não tem artigo). "Entregou o relatório à diretora" (sim). "Ficou frente a frente" (não). "Saiu às pressas" (sim).`;

APO[12] = `## 1. O CDC vale para os bancos

APO[15] = `## 1. Serviço não é produto
As quatro características dos serviços:
- **Intangibilidade:** não dá para tocar nem experimentar antes.
- **Inseparabilidade:** é produzido e consumido ao mesmo tempo, na presença do cliente.
- **Variabilidade (heterogeneidade):** depende de quem atende, quando e onde.
- **Perecibilidade:** não se estoca. Um horário vago do gerente não volta.
Por isso o atendente é parte do produto bancário.

## 2. Mix de marketing
- **4 Ps:** produto, preço, praça (distribuição) e promoção (comunicação).
- **7 Ps de serviços:** acrescenta **pessoas**, **processos** e **evidência física** (ambiente, aplicativo, cartão, comprovante).

## 3. Qualidade percebida
**Satisfação = percepção − expectativa.** Se o cliente esperava pouco e recebeu muito, fica encantado.
O modelo **SERVQUAL** mede a qualidade em 5 dimensões:
- **Confiabilidade:** fazer o prometido, certo, da primeira vez.
- **Responsividade (presteza):** rapidez e disposição para ajudar.
- **Segurança:** conhecimento e cortesia que transmitem confiança.
- **Empatia:** atenção individual, colocar-se no lugar do cliente.
- **Tangíveis:** aparência das instalações, equipamentos e pessoas.
**Momentos da verdade** (Jan Carlzon) são cada contato em que o cliente forma uma opinião sobre a empresa.

## 4. Marketing de relacionamento
- Reter custa menos que conquistar.
- **CRM:** gestão do relacionamento com base em dados do cliente.
- **Omnichannel:** o cliente começa no app e termina na agência sem repetir tudo.
- **NPS:** "de 0 a 10, quanto você recomendaria?" São promotores quem dá 9 e 10, neutros quem dá 7 e 8, detratores quem dá 0 a 6. NPS = % de promotores − % de detratores.
- **Endomarketing:** marketing voltado para os empregados.

## 5. A venda consultiva, passo a passo
1. **Abordagem e rapport:** cumprimente, chame pelo nome, crie confiança.
2. **Sondagem:** perguntas abertas e escuta ativa para descobrir a necessidade. O método **SPIN** organiza as perguntas em situação, problema, implicação e necessidade de solução.
3. **Apresentação:** mostre **benefícios** ligados ao que o cliente disse, e não só características.
4. **Objeções:** ouça, valide e responda. "Está caro" muitas vezes significa "não vi valor".
5. **Fechamento:** proponha o próximo passo de forma clara.
6. **Pós-venda:** acompanhe, confirme a satisfação e abra espaço para nova venda.

## 6. Cross-selling e up-selling com ética
- **Cross-selling:** oferecer produto complementar, como o seguro residencial para quem financiou a casa.
- **Up-selling:** oferecer a versão superior, como um cartão com mais benefícios.
- Os dois são legítimos **se o cliente puder recusar**. Condicionar um produto ao outro é **venda casada**, proibida.
- **Suitability:** investimento só depois de conhecer o perfil do cliente (Resolução CVM 30/2021).

## 7. Metas e ética
O técnico bancário trabalha com metas. A Cesgranrio cobra que a meta nunca justifica enganar o cliente, ocultar custos ou vender produto inadequado. O caminho certo é entender a necessidade, oferecer o que serve e registrar tudo.

## 8. Pegadinhas
- Responsividade é **rapidez e boa vontade**. Confiabilidade é **cumprir o prometido**.
- Valor percebido é benefício em relação ao custo, não preço baixo.
- Vender para quem não precisa gera reclamação, cancelamento e risco à imagem.`;

APO[16] = `## 1. O que é lavagem de dinheiro
É dar aparência legal a dinheiro que veio de uma infração penal. A lei é a **Lei 9.613/1998**. Desde a Lei 12.683/2012, **qualquer infração penal** pode ser crime antecedente, e não mais uma lista fechada. A pena é de **reclusão de 3 a 10 anos**, mais multa.

## 2. As três fases
- **Colocação:** o dinheiro sujo entra no sistema financeiro. Exemplos: depósitos em espécie, compra de bens, depósitos fracionados.
- **Ocultação (estratificação):** muitas transações para apagar o rastro, como transferências entre várias contas, empresas de fachada e remessas ao exterior.
- **Integração:** o dinheiro volta com aparência legal, como investimento em imóveis ou empresas.
**Fracionamento (smurfing):** dividir valores em vários depósitos menores para fugir dos limites de comunicação. É sinal clássico de alerta.

## 3. O COAF
O **Conselho de Controle de Atividades Financeiras** é a unidade de inteligência financeira do Brasil. Desde a Lei 13.974/2020, é **vinculado administrativamente ao Banco Central**. Ele recebe as comunicações, analisa e envia relatórios às autoridades, como Polícia e Ministério Público. O COAF **não** investiga nem pune criminalmente.

## 4. Deveres dos bancos (Circular BCB 3.978/2020)
- Ter **política de PLD/FTP**, aprovada pela diretoria, e fazer **avaliação interna de risco**.
- **Conhecer o cliente (KYC):** identificar, qualificar e classificar o risco. Também conhecer funcionários, parceiros e prestadores.
- Identificar **pessoas expostas politicamente (PEP):** agentes públicos com cargos relevantes, seus familiares e estreitos colaboradores. A condição permanece por **5 anos** depois de deixar o cargo.
- **Registrar** todas as operações e manter os registros por, no mínimo, **10 anos**.
- **Comunicar ao COAF**, pelo Siscoaf:
  operações em espécie de **R$ 50 mil ou mais** (depósito, saque, pagamento, saque provisionado);
  operações e situações **suspeitas**, até o dia útil seguinte à decisão de comunicar.
- Saques em espécie de R$ 50 mil ou mais exigem **provisionamento** com, no mínimo, 3 dias úteis de antecedência.
- **Treinar** os empregados e manter controles internos.

## 5. Sinais de alerta
- Movimentação incompatível com a renda ou o patrimônio declarado.
- Resistência a fornecer informações ou dados inconsistentes.
- Depósitos fracionados logo abaixo do limite.
- Contas de passagem: o dinheiro entra e sai logo.
- Uso de terceiros ou procuradores sem motivo claro.
- Transferências para países de risco ou paraísos fiscais.

## 6. Regras de conduta
- É **proibido avisar o cliente** de que ele foi comunicado ao COAF. Isso se chama *tipping off*.
- Quem comunica de **boa-fé** não responde civil nem administrativamente.
- A comunicação **não** depende de certeza do crime. Basta a suspeita fundamentada.

## 7. Financiamento do terrorismo
A **Lei 13.260/2016** tipifica o terrorismo e seu financiamento. A **Lei 13.810/2019** obriga a cumprir **sem demora** as sanções do Conselho de Segurança da ONU, com bloqueio de bens.

## 8. Pegadinhas
- O COAF é **vinculado ao BC**, e não ao Ministério da Justiça nem ao da Fazenda.
- O limite de comunicação automática em espécie é **R$ 50 mil**.
- O empregado **não** decide se houve crime. Ele comunica a suspeita pela área interna de PLD.`;

APO[17] = `## 1. LGPD em uma frase
A **Lei 13.709/2018** regula o tratamento de **dados pessoais** por pessoas e empresas, públicas ou privadas, para proteger a liberdade e a privacidade. Tratamento é qualquer uso: coletar, guardar, consultar, compartilhar, apagar.

## 2. Conceitos
- **Dado pessoal:** informação sobre pessoa natural identificada ou identificável, como nome, CPF, endereço ou IP.
- **Dado pessoal sensível:** origem racial ou étnica, convicção religiosa, opinião política, filiação sindical, saúde, vida sexual, dado genético ou **biométrico**.
- **Dado anonimizado:** não permite identificar a pessoa e, em regra, fica fora da LGPD.
- **Titular:** a pessoa a quem os dados se referem.
- **Controlador:** quem decide sobre o tratamento, como o banco.
- **Operador:** quem trata dados em nome do controlador, como uma empresa terceirizada.
- **Encarregado (DPO):** o canal entre controlador, titulares e ANPD.
- **ANPD:** a Autoridade Nacional de Proteção de Dados, que fiscaliza e aplica sanções.

## 3. Bases legais (art. 7º)
O tratamento só é permitido com uma base legal. As principais para bancos:
- **consentimento** do titular;
- **cumprimento de obrigação legal ou regulatória** (por exemplo, PLD);
- **execução de contrato**;
- exercício regular de direitos em processo;
- proteção da vida;
- **legítimo interesse**;
- **proteção do crédito**.
Consentimento **não** é a única base, e nem a mais usada pelo banco.

## 4. Direitos do titular (art. 18)
Confirmação e acesso aos dados, correção, anonimização, bloqueio ou eliminação de dados desnecessários, **portabilidade**, informação sobre com quem os dados foram compartilhados e **revogação do consentimento**.

## 5. Princípios
Finalidade, adequação, **necessidade** (usar o mínimo possível), livre acesso, qualidade, transparência, segurança, prevenção, não discriminação e responsabilização.

## 6. Incidentes e sanções
- Incidente de segurança relevante deve ser comunicado à **ANPD e ao titular**.
- Sanções: advertência, **multa de até 2% do faturamento, limitada a R$ 50 milhões por infração**, publicização, bloqueio e eliminação dos dados, entre outras.

## 7. Sigilo bancário (Lei Complementar 105/2001)
As instituições financeiras devem manter sigilo das operações ativas, passivas e dos serviços. **Não** é quebra de sigilo:
- troca de informações cadastrais entre instituições, como sistemas de proteção ao crédito;
- informações ao **Banco Central**, à **CVM** e ao **COAF** no exercício de suas funções;
- informações à **Receita Federal**, nos termos da lei (o STF considerou constitucional);
- revelar com **consentimento expresso** do cliente.
A quebra pode ser decretada pelo **Judiciário** e por **CPI**. Quebrar o sigilo fora das hipóteses legais é crime, com reclusão de 1 a 4 anos.

## 8. Segurança cibernética (Resolução CMN 4.893/2021)
- Bancos devem ter **política de segurança cibernética** e **plano de ação e resposta a incidentes**, aprovados pelo conselho ou pela diretoria.
- Regras para contratar **processamento e armazenamento em nuvem**, inclusive no exterior, com comunicação ao BC.
- Relatório anual sobre incidentes e testes.
- Incidentes relevantes devem ser comunicados ao Banco Central.

## 9. No balcão
- Nunca comente dados de um cliente com outro, nem fale do saldo em voz alta.
- Não fotografe documentos com o celular pessoal.
- Confirme a identidade antes de informar qualquer dado.
- Desconfie de "autoridade" pedindo dados por telefone: o pedido legal vem por ofício.`;

APO[18] = `## 1. Lei Anticorrupção (Lei 12.846/2013)
Trata da responsabilização **administrativa e civil** de **pessoas jurídicas** por atos contra a administração pública, nacional ou estrangeira.
- A responsabilidade da empresa é **objetiva**: não é preciso provar culpa ou dolo.
- Os dirigentes respondem na medida da sua culpa, em outras esferas.
**Atos lesivos:** prometer ou dar vantagem indevida a agente público, financiar atos ilícitos, usar laranjas, fraudar licitação ou contrato, dificultar investigação.
**Sanções administrativas:**
- multa de **0,1% a 20% do faturamento bruto** do ano anterior, nunca menor que a vantagem obtida;
- **publicação extraordinária** da decisão condenatória.
**Sanções judiciais:** perda de bens, suspensão de atividades, dissolução compulsória e proibição de receber incentivos.
**Acordo de leniência:** a empresa colabora, identifica envolvidos e entrega provas em troca de redução da multa em até 2/3 e isenção de algumas sanções. No Poder Executivo federal, é celebrado pela **CGU**.
**Programa de integridade (compliance):** é considerado para reduzir a multa. As regras estão no **Decreto 11.129/2022**, que substituiu o Decreto 8.420/2015.

## 2. Lei das Estatais (Lei 13.303/2016)
Vale para a CAIXA, que é empresa pública. Ela exige:
- **código de conduta e integridade**;
- área de **compliance e gestão de riscos**, vinculada ao diretor-presidente;
- **canal de denúncias**, com proteção ao denunciante;
- **comitê de auditoria estatutário**;
- requisitos e vedações para nomear dirigentes e conselheiros;
- treinamento periódico em integridade.

## 3. Governança corporativa
Os princípios do IBGC (Código das Melhores Práticas, 6ª edição, 2023):
- **Integridade**
- **Transparência**
- **Equidade**
- **Responsabilização (accountability)**
- **Sustentabilidade**
Estrutura típica: assembleia, conselho de administração, diretoria, conselho fiscal, auditoria interna e externa, comitês.

## 4. Modelo das três linhas
- **1ª linha:** gestores e áreas de negócio, que lidam com o risco no dia a dia. A agência está aqui.
- **2ª linha:** compliance, gestão de riscos e controles internos, que apoiam e monitoram.
- **3ª linha:** **auditoria interna**, que avalia de forma independente e reporta ao conselho ou ao comitê de auditoria.

## 5. Ética no trabalho bancário
