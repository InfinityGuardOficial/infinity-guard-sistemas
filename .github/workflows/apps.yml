name: Apps

on:
  push:
    paths:
      - "desktop/**"
      - "android/**"
      - ".github/workflows/apps.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: rota-do-milhao-windows-x64
          path: |
            desktop/dist/*.exe
          retention-days: 90

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle -p android assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Rota-do-Milhao-1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rota-do-milhao-android
          path: Rota-do-Milhao-1.0.0.apk
          retention-days: 90
