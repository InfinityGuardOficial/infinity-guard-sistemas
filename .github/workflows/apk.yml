name: Gerar APK Rumo a Caixa
on:
  push:
    branches: [app-rumo-caixa]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk RumoCaixa.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RumoCaixa-apk
          path: RumoCaixa.apk
      - name: Publicar versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "rumo-caixa-v${{ github.run_number }}" RumoCaixa.apk \
            --target "${{ github.sha }}" --title "Rumo à Caixa ${{ github.run_number }}" \
            --notes "Baixe o RumoCaixa.apk no celular Android e instale." --latest=false
