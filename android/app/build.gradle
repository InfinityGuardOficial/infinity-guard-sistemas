plugins { id "com.android.application" }

android {
    namespace "br.com.infinityguard.rotadomilhao"
    compileSdk 34
    defaultConfig {
        applicationId "br.com.infinityguard.rotadomilhao"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.browser:browser:1.8.0"
}
